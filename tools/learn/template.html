<script>
(function(){
const D = JSON.parse(document.getElementById('learn-data').textContent);
const LANGS = ['uk','en','ru','vi'], LI = {uk:0,en:1,ru:2,vi:3};
let lang = (new URLSearchParams(location.search).get('lang') || '').toLowerCase();
if(!(lang in LI)){ try{ lang = localStorage.getItem('a2-learn-lang') || ''; }catch(e){} }
if(!(lang in LI)) lang = 'uk';
try{ localStorage.setItem('a2-learn-lang', lang); }catch(e){}
document.documentElement.lang = lang;
if(lang !== 'uk') document.title = ((JSON.parse(document.getElementById('learn-data').textContent).ui.title || [])[{uk:0,en:1,ru:2,vi:3}[lang]] || 'Learn Mluvení') + ' – Zkouška A2 nanečisto';
const t = k => (D.ui[k] || [k])[LI[lang]] || (D.ui[k] || [k])[0];
const th = (u, part) => ((D.theory[u] || {})[lang] || (D.theory[u] || {}).uk || {})[part] || '';
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const track = (n, p) => { try{ if(typeof gtag === 'function') gtag('event', n, p || {}); }catch(e){} };
const fold = x => String(x).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

/* header */
$('#backLink').textContent = t('back'); $('#backLink').href = '/' + (lang === 'uk' ? '' : lang + '/');
$('#langs').innerHTML = LANGS.map(l => `<a href="?lang=${l}${location.hash}" ${l === lang ? 'aria-current="page"' : ''}>${{uk:'UA',en:'EN',ru:'RU',vi:'VI'}[l]}</a>`).join('');
function isDark(){ const a = document.documentElement.getAttribute('data-theme'); return a ? a === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); }
function themeUI(){ const b = $('#themeBtn'), d = isDark(); b.textContent = d ? '☀️' : '🌙'; b.title = d ? t('themeL') : t('themeD'); b.setAttribute('aria-label', b.title); }
$('#themeBtn').addEventListener('click', () => { const v = isDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', v); try{ localStorage.setItem('a2-theme', v); }catch(e){} themeUI(); });
themeUI();

/* progress */
let DONE = {}; try{ DONE = JSON.parse(localStorage.getItem('a2-learn-done') || '{}') || {}; }catch(e){ DONE = {}; }
const saveDone = () => { try{ localStorage.setItem('a2-learn-done', JSON.stringify(DONE)); const d = new Date(), k = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); const a = JSON.parse(localStorage.getItem('a2-days') || '[]'); if(!a.includes(k)){ a.push(k); localStorage.setItem('a2-days', JSON.stringify(a.slice(-120))); } }catch(e){} };

/* speech synthesis */
const hasTTS = 'speechSynthesis' in window; let VOICE = null;
function pickVoice(){ if(!hasTTS) return; const v = speechSynthesis.getVoices().filter(x => /^cs/i.test(x.lang)); VOICE = v.find(x => /google|natural|online/i.test(x.name)) || v[0] || null; }
if(hasTTS){ pickVoice(); try{ speechSynthesis.addEventListener('voiceschanged', pickVoice); }catch(e){} }
let GENDER = 'm'; try{ GENDER = localStorage.getItem('a2-gender') === 'f' ? 'f' : 'm'; }catch(e){}
function genderize(t, g){ g = g || GENDER; return String(t).replace(/(\p{L}+)\/(\p{L}+)/gu, (m, a, b) => { const lb = b.toLowerCase(); let f;
  if(lb === 'a' || lb === 'ka') f = a + b; else if(lb === 'á') f = /[ýy]$/i.test(a) ? a.slice(0, -1) + b : a + b; else if(a.slice(0, 3).toLowerCase() === lb.slice(0, 3)) f = b; else return m;
  return g === 'f' ? f : a; }); }
function setGender(g){ GENDER = g === 'f' ? 'f' : 'm'; try{ localStorage.setItem('a2-gender', GENDER); }catch(e){} document.querySelectorAll('[data-gender]').forEach(b => b.setAttribute('aria-pressed', b.dataset.gender === GENDER)); track('learn_gender', {g: GENDER}); }
document.addEventListener('click', e => { const b = e.target.closest('[data-gender]'); if(b) setGender(b.dataset.gender); });
function genderHTML(){ return `<div class="gsel"><span class="small">${t('genderL')}</span><button class="btn sm" type="button" data-gender="m" aria-pressed="${GENDER === 'm'}">♂ ${t('gM')}</button><button class="btn sm" type="button" data-gender="f" aria-pressed="${GENDER === 'f'}">♀ ${t('gF')}</button></div>`; }
const EL_M = 'e36pGtHFyzkf4HTb9rQG', EL_F = 'vdZa6jplen8RQdIWzOGX'; let AU = null;
async function elKey(v, t){ const b = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(v + '|' + t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('').slice(0, 16); }
function ttsSpeak(text, slow){ if(!hasTTS) return; try{ speechSynthesis.cancel(); }catch(e){}
  const u = new SpeechSynthesisUtterance(text); u.lang = 'cs-CZ'; if(VOICE) u.voice = VOICE; u.rate = slow ? 0.7 : 0.92;
  setTimeout(() => { try{ speechSynthesis.speak(u); }catch(e){} }, 60); }

/* speech recognition */
const SRC = window.SpeechRecognition || window.webkitSpeechRecognition; let SR = null;
const srNorm = x => fold(x).replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
function srMerge(list){ const out = []; for(const tx of list){ const n = srNorm(tx); if(!n) continue; const p = out.length ? srNorm(out[out.length-1]) : null;
  if(p !== null && n.startsWith(p)) out[out.length-1] = tx; else if(p !== null && (p.startsWith(n) || p.endsWith(n))) continue; else out.push(tx); } return out; }
const STOP = new Set('a i v ve na se je jsem jsi jsme jste to ten ta do z ze k ke s so o u po za pro ale protoze kdyz jak co kde kdy uz jen tak taky take moc velmi mi me mu ji jim nas vas'.split(' '));
function feedback(said, model, q){
  const W = srNorm(said).split(' ').filter(Boolean), M = new Set(srNorm(model).split(' ').filter(w => w.length > 2 && !STOP.has(w)));
  const common = [...new Set(W)].filter(w => M.has(w));
  const qv = srNorm(q).split(' ').filter(w => w.length > 3 && !STOP.has(w)).map(w => w.slice(0, 3));
  const verbHit = qv.some(st => W.some(w => w.startsWith(st)));
  const items = [`<li class="${W.length >= 6 ? 'ok' : 'no'}">${W.length} ${t('fbWords')}. ${W.length >= 6 ? t('fbOk') : t('fbShort')}</li>`,
    `<li class="${verbHit ? 'ok' : 'no'}">${verbHit ? t('fbVerb') : t('fbNoVerb')}</li>`];
  if(common.length) items.push(`<li class="ok">✓ ${esc(common.slice(0, 6).join(', '))}</li>`);
  return `<ul class="fb">${items.join('')}</ul>`; }
const PAST_X = new Set('fotbal fotbalu kostel hotel mobil michal pavel karel pavla karla anil kolo kola kole kolem skola skolu skoly skole skolka stul stolu stole sul mel? dal? hotel hotelu ale jedli? mala malo male mali maly cela celo cely celi dila dilo vila sila pila? zela'.split(' ').filter(w => !w.endsWith('?')));
const isPast = w => w.length > 2 && /(l|la|lo|li|ly)$/.test(w) && !PAST_X.has(w) && !/(ell|all|ill)$/.test(w);
function pastMark(text){ return esc(text).replace(/[A-Za-zÀ-ž]+/g, w => isPast(fold(w)) ? `<mark>${w}</mark>` : w); }
function feedback3(said){
  const W = srNorm(said).split(' ').filter(Boolean), past = W.filter(isPast).length;
  const conn = [...new Set(W.filter(w => /^(nejdriv|nejprve|potom|pak|nakonec|najednou|kdyz|vecer|rano|odpoledne|vcera)$/.test(w)))];
  return `<ul class="fb"><li class="${W.length >= 60 ? 'ok' : 'no'}">${W.length} ${t('fbWords')} ${W.length >= 60 ? '✓' : '· ' + t('fb3len')}</li>
  <li class="${past >= 6 ? 'ok' : 'no'}">${t('fb3past')}: ${past} ${past >= 6 ? '✓' : '· ' + t('fb3pastMore')}</li>
  <li class="${conn.length >= 2 ? 'ok' : 'no'}">${t('fb3conn')}: ${conn.length ? esc(conn.join(', ')) : '–'} ${conn.length >= 2 ? '✓' : '· Nejdřív… Potom… Nakonec…'}</li></ul>`; }
function srToggle(btn, out, model, q, kind){
  if(SR){ const same = SR.btn === btn; SR.user = true; try{ SR.rec.stop(); }catch(e){} if(same) return; }
  if(!SRC){ out.innerHTML = `<p class="note">${t('noSR')}</p>`; return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  const st = {btn, finals: [], user: false, t0: Date.now()}; const label = btn.textContent;
  const start = () => { const rec = new SRC(); rec.lang = 'cs-CZ'; rec.continuous = true; rec.interimResults = true; st.rec = rec; const base = st.finals.slice();
    rec.onresult = e => { let fin = [], it = ''; for(let i = 0; i < e.results.length; i++){ const r = e.results[i], tx = (r[0].transcript || '').trim(); if(!tx) continue; if(r.isFinal) fin.push(tx); else if(i >= e.resultIndex) it += ' ' + tx; }
      st.finals = srMerge(base.concat(fin)); out.innerHTML = `<p class="heard">${esc(st.finals.join(' · '))} <i>${esc(it)}</i></p>`; };
    rec.onerror = e => { if(e.error === 'no-speech' || e.error === 'aborted') return; st.user = true; out.innerHTML = `<p class="note">${t('noSR')}</p>`; };
    rec.onend = () => { if(!st.user && Date.now() - st.t0 < 120000){ try{ start(); return; }catch(err){} }
      if(SR === st) SR = null; btn.classList.remove('on'); btn.textContent = label;
      if(st.tm){ clearInterval(st.tm); st.tm = null; }
      const said = st.finals.join('. ');
      out.innerHTML = said ? `<p class="heard"><b>${t('heard')}:</b> ${esc(said)}</p>${kind === 'u3' ? feedback3(said) : kind === 'u2' ? feedback2(said) : kind === 'u4' ? feedback4(said) : feedback(said, model, q)}` : `<p class="note">${t('nothing')}</p>`; };
    rec.start(); };
  try{ start(); }catch(err){ out.innerHTML = `<p class="note">${t('noSR')}</p>`; return; }
  SR = st; btn.classList.add('on'); btn.textContent = t('stop'); out.innerHTML = `<p class="note">${t('listening')}</p>`; track('learn_speak', {kind: kind || 'u1'});
  const tmEl = btn.closest('.sheet') && btn.closest('.sheet').querySelector('.tmr');
  if(kind === 'u3' && tmEl){ const t0 = Date.now(); tmEl.classList.remove('over'); st.tm = setInterval(() => { const left = 60 - Math.floor((Date.now() - t0) / 1000);
    tmEl.textContent = left > 0 ? '⏱ 0:' + String(left).padStart(2, '0') : '⏱ 0:00 · ' + t('timeUp'); if(left <= 0){ tmEl.classList.add('over'); clearInterval(st.tm); st.tm = null; } }, 250); }
}

  <div class="acts"><button class="btn ${DONE[k] ? '' : 'primary'}" type="button" data-done="${k}">${DONE[k] ? t('unmarkL') : t('markL')}</button>${i + 1 < D[u].length ? `<a class="btn" href="#${u}-${i + 1}">${esc(D[u][i + 1].cz)} →</a>` : ''}</div></section>`; }
const wcount = x => (String(x).match(/[A-Za-zÀ-ž0-9]+/g) || []).length;
function areaHTML(min, id){ return `<textarea class="wta" id="${id}" rows="${min > 20 ? 9 : 3}" spellcheck="false" lang="cs" data-min="${min}" placeholder="${t('writeHere')}"></textarea><div class="wbar"><span class="wcnt" data-for="${id}">0 / ${min} ${t('fbWords')}</span><button class="btn sm" type="button" data-wcheck="${id}">${t('check')}</button></div><div class="wfb" data-fb="${id}"></div>`; }
function checkForm(txt, q){
  const n = wcount(txt), T = srNorm(txt), Q = srNorm(q).split(' ').filter(w => w.length > 3 && !STOP.has(w)).map(w => w.slice(0, 4));
  const verb = Q.some(st => T.split(' ').some(w => w.startsWith(st)));
  const cap = /^\s*[A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ]/.test(txt), dot = /[.!?]\s*$/.test(txt);
  return `<ul class="fb"><li class="${n >= 10 ? 'ok' : 'no'}">${n} ${t('fbWords')} ${n >= 10 ? '✓' : '· ' + t('fbW1min')}</li><li class="${verb ? 'ok' : 'tip'}">${verb ? t('fbVerb') : t('fbNoVerb')}</li><li class="${cap && dot ? 'ok' : 'no'}">${cap && dot ? t('fbSent') : t('fbNoSent')}</li></ul>`; }
function checkMail(txt){
  const n = wcount(txt), T = srNorm(txt);
  const lines = txt.trim().split(/\n+/), tail = srNorm(lines.slice(-3).join(' '));
  const greet = /^(dobry den|dobre rano|dobry vecer|ahoj|cau|vazen|mil[aeiouy]|zdravim)/.test(T), close = lines.length > 1 && /(s pozdravem|dekuj|diky|mej se|mejte se|tesim se|zdravim|na shledanou|ahoj|cau|promin|tvoje|tvuj|vase|vas|brzy|na viden|hezky den)/.test(tail);
  const last = (lines[lines.length - 1] || '').trim(), sign = lines.length > 1 && wcount(last) <= 6 && /^[A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ]/.test(last);
  const sents = (txt.match(/[.!?](\s|$)/g) || []).length;
  const formal = /^(dobry den|vazen)/.test(T), casual = /^(ahoj|cau)/.test(T) && !/^(ahoj|cau) (vsichni|vsem|kolegove|sousede)/.test(T);
  const vy = formal || /\b(muzete|mate|chcete|budete|napiste|dejte|prijdte)\b/.test(T), ty = casual || /\b(ti|tebe|muzes|mas|chces|budes|napis|dej|prijd)\b/.test(T);
  return `<ul class="fb"><li class="${n >= 35 ? 'ok' : 'no'}">${n} ${t('fbWords')} ${n >= 35 ? '✓' : '· ' + t('fbW2min')}</li>
  <li class="${greet ? 'ok' : 'no'}">${greet ? t('fbGreet') : t('fbNoGreet')}</li><li class="${close ? 'ok' : 'no'}">${close ? t('fbClose') : t('fbNoClose')}</li>
  <li class="${sign ? 'ok' : 'no'}">${sign ? t('fbSign') : t('fbNoSign')}</li><li class="${sents >= 4 ? 'ok' : 'no'}">${t('fbSents')}: ${sents} ${sents >= 4 ? '✓' : '· ' + t('fbSentsMore')}</li>
  ${vy && ty ? `<li class="no">${t('fbMix')}</li>` : ''}</ul>`; }
function formView(u, i){
  const it = (D[u] || [])[i]; if(!it) return lesson(u); const k = u + '-' + i;
  return `<section class="sheet u ${u}"><a href="#${u}" class="small">${t('toList')}</a>
  <div><span class="small muted">${t(u)} · ${t('form')} ${i + 1} / ${D[u].length}</span><h2>${esc(it.cz)}</h2><p>${esc(it.situation)}</p></div>
  ${it.qa.map((p, n) => `<div class="qa"><div class="qrow"><span class="num">${n + 1}.</span><span class="qtext">${esc(p[0])}</span></div>${areaHTML(10, 'f' + n)}
    <div class="acts"><button class="btn sm" type="button" data-show>${t('showModel')}</button></div><div class="ans" hidden><button class="btn sm" type="button" data-say="${esc(p[1])}">▶</button><p>${esc(p[1])} <span class="muted small">(${wcount(p[1])} ${t('fbWords')})</span></p></div></div>`).join('')}
  <div class="acts"><button class="btn ${DONE[k] ? '' : 'primary'}" type="button" data-done="${k}">${DONE[k] ? t('unmarkL') : t('markL')}</button>${i + 1 < D[u].length ? `<a class="btn" href="#${u}-${i + 1}">${esc(D[u][i + 1].cz)} →</a>` : ''}</div></section>`; }
function mailHTML(it, id){
  return `<div class="mailhead"><span><b>Komu:</b> ${esc(it.to)}</span><span><b>Předmět:</b> ${esc(it.subject)}</span></div>
  <div class="frames prompts">${it.prompts.map((p, j) => `<figure class="frame"><span class="fn">${j + 1}</span><div class="scene">${(p.om || []).map((c, q) => `<img src="../img/om/${c}.svg" alt="" class="${q ? 'sub' : 'main'}">`).join('')}</div><figcaption><span>${esc(p.q)}</span></figcaption></figure>`).join('')}</div>
  ${areaHTML(35, id)}`; }
function mailView(u, i){
  const it = (D[u] || [])[i]; if(!it) return lesson(u); const k = u + '-' + i;
  return `<section class="sheet u ${u}"><a href="#${u}" class="small">${t('toList')}</a>
  <div><span class="small muted">${t(u)} · ${t('mail')} ${i + 1} / ${D[u].length}</span><h2>${esc(it.cz)}</h2><p>${esc(it.situation)}</p></div>
  <div class="story">${mailHTML(it, 'm0')}<div class="acts"><button class="btn sm" type="button" data-show>${t('showModel')}</button></div>
  <div class="ans model" hidden><div class="acts"><b>${t('modelMail')}</b><button class="btn sm" type="button" data-say="${esc(it.model)}">▶</button><span class="muted small">${wcount(it.model)} ${t('fbWords')}</span></div><pre class="mailtxt">${esc(it.model)}</pre></div></div>
  <div class="acts"><button class="btn ${DONE[k] ? '' : 'primary'}" type="button" data-done="${k}">${DONE[k] ? t('unmarkL') : t('markL')}</button>${i + 1 < D[u].length ? `<a class="btn" href="#${u}-${i + 1}">${esc(D[u][i + 1].cz)} →</a>` : ''}</div></section>`; }
let WT = null;
function trainW(){
  const f = D.w1[Math.floor(Math.random() * D.w1.length)], m = D.w2[Math.floor(Math.random() * D.w2.length)]; track('learn_train', {u: 'w'});
  if(WT) clearInterval(WT.iv); WT = {t0: Date.now(), iv: null};
  setTimeout(() => { WT.iv = setInterval(() => { const el = $('#wclock'); if(!el){ clearInterval(WT.iv); return; } const left = 25 * 60 - Math.floor((Date.now() - WT.t0) / 1000);
    el.textContent = '⏱ ' + (left > 0 ? Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') : '0:00 · ' + t('timeUp')); el.classList.toggle('over', left <= 300); }, 500); }, 50);
  return `<section class="sheet u w1"><a href="#" class="small">${t('home')}</a><div class="trainbox"><b>🎯 ${t('practiceW')}</b><p class="small">${t('practiceWD')}</p><span class="tmr mono" id="wclock">⏱ 25:00</span></div>
  <h3>1 · ${esc(f.cz)}</h3><p>${esc(f.situation)}</p>
  ${f.qa.map((p, n) => `<div class="qa"><div class="qrow"><span class="num">${n + 1}.</span><span class="qtext">${esc(p[0])}</span></div>${areaHTML(10, 'tf' + n)}<div class="acts"><button class="btn sm" type="button" data-show>${t('showModel')}</button></div><div class="ans" hidden><p>${esc(p[1])}</p></div></div>`).join('')}
  <h3>2 · E-mail: ${esc(m.cz)}</h3><p>${esc(m.situation)}</p><div class="story">${mailHTML(m, 'tm')}<div class="acts"><button class="btn sm" type="button" data-show>${t('showModel')}</button></div><div class="ans model" hidden><pre class="mailtxt">${esc(m.model)}</pre></div></div>
  <a class="btn primary" href="#w-train" data-retrain>${t('another')}</a></section>`; }
let TR = null;
function train(u){
  const items = D[u]; const pick = []; const idx = items.map((_, i) => i).sort(() => Math.random() - 0.5).slice(0, 2);
  idx.forEach(ti => { items[ti].qa.map((p, qi) => qi).sort(() => Math.random() - 0.5).slice(0, 4).sort((a, b) => a - b).forEach(qi => pick.push([ti, qi])); });
  TR = {u, pick, n: 0}; track('learn_train', {u}); return trainView(); }
function trainView(){
  const {u, pick, n} = TR; const items = D[u];
  if(n >= pick.length) return `<section class="sheet u ${u}"><a href="#${u}" class="small">${t('toLesson')}</a><div class="trainbox"><p class="big">🎉 ${t('done')}</p><a class="btn primary" href="#${u}-train" data-retrain>${t('again')}</a></div></section>`;
  const [ti, qi] = pick[n], it = items[ti], [q, a] = it.qa[qi];
  return `<section class="sheet u ${u}"><a href="#${u}" class="small">${t('toLesson')}</a>
  <div class="trainbox"><span class="small muted">${t('topic')}: <b>${esc(it.cz)}</b> · ${t('qOf')} ${n + 1} / ${pick.length}</span>
  <div class="qrow"><button class="btn sm" type="button" data-say="${esc(q)}">▶</button><span class="big">${esc(q)}</span></div>
  <div class="acts"><button class="btn sm" type="button" data-sr data-model="${esc(a)}" data-q="${esc(q)}">${t('say')}</button><button class="btn sm" type="button" data-show>${t('showA')}</button></div>
  <div class="ans" hidden><button class="btn sm" type="button" data-say="${esc(a)}">▶</button><p>${esc(a)}</p></div><div class="srout"></div>
  <button class="btn primary" type="button" data-next>${t('next')}</button></div></section>`; }

function route(){
  if(SR){ SR.user = true; try{ SR.rec.stop(); }catch(e){} SR = null; }
  try{ speechSynthesis.cancel(); }catch(e){} if(AU){ try{ AU.pause(); }catch(e){} }
  const h = location.hash.replace('#', ''); let html;
  let m;
  if(!h || h === 'psani') html = home();
  else if(h === 'w-train' && ready('w1')) html = trainW();
  else if((m = h.match(/^(u[1-4])-train$/)) && ready(m[1])){ if(m[1] === 'u3') html = train3(m[1]); else { html = train(m[1]); setTimeout(() => { const b = $('.trainbox [data-say]'); if(b) speak(b.dataset.say, false, b); }, 300); } }
  else if((m = h.match(/^(w[12])-(\d+)$/)) && ready(m[1])){ html = m[1] === 'w1' ? formView(m[1], +m[2]) : mailView(m[1], +m[2]); track('learn_topic', {u: m[1], i: +m[2]}); }
  else if((m = h.match(/^(w[12])$/)) && ready(m[1])){ html = lesson(m[1]); track('learn_lesson', {u: m[1]}); }
  else if((m = h.match(/^(u[1-4])-(\d+)$/)) && ready(m[1])){ html = m[1] === 'u3' ? story(m[1], +m[2]) : m[1] === 'u2' ? card(m[1], +m[2]) : m[1] === 'u4' ? sit(m[1], +m[2]) : topic(m[1], +m[2]); track('learn_topic', {u: m[1], i: +m[2]}); }
  else if((m = h.match(/^(u[1-4])$/)) && ready(m[1])){ html = lesson(m[1]); track('learn_lesson', {u: m[1]}); }
  else html = home();
  $('#app').innerHTML = html; window.scrollTo({top: 0});
  if((m = h.match(/^([uw][1-4])-(\d+)$/)) && YT.sec[m[1]]){ const h2 = $('#app .sheet h2'); if(h2){ const host = h2.parentElement.tagName === 'SECTION' ? h2 : h2.parentElement; host.insertAdjacentHTML('afterend', ytTopic(m[1], +m[2])); } }
  if(h === 'psani'){ const g = $('#g-psani'); if(g) setTimeout(() => g.scrollIntoView({block: 'start'}), 50); }
}
window.addEventListener('hashchange', route);
document.addEventListener('input', e => { const ta = e.target.closest('.wta'); if(!ta) return; const c = document.querySelector(`.wcnt[data-for="${ta.id}"]`), n = wcount(ta.value), min = +ta.dataset.min;
  if(c){ c.textContent = n + ' / ' + min + ' ' + t('fbWords'); c.classList.toggle('ok', n >= min); } });
document.addEventListener('click', e => {
  const cz = e.target.closest('.cz'); if(cz){ speak(cz.textContent.replace(/[/]/g, ' '), false, 'ex'); return; }
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.say){ speak(b.dataset.say, !!b.dataset.slow, b); return; }
  if(b.dataset.wcheck){ const ta = document.getElementById(b.dataset.wcheck), fb = document.querySelector(`.wfb[data-fb="${b.dataset.wcheck}"]`); if(!ta || !fb) return;
    const q = (ta.closest('.qa') && ta.closest('.qa').querySelector('.qtext')) ? ta.closest('.qa').querySelector('.qtext').textContent : '';
    fb.innerHTML = +ta.dataset.min >= 35 ? checkMail(ta.value) : checkForm(ta.value, q); track('learn_write_check'); return; }
  if(b.hasAttribute('data-show')){ const box = b.closest('.qa, .trainbox, .story').querySelector('.ans'); box.hidden = !box.hidden; b.textContent = box.hidden ? t('showA') : t('hideA'); return; }
  if(b.hasAttribute('data-sr')){ srToggle(b, b.closest('.qa, .trainbox, .story').querySelector('.srout'), b.dataset.model, b.dataset.q, b.dataset.kind); return; }
  if(b.dataset.done){ const k = b.dataset.done; if(DONE[k]) delete DONE[k]; else DONE[k] = 1; saveDone(); route(); return; }
  if(b.hasAttribute('data-next')){ TR.n++; $('#app').innerHTML = trainView(); const s = $('.trainbox [data-say]'); if(s) speak(s.dataset.say, false, s); return; }
  if(b.dataset.vid){ const ph = b.closest('.ph'); const L = {uk:'uk', en:'en', ru:'ru', vi:'vi'}[lang] || 'uk';
    ph.outerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(b.dataset.vid)}?autoplay=1&rel=0&playsinline=1&cc_load_policy=1&cc_lang_pref=${L}&hl=${L}" title="YouTube" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`; track('learn_video', {id: b.dataset.vid}); return; }
});
document.addEventListener('click', e => { const a = e.target.closest('[data-ytsub],[data-ytout]'); if(a) track(a.hasAttribute('data-ytsub') ? 'youtube_subscribe' : 'youtube_click', {place: 'learn', page: location.hash || '#'}); });
document.addEventListener('click', e => { const a = e.target.closest('[data-retrain]'); if(a && location.hash === a.getAttribute('href')){ e.preventDefault(); route(); } });
route();
})();
</script>
