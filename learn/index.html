, щоб почути його.","Tip: click any Czech example in the explanation to hear it.","Совет: нажмите на любой чешский пример в объяснении, чтобы услышать его.","Mẹo: bấm vào bất kỳ ví dụ tiếng Séc nào trong phần giải thích để nghe."],"progress":["Вивчено тем","Topics learned","Изучено тем","Chủ đề đã học"],"themeD":["Увімкнути темну тему","Switch to dark theme","Включить тёмную тему","Bật giao diện tối"],"themeL":["Увімкнути світлу тему","Switch to light theme","Включить светлую тему","Bật giao diện sáng"],"langName":["Мова","Language","Язык","Ngôn ngữ"]},"theory":{"u1":{"uk":{"how":"\n<p>Екзаменатор називає <b>тему<\/b> і ставить <b>4 питання<\/b>. Потім друга тема і ще 4 питання. Разом 8 питань, близько 3 хвилин, <b>8 балів<\/b>. Питань ви заздалегідь не бачите, лише чуєте.<\/p>\n<ul>\n<li>Питання прості, про ваше життя: де живете, що робите, що робили вчора, що будете робити.<\/li>\n<li>У кожній темі зазвичай є питання в <b>різних часах<\/b>: теперішньому, минулому, майбутньому, а часто й «що б ви хотіли».<\/li>\n<li>Оцінюють, чи ви зрозуміли питання, чи відповіли <b>цілим реченням<\/b>, чи правильний час і чи достатньо слів.<\/li>\n<\/ul>","grammar":"\n<h4>Формула доброї відповіді<\/h4>\n<p class=\"formula\">Відповідь цілим реченням <span>+<\/span> одна деталь <span>+<\/span> <span class=\"cz\">protože…<\/span> / <span class=\"cz\">a…<\/span> / <span class=\"cz\">ale…<\/span><\/p>\n<p>Не <span class=\"cz\">V Kralupech.<\/span>, а <span class=\"cz\">Bydlím v Kralupech, je to malé město blízko Prahy.<\/span><\/p>\n<h4>Головний секрет: беріть дієслово з питання<\/h4>\n<table class=\"tbl\">\n<tr><th>Питання<\/th><th>Відповідь починається так<\/th><th>Час<\/th><\/tr>\n<tr><td><span class=\"cz\">Kde bydlíte?<\/span><\/td><td><span class=\"cz\">Bydlím…<\/span><\/td><td>теперішній<\/td><\/tr>\n<tr><td><span class=\"cz\">Co děláte ve volném čase?<\/span><\/td><td><span class=\"cz\">Ve volném čase dělám / čtu / chodím…<\/span><\/td><td>теперішній<\/td><\/tr>\n<tr><td><span class=\"cz\">Co jste dělal/a včera?<\/span><\/td><td><span class=\"cz\">Včera jsem dělal/a…<\/span><\/td><td>минулий<\/td><\/tr>\n<tr><td><span class=\"cz\">Kde jste byl/a na dovolené?<\/span><\/td><td><span class=\"cz\">Na dovolené jsem byl/a…<\/span><\/td><td>минулий<\/td><\/tr>\n<tr><td><span class=\"cz\">Co budete dělat o víkendu?<\/span><\/td><td><span class=\"cz\">O víkendu budu…<\/span> / <span class=\"cz\">pojedu…<\/span> / <span class=\"cz\">půjdu…<\/span><\/td><td>майбутній<\/td><\/tr>\n<tr><td><span class=\"cz\">Co byste chtěl/a…?<\/span><\/td><td><span class=\"cz\">Chtěl/a bych…<\/span><\/td><td>«хотів би»<\/td><\/tr>\n<\/table>\n<h4>Теперішній час: закінчення «я»<\/h4>\n<p><span class=\"cz\">bydlet → bydlím<\/span> · <span class=\"cz\">dělat → dělám<\/span> · <span class=\"cz\">mít → mám<\/span> · <span class=\"cz\">být → jsem<\/span> · <span class=\"cz\">pracovat → pracuju<\/span> · <span class=\"cz\">jít → jdu<\/span> · <span class=\"cz\">jet → jedu<\/span><\/p>\n<h4>Минулий час: дієслово на -l + jsem<\/h4>\n<p><span class=\"cz\">dělat → dělal jsem<\/span> (чоловік) / <span class=\"cz\">dělala jsem<\/span> (жінка). У питанні «ви»: <span class=\"cz\">Co jste dělal/a?<\/span> Відповідь «я»: <span class=\"cz\">Dělal/a jsem…<\/span><\/p>\n<p>Часті неправильні: <span class=\"cz\">být → byl/a<\/span> · <span class=\"cz\">jít → šel / šla<\/span> · <span class=\"cz\">jet → jel/a<\/span> · <span class=\"cz\">mít → měl/a<\/span> · <span class=\"cz\">jíst → jedl/a<\/span> · <span class=\"cz\">vidět → viděl/a<\/span><\/p>\n<h4>Майбутній час<\/h4>\n<p><span class=\"cz\">budu + інфінітив<\/span>: <span class=\"cz\">budu pracovat, budu se učit<\/span>. Рух: <span class=\"cz\">pojedu<\/span> (поїду), <span class=\"cz\">půjdu<\/span> (піду). Коли: <span class=\"cz\">zítra, o víkendu, příští týden, příští rok<\/span>.<\/p>\n<h4>«Хотів би»<\/h4>\n<p><span class=\"cz\">Chtěl bych<\/span> (чоловік) / <span class=\"cz\">Chtěla bych<\/span> (жінка) + інфінітив: <span class=\"cz\">Chtěla bych mít větší byt.<\/span><\/p>","tips":"\n<ul>\n<li><b>Не зрозуміли питання?<\/b> Попросіть повторити: <span class=\"cz\">Promiňte, můžete to zopakovat?<\/span> Це нормально, балів за це не знімають.<\/li>\n<li><b>Не відповідайте одним словом.<\/b> «Ano» чи «V sobotu» майже нічого не дає. Додайте речення.<\/li>\n<li><b>Слухайте, в якому часі питання<\/b>: <span class=\"cz\">jste dělal/a<\/span> — минулий, <span class=\"cz\">budete<\/span> — майбутній.<\/li>\n<li><b>Не знаєте слова?<\/b> Скажіть простіше: замість <span class=\"cz\">účetní<\/span> — <span class=\"cz\">pracuju v kanceláři s čísly<\/span>.<\/li>\n<li><b>Підготуйте розповідь про себе<\/b> на 1 хвилину: ім'я, звідки ви, сім'я, робота, хобі. Її шматки підходять до багатьох тем.<\/li>\n<li>Відповідь не мусить бути правдою. Головне, щоб вона була правильна й зрозуміла.<\/li>\n<\/ul>"}},"u2":{},"u3":{},"u4":{}},"videos":{"home":[["NmmVbgWpIfo","Zkouška pro trvalý pobyt A2: Co se mění v dubnu 2026?"],["dZe4_xv6QkM","Zkouška pro trvalý pobyt A2: Mluvení – jak vypadá a jak se připravit"]],"u1":[["a8i-TWtrAwE","Mluvení – umíte odpovědět na otázky?"],["VJ_1cz6DowY","Czech Language Exam A2: Common Questions and Answers from the Examiner"],["3P7Bb-JSggo","Zkouška pro trvalý pobyt A2: Moje rodina (mluvení)"]],"u2":[["8h3rjTZHzr8","Mluvení, úloha 2 – další příklady"],["ojyeYcwEgM4","Czech A2 exam – speaking (roleplays)"],["yEhP3U98glw","Czech A2 Exam Speaking 2026 – BIG Overview with Examples"]],"u3":[["2ZiLJaTHIQ8","Learn Czech Past Tense for the A2 Exam"],["wM-i8G-a_aE","Mluvení – úlohy 3 a 4"],["kgWPlOsxKNs","Nová zkouška z češtiny A2 2026: Jak zvládnout mluvení bez stresu"]],"u4":[["evQzRMJIfYA","Mluvení, nová úloha 4 – další cvičení"],["m558l91RI54","Mluvení, nová úloha 4 – cvičení"]]},"u1":[{"cz":"O mně","t":["Про себе","About me","О себе","Về bản thân"],"qa":[["Jak se jmenujete?","Jmenuju se Olena Kovalenko. Přátelé mi říkají Lena."],["Odkud jste?","Jsem z Ukrajiny, z města Charkov. Je to velké město na východě."],["Kde teď bydlíte?","Teď bydlím v Kralupech nad Vltavou s rodinou."],["Jak dlouho jste v Česku?","V Česku jsem už pět let. Přijel/a jsem v roce 2021."],["Co děláte?","Pracuju ve skladu a ve volném čase se učím česky."],["Jaké jazyky umíte?","Umím ukrajinsky, rusky a trochu česky a anglicky."],["Jaký jste člověk?","Myslím, že jsem klidný/á a přátelský/á. Rád/a pomáhám lidem."],["Co jste dělal/a před příjezdem do Česka?","Na Ukrajině jsem pracoval/a jako prodavač/ka v obchodě."],["Proč jste přijel/a do Česka?","Přijel/a jsem kvůli práci a protože tady žijí moji příbuzní."],["Co byste chtěl/a dělat za pět let?","Za pět let bych chtěl/a mít lepší práci a mluvit dobře česky."]]},{"cz":"Rodina","t":["Родина","Family","Семья","Gia đình"],"qa":[["Kolik lidí má vaše rodina?","Moje rodina má čtyři lidi: manžela, dva syny a mě."],["Máte sourozence?","Ano, mám jednoho bratra. Je o tři roky starší a bydlí na Ukrajině."],["Kde bydlí vaši rodiče?","Moji rodiče bydlí na Ukrajině v malém městě u řeky."],["Co dělá váš manžel nebo vaše manželka?","Moje manželka pracuje v nemocnici jako zdravotní sestra."],["Kolik let mají vaše děti?","Syn má devět let a dcera má pět let. Syn chodí do třetí třídy."],["Co rádi děláte jako rodina?","Jako rodina rádi chodíme na procházky a o víkendu hrajeme hry."],["Jak často voláte rodičům?","Rodičům volám skoro každý den večer, když jsou doma."],["Kdy jste naposledy viděl/a rodiče?","Rodiče jsem naposledy viděl/a loni v létě, když přijeli na návštěvu."],["Jak jste slavili poslední narozeniny v rodině?","Synovi jsme minulý měsíc udělali oslavu doma s dortem a kamarády."],["Kam pojedete příště s rodinou?","Příští léto pojedeme s rodinou k moři do Chorvatska."]]},{"cz":"Kamarádi","t":["Друзі","Friends","Друзья","Bạn bè"],"qa":[["Máte v Česku kamarády?","Ano, mám tady několik kamarádů. Některé znám z práce."],["Jak často se scházíte s kamarády?","S kamarády se scházím asi jednou týdně, většinou v sobotu."],["Jak vypadá váš nejlepší kamarád?","Můj nejlepší kamarád je vysoký, má krátké černé vlasy a nosí brýle."],["Jaký je váš nejlepší kamarád?","Je veselý a vždycky pomůže, když mám problém."],["Co děláte s kamarády?","S kamarády chodíme do kavárny, hrajeme fotbal nebo grilujeme."],["Kde jste se seznámil/a s nejlepším kamarádem?","S nejlepším kamarádem jsem se seznámil/a v práci před třemi lety."],["Kdy jste naposledy navštívil/a kamaráda a proč?","Minulou neděli jsem navštívil/a kamaráda, protože měl narozeniny."],["Máte kamarády Čechy?","Mám jednu kamarádku Češku. Pomáhá mi s češtinou."],["Co budete dělat s kamarády o víkendu?","O víkendu půjdeme s kamarády na výlet do Prahy."],["Proč jsou kamarádi důležití?","Kamarádi jsou důležití, protože s nimi můžu mluvit o všem."]]},{"cz":"Bydlení","t":["Житло","Housing","Жильё","Nhà ở"],"qa":[["Bydlíte v bytě, nebo v domě?","Bydlím v bytě v paneláku ve třetím patře."],["Jak velký je váš byt?","Náš byt je dva plus jedna. Má dva pokoje a kuchyň."],["Kolik platíte za nájem?","Za nájem platíme dvanáct tisíc korun měsíčně i s energiemi."],["Co máte v obývacím pokoji?","V obývacím pokoji máme gauč, stůl, televizi a velkou skříň."],["Jaký nábytek potřebuje každý člověk a proč?","Každý člověk potřebuje postel, protože musí dobře spát."],["Líbí se vám váš byt?","Ano, byt se mi líbí, protože je světlý a blízko je park."],["Jak vypadal váš domov v dětství?","V dětství jsem bydlel/a s rodiči v malém domě se zahradou."],["Kdy jste se naposledy stěhoval/a?","Naposledy jsem se stěhoval/a před dvěma lety do většího bytu."],["Co byste chtěl/a v bytě změnit?","Chtěl/a bych novou kuchyň a větší koupelnu."],["Jaký domov byste chtěl/a za deset let?","Za deset let bych chtěl/a vlastní dům se zahradou."]]},{"cz":"Moje město","t":["Моє місто","My town","Мой город","Thành phố của tôi"],"qa":[["Ve kterém městě bydlíte?","Bydlím v Kralupech nad Vltavou. Je to malé město blízko Prahy."],["Je vaše město velké, nebo malé?","Moje město je malé, má asi osmnáct tisíc obyvatel."],["Co je ve vašem městě zajímavé?","Zajímavá je řeka Vltava a hezký park u nádraží."],["Kam chodíte ve městě nejraději?","Nejraději chodím do parku a na procházku k řece."],["Jak se ve městě dostanete do práce?","Do práce jezdím autobusem, cesta trvá patnáct minut."],["Co ve vašem městě chybí?","Chybí tady kino a víc hřišť pro děti."],["Jaké bylo vaše město, když jste přijel/a?","Když jsem přijel/a, bylo město tiché a nikoho jsem neznal/a."],["Co jste ve městě dělal/a minulou sobotu?","Minulou sobotu jsem byl/a na trhu na náměstí a koupil/a jsem zeleninu."],["Budete v tomto městě bydlet i v budoucnu?","Ano, myslím, že tady budu bydlet i v budoucnu, protože se mi tu líbí."],["Co byste doporučil/a turistovi ve vašem městě?","Doporučil/a bych procházku podél řeky a návštěvu kostela."]]},{"cz":"Práce","t":["Робота","Work","Работа","Công việc"],"qa":[["Kde pracujete?","Pracuju ve skladu v Kralupech."],["Co děláte v práci každý den?","Každý den nakládám a vykládám zboží a kontroluju krabice."],["Kdy začínáte a končíte v práci?","Začínám v šest ráno a končím ve dvě odpoledne."],["Jak jezdíte do práce?","Do práce jezdím autem, je to asi deset minut."],["Líbí se vám vaše práce?","Práce se mi líbí, protože mám dobré kolegy, ale je dost těžká."],["Mluvíte v práci česky?","Ano, s vedoucím mluvím česky, s kolegy někdy ukrajinsky."],["Jakou práci jste dělal/a dřív?","Dřív jsem pracoval/a jako řidič/ka v taxi."],["Jak jste našel/našla tuhle práci?","Tuhle práci jsem našel/našla na internetu přes agenturu."],["Kolik dní dovolené budete mít letos?","Letos budu mít dvacet dní dovolené."],["Jakou práci byste chtěl/a dělat za pět let?","Za pět let bych chtěl/a pracovat v kanceláři jako účetní."]]},{"cz":"Škola a vzdělávání","t":["Школа й освіта","School and education","Школа и образование","Trường học và giáo dục"],"qa":[["Jakou školu jste studoval/a?","Studoval/a jsem střední školu a potom ekonomii na univerzitě."],["Co jste studoval/a?","Studoval/a jsem ekonomii a účetnictví."],["Jaký předmět jste měl/a ve škole rád/a?","Ve škole jsem měl/a rád/a matematiku a zeměpis."],["Jak dlouho jste chodil/a do školy?","Do školy jsem chodil/a jedenáct let a na univerzitu pět let."],["Chodí vaše děti do školy?","Ano, syn chodí do základní školy, je ve třetí třídě."],["Jak daleko je škola od vašeho bytu?","Škola je blízko, asi deset minut pěšky."],["Co se teď učíte?","Teď se učím česky, chodím na kurz dvakrát týdně."],["Jak se vaše děti učí česky?","Děti se učí česky ve škole a mluví česky s kamarády."],["Budete ještě něco studovat?","Ano, příští rok budu studovat kurz účetnictví."],["Co byste chtěl/a studovat, kdybyste měl/a čas?","Kdybych měl/a čas, studoval/a bych počítače a programování."]]},{"cz":"Čeština","t":["Чеська мова","Learning Czech","Чешский язык","Tiếng Séc"],"qa":[["Jak dlouho se učíte česky?","Česky se učím asi dva roky."],["Jak jste se učil/a česky?","Učil/a jsem se v kurzu, z aplikace v telefonu a z televize."],["Kde nejčastěji mluvíte česky?","Nejčastěji mluvím česky v práci a v obchodě."],["Je pro vás čeština těžká?","Čeština je těžká, hlavně gramatika a výslovnost ř."],["Co je pro vás v češtině nejtěžší?","Nejtěžší jsou pro mě pády a dlouhé samohlásky."],["Čtete česky?","Ano, čtu zprávy na internetu a někdy krátké knihy pro děti."],["Díváte se na českou televizi?","Ano, večer se dívám na české zprávy a seriály."],["Proč se učíte česky?","Česky se učím, protože tady žiju a chci trvalý pobyt."],["Jak se budete učit dál?","Budu chodit na kurz a víc mluvit s českými kolegy."],["Co byste poradil/a člověku, který začíná s češtinou?","Poradil/a bych mu mluvit každý den, i když dělá chyby."]]},{"cz":"Denní režim","t":["Розпорядок дня","Daily routine","Распорядок дня","Sinh hoạt hằng ngày"],"qa":[["V kolik hodin vstáváte?","Ve všední dny vstávám v pět hodin ráno."],["Co děláte ráno?","Ráno se umyju, obléknu se, nasnídám se a jdu do práce."],["Co snídáte?","K snídani jím chleba se sýrem a piju kávu."],["Kde obědváte?","Obědvám v jídelně v práci, většinou polévku a hlavní jídlo."],["Co děláte odpoledne?","Odpoledne vyzvednu syna ze školy a nakupuju."],["Co děláte večer?","Večer vařím večeři, dívám se na televizi a učím se česky."],["V kolik hodin chodíte spát?","Spát chodím asi v deset hodin večer."],["Co jste dělal/a včera večer?","Včera večer jsem vařil/a polévku a potom jsem četl/a knihu."],["Co budete dělat zítra ráno?","Zítra ráno pojedu k lékaři a potom do práce."],["Jak byste chtěl/a změnit svůj den?","Chtěl/a bych mít víc času na sport a na rodinu."]]},{"cz":"Víkend","t":["Вихідні","Weekend","Выходные","Cuối tuần"],"qa":[["Co obvykle děláte o víkendu?","O víkendu odpočívám, uklízím a chodím s rodinou ven."],["Pracujete někdy o víkendu?","Někdy pracuju v sobotu, ale neděle mám volnou."],["Kdy v sobotu vstáváte?","V sobotu vstávám později, asi v osm hodin."],["Kam chodíte o víkendu?","O víkendu chodíme do parku, do bazénu nebo do obchodního centra."],["S kým trávíte víkend?","Víkend trávím hlavně s rodinou a někdy s kamarády."],["Co jste dělal/a minulý víkend?","Minulý víkend jsme byli na výletě na hradě Karlštejn."],["Jaký byl váš nejlepší víkend?","Nejlepší víkend byl loni v létě, když jsme byli u jezera."],["Co budete dělat tento víkend?","Tento víkend budu doma, protože musím uklízet a vařit."],["Kam pojedete příští víkend?","Příští víkend pojedeme ke kamarádům do Brna."],["Jak byste chtěl/a strávit ideální víkend?","Ideální víkend bych chtěl/a strávit na horách bez telefonu."]]},{"cz":"Volný čas a koníčky","t":["Вільний час і хобі","Free time and hobbies","Свободное время и хобби","Thời gian rảnh và sở thích"],"qa":[["Co děláte ve volném čase?","Ve volném čase čtu knihy, vařím a chodím na procházky."],["Máte nějaký koníček?","Ano, můj koníček je rybaření. Chodím k řece s kamarádem."],["Kolik máte volného času?","Volný čas mám hlavně večer a v neděli."],["Hrajete na nějaký hudební nástroj?","Ne, nehraju, ale rád/a poslouchám hudbu."],["Jakou hudbu posloucháte?","Poslouchám hlavně pop a ukrajinské písničky."],["Co jste dělal/a ve volném čase jako dítě?","Jako dítě jsem hrál/a fotbal a chodil/a jsem do tanečního kroužku."],["Co jste dělal/a minulý týden ve volném čase?","Minulý týden jsem byl/a v kině a viděl/a jsem nový film."],["Máte nějaký nový koníček?","Ano, teď jsem začal/a fotografovat přírodu telefonem."],["Co budete dělat dnes večer?","Dnes večer budu číst knihu a poslouchat hudbu."],["Jaký koníček byste chtěl/a vyzkoušet?","Chtěl/a bych vyzkoušet jógu, protože je dobrá pro záda."]]},{"cz":"Sport","t":["Спорт","Sport","Спорт","Thể thao"],"qa":[["Sportujete?","Ano, sportuju dvakrát týdně, chodím běhat a plavat."],["Jaký sport máte nejraději?","Nejraději mám fotbal, hraju ho i se synem."],["Kde sportujete?","Běhám v parku a plavu v městském bazénu."],["Díváte se na sport v televizi?","Ano, dívám se na fotbal a v zimě na hokej."],["Jaký sport je populární ve vaší zemi?","V mé zemi je nejpopulárnější fotbal a box."],["Jaký sport jste dělal/a ve škole?","Ve škole jsem hrál/a volejbal a běhal/a jsem."],["Kdy jste naposledy sportoval/a?","Naposledy jsem sportoval/a včera, plaval/a jsem půl hodiny."],["Proč je sport důležitý?","Sport je důležitý, protože jsme zdraví a máme dobrou náladu."],["Budete o víkendu sportovat?","Ano, v sobotu budu hrát fotbal s kolegy."],["Jaký sport byste chtěl/a zkusit?","Chtěl/a bych zkusit tenis, protože vypadá zábavně."]]},{"cz":"Jídlo a vaření","t":["Їжа й готування","Food and cooking","Еда и готовка","Ăn uống và nấu nướng"],"qa":[["Co rád/a jíte?","Rád/a jím těstoviny, kuře a zeleninu."],["Kdo u vás doma vaří?","Doma vařím hlavně já, o víkendu vaří manžel."],["Co obvykle vaříte?","Obvykle vařím polévku, maso s bramborami nebo rýži."],["Jaké jídlo nemáte rád/a?","Nemám rád/a ryby, protože mi nechutnají."],["Kde nakupujete jídlo?","Jídlo nakupuju v supermarketu a zeleninu na trhu."],["Jaké české jídlo znáte?","Znám svíčkovou, guláš a knedlíky. Svíčková mi chutná."],["Jaké typické jídlo je ve vaší zemi?","V mé zemi je typický boršč, to je polévka z červené řepy."],["Co jste vařil/a včera?","Včera jsem vařil/a kuře s rýží a salát."],["Co budete vařit na víkend?","Na víkend budu vařit guláš, protože přijdou hosté."],["Jaké jídlo byste se chtěl/a naučit vařit?","Chtěl/a bych se naučit vařit české knedlíky."]]},{"cz":"Restaurace a kavárna","t":["Ресторан і кав'ярня","Restaurant and café","Ресторан и кафе","Nhà hàng và quán cà phê"],"qa":[["Chodíte do restaurace?","Do restaurace chodím asi jednou za měsíc."],["S kým chodíte do restaurace?","Do restaurace chodím s rodinou nebo s kolegy z práce."],["Co si v restauraci obvykle objednáte?","Obvykle si objednám polévku a hlavní jídlo, třeba řízek."],["Co pijete v kavárně?","V kavárně piju cappuccino nebo čaj."],["Kolik stojí oběd v restauraci?","Polední menu stojí asi sto padesát až dvě stě korun."],["Dáváte v restauraci spropitné?","Ano, obvykle dám deset procent spropitné."],["Kdy jste byl/a naposledy v restauraci?","Naposledy jsem byl/a v restauraci minulou sobotu na narozeninách."],["Co jste tam jedl/a?","Jedl/a jsem pizzu a pil/a jsem limonádu."],["Kam půjdete příště na večeři?","Příště půjdeme do nové italské restaurace na náměstí."],["Jakou restauraci byste doporučil/a kamarádovi?","Doporučil/a bych malou restauraci u řeky, protože tam dobře vaří."]]},{"cz":"Nakupování","t":["Покупки","Shopping","Покупки","Mua sắm"],"qa":[["Kde nakupujete?","Nakupuju v supermarketu blízko domu."],["Jak často nakupujete?","Velký nákup dělám jednou týdně, v sobotu."],["Co kupujete nejčastěji?","Nejčastěji kupuju chleba, mléko, ovoce a zeleninu."],["Platíte kartou, nebo hotově?","Většinou platím kartou, je to rychlejší."],["Nakupujete na internetu?","Ano, na internetu kupuju oblečení a elektroniku."],["Kdo u vás doma nakupuje?","Nakupujeme spolu s manželem, on nosí tašky."],["Co jste naposledy koupil/a?","Naposledy jsem koupil/a nové boty na zimu."],["Kolik jste za to zaplatil/a?","Zaplatil/a jsem tisíc dvě stě korun, byly ve slevě."],["Co budete kupovat tento týden?","Tento týden budu kupovat dárek pro dceru."],["Co byste si koupil/a, kdybyste měl/a hodně peněz?","Koupil/a bych si nové auto a velký byt."]]},{"cz":"Oblečení","t":["Одяг","Clothes","Одежда","Quần áo"],"qa":[["Co máte dnes na sobě?","Dnes mám na sobě džíny, modrý svetr a sportovní boty."],["Jaké oblečení nosíte do práce?","Do práce nosím pracovní kalhoty a tričko."],["Jakou barvu máte nejraději?","Nejraději mám modrou a černou barvu."],["Kde kupujete oblečení?","Oblečení kupuju v obchodním centru nebo na internetu."],["Co nosíte v zimě?","V zimě nosím teplou bundu, čepici, šálu a rukavice."],["Nosíte rád/a elegantní oblečení?","Elegantní oblečení nosím jen na svatbu nebo do divadla."],["Co jste si naposledy koupil/a na sebe?","Naposledy jsem si koupil/a zimní bundu."],["Co jste měl/a na sobě na poslední oslavě?","Na poslední oslavě jsem měl/a černé šaty a nové boty."],["Co si koupíte na jaro?","Na jaro si koupím lehkou bundu a nové tenisky."],["Jaké oblečení byste nikdy nenosil/a?","Nikdy bych nenosil/a moc barevné oblečení, nelíbí se mi."]]},{"cz":"Počasí a roční období","t":["Погода й пори року","Weather and seasons","Погода и времена года","Thời tiết và các mùa"],"qa":[["Jaké je dnes počasí?","Dnes je zima a prší, je asi pět stupňů."],["Jaké roční období máte nejraději?","Nejraději mám léto, protože je teplo a dlouhé dny."],["Co děláte, když prší?","Když prší, jsem doma, čtu nebo se dívám na film."],["Jaké je počasí v Česku v zimě?","V zimě je v Česku zima, někdy sněží a mrzne."],["Jaké je počasí ve vaší zemi v létě?","V mé zemi je v létě velké horko, až třicet pět stupňů."],["Díváte se na předpověď počasí?","Ano, dívám se na předpověď v telefonu každé ráno."],["Jaké bylo počasí minulý víkend?","Minulý víkend bylo krásně, svítilo slunce."],["Co jste dělal/a minulou zimu?","Minulou zimu jsme jezdili na sáňkách a stavěli sněhuláka."],["Jaké bude počasí zítra?","Zítra bude podle předpovědi slunečno a teplo."],["Kde byste chtěl/a žít kvůli počasí?","Kvůli počasí bych chtěl/a žít u moře, kde je teplo."]]},{"cz":"Zdraví a lékař","t":["Здоров'я й лікар","Health and the doctor","Здоровье и врач","Sức khỏe và bác sĩ"],"qa":[["Jak se cítíte?","Dnes se cítím dobře, nic mě nebolí."],["Máte praktického lékaře?","Ano, mám praktického lékaře blízko domu."],["Jak často chodíte k lékaři?","K lékaři chodím jednou za rok na prohlídku."],["Co děláte, když jste nemocný/á?","Když jsem nemocný/á, zůstanu doma, piju čaj a beru léky."],["Máte zdravotní pojištění?","Ano, mám zdravotní pojištění u VZP."],["Kdy jste byl/a naposledy nemocný/á?","Naposledy jsem byl/a nemocný/á v zimě, měl/a jsem chřipku."],["Co vám lékař řekl?","Lékař mi řekl, že musím být týden doma a brát antibiotika."],["Byl/a jste někdy v nemocnici?","Ano, před rokem jsem byl/a v nemocnici, protože jsem měl/a zlomenou ruku."],["Kdy půjdete k zubaři?","K zubaři půjdu příští měsíc na kontrolu."],["Co byste udělal/a pro své zdraví?","Pro zdraví bych chtěl/a víc chodit pěšky a jíst méně sladkého."]]},{"cz":"Doprava ve městě","t":["Транспорт у місті","Getting around town","Транспорт в городе","Giao thông trong thành phố"],"qa":[["Jak jezdíte do práce?","Do práce jezdím autobusem, někdy na kole."],["Máte auto?","Ano, máme jedno auto, ale ve městě jezdím autobusem."],["Kolik stojí jízdenka na autobus?","Jízdenka stojí asi třicet korun, mám měsíční kupón."],["Kde si kupujete jízdenky?","Jízdenky si kupuju v aplikaci v telefonu."],["Jak dlouho trvá cesta do centra?","Cesta do centra trvá asi dvacet minut tramvají."],["Jezdíte rád/a metrem?","Ano, metro je rychlé, ale ráno je tam hodně lidí."],["Měl/a jste někdy problém v MHD?","Jednou jsem zapomněl/a jízdenku a musel/a jsem zaplatit pokutu."],["Jak jste dnes přijel/a sem?","Dnes jsem přijel/a vlakem a potom jsem šel/šla pěšky."],["Budete si kupovat auto?","Ano, příští rok si koupím malé auto."],["Co byste zlepšil/a v dopravě ve vašem městě?","Zlepšil/a bych autobusy večer, protože jezdí málo."]]},{"cz":"Cestování a dovolená","t":["Подорожі й відпустка","Travel and holidays","Путешествия и отпуск","Du lịch và kỳ nghỉ"],"qa":[["Rád/a cestujete?","Ano, cestuju rád/a, poznávám nová místa."],["Jak nejraději cestujete?","Nejraději cestuju autem, protože můžu zastavit, kde chci."],["Kam jezdíte na dovolenou?","Na dovolenou jezdíme k moři nebo na hory."],["Kolik dní trvá vaše dovolená?","Naše dovolená trvá obvykle deset dní."],["Co si berete na cestu?","Na cestu si beru pas, peníze, telefon a oblečení."],["Kde jste byl/a na poslední dovolené?","Na poslední dovolené jsem byl/a v Itálii u moře."],["Co jste tam dělal/a?","Koupal/a jsem se, jedl/a jsem pizzu a prohlížel/a jsem si město."],["Jaká byla vaše nejhorší cesta?","Nejhorší cesta byla, když se nám rozbilo auto na dálnici."],["Kam pojedete příští léto?","Příští léto pojedeme do Chorvatska na dva týdny."],["Kterou zemi byste chtěl/a navštívit a proč?","Chtěl/a bych navštívit Japonsko, protože má zajímavou kulturu."]]},{"cz":"Svátky a oslavy","t":["Свята й урочистості","Holidays and celebrations","Праздники и торжества","Ngày lễ và lễ kỷ niệm"],"qa":[["Jaký svátek máte nejraději?","Nejraději mám Vánoce, protože je celá rodina spolu."],["Jak slavíte Vánoce?","Na Vánoce zdobíme stromeček, vaříme a dáváme si dárky."],["Co jíte na Štědrý den?","Na Štědrý den jíme kapra s bramborovým salátem."],["Jaké české svátky znáte?","Znám Vánoce, Velikonoce a Den české státnosti."],["Jaký je typický svátek ve vaší zemi?","V mé zemi je důležitý svátek Velikonoce, pečeme velikonoční chleba."],["Jak jste slavil/a minulý Silvestr?","Minulý Silvestr jsme byli u kamarádů a o půlnoci jsme se dívali na ohňostroj."],["Kdy jste měl/a velkou oslavu?","Velkou oslavu jsme měli na svatbě mého bratra loni v létě."],["Dáváte dárky na Velikonoce?","Dětem dáváme čokoládová vajíčka a malé dárky."],["Jak budete slavit letošní Vánoce?","Letošní Vánoce budeme slavit doma, přijedou moji rodiče."],["Jaký svátek byste chtěl/a zažít v jiné zemi?","Chtěl/a bych zažít karneval v Itálii."]]},{"cz":"Narozeniny","t":["День народження","Birthdays","День рождения","Sinh nhật"],"qa":[["Kdy máte narozeniny?","Narozeniny mám čtrnáctého října."],["Jak slavíte narozeniny?","Narozeniny slavím doma s rodinou a kamarády."],["Co dostáváte k narozeninám?","K narozeninám dostávám knihy, oblečení nebo kosmetiku."],["Co dáváte kamarádům k narozeninám?","Kamarádům dávám víno, květiny nebo dárkový poukaz."],["Pečete na narozeniny dort?","Ano, na narozeniny peču čokoládový dort."],["Jak jste slavil/a poslední narozeniny?","Poslední narozeniny jsem slavil/a v restauraci s rodinou."],["Jaký byl váš nejlepší dárek?","Nejlepší dárek byl výlet do Paříže od manžela."],["Kdy jste byl/a naposledy na narozeninové oslavě?","Minulý týden jsem byl/a na oslavě kolegyně v práci."],["Jak oslavíte příští narozeniny?","Příští narozeniny oslavím na chatě s kamarády."],["Jaký dárek byste chtěl/a dostat?","Chtěl/a bych dostat nový telefon nebo kolo."]]},{"cz":"Kultura","t":["Культура","Culture","Культура","Văn hóa"],"qa":[["Chodíte do kina?","Do kina chodím asi jednou za dva měsíce."],["Jaké filmy máte rád/a?","Mám rád/a komedie a dobrodružné filmy."],["Byl/a jste někdy v divadle?","Ano, byl/a jsem v Národním divadle na opeře."],["Chodíte na koncerty?","Na koncerty chodím jen někdy, když hraje moje oblíbená skupina."],["Jaká je vaše oblíbená kniha?","Moje oblíbená kniha je Malý princ."],["Znáte nějakého českého umělce?","Znám spisovatele Karla Čapka a malíře Alfonse Muchu."],["Jaký film jste viděl/a naposledy?","Naposledy jsem viděl/a českou pohádku Tři oříšky pro Popelku."],["Jak se vám ten film líbil?","Film se mi moc líbil, byl hezký a vtipný."],["Kam půjdete příště za kulturou?","Příště půjdeme na výstavu do muzea v Praze."],["Na jaký koncert byste chtěl/a jít?","Chtěl/a bych jít na koncert vážné hudby do Rudolfina."]]},{"cz":"Televize a internet","t":["Телебачення й інтернет","TV and the internet","Телевидение и интернет","Truyền hình và internet"],"qa":[["Díváte se na televizi?","Na televizi se dívám večer asi hodinu."],["Jaké pořady sledujete?","Sleduju zprávy, sport a kuchařské pořady."],["Jak často používáte internet?","Internet používám každý den v telefonu."],["Na co používáte internet?","Na internetu čtu zprávy, píšu zprávy rodině a nakupuju."],["Používáte sociální sítě?","Ano, používám Facebook a Viber, abych mluvil/a s rodinou."],["Kolik času trávíte na telefonu?","Na telefonu trávím asi dvě hodiny denně, je to moc."],["Co jste naposledy hledal/a na internetu?","Naposledy jsem hledal/a informace o zkoušce z češtiny."],["Jaký seriál jste viděl/a naposledy?","Naposledy jsem viděl/a český seriál o nemocnici."],["Budete se dívat dnes na televizi?","Dnes večer se budu dívat na fotbal."],["Mohl/a byste žít bez internetu?","Bez internetu bych mohl/a žít, ale bylo by to těžké."]]},{"cz":"Telefon a technika","t":["Телефон і техніка","Phone and gadgets","Телефон и техника","Điện thoại và thiết bị"],"qa":[["Jaký máte telefon?","Mám telefon Samsung, je dva roky starý."],["K čemu používáte telefon?","Telefon používám na volání, zprávy, fotky a mapy."],["Máte doma počítač?","Ano, máme doma notebook, používají ho hlavně děti."],["Jaké aplikace používáte nejčastěji?","Nejčastěji používám Viber, mapy a aplikaci banky."],["Umíte opravit počítač?","Ne, neumím, když se něco rozbije, volám servis."],["Kolik stojí dobrý telefon?","Dobrý telefon stojí asi deset tisíc korun."],["Kdy jste koupil/a svůj telefon?","Telefon jsem koupil/a před dvěma lety v obchodě s elektronikou."],["Rozbil se vám někdy telefon?","Ano, minulý rok mi spadl a rozbil se displej."],["Koupíte si brzy nový telefon?","Ano, na Vánoce si koupím nový telefon."],["Jakou techniku byste chtěl/a mít doma?","Chtěl/a bych mít myčku nádobí, ušetřila by mi čas."]]},{"cz":"Úřady","t":["Установи й документи","Offices and paperwork","Учреждения и документы","Cơ quan và giấy tờ"],"qa":[["Na jakém úřadě jste byl/a v Česku?","Byl/a jsem na odboru azylové a migrační politiky a na městském úřadě."],["Proč chodíte na úřad?","Na úřad chodím kvůli pobytu, dokladům nebo změně adresy."],["Je pro vás těžké mluvit na úřadě česky?","Je to těžké, protože úředníci mluví rychle a používají těžká slova."],["Jak se objednáváte na úřad?","Na úřad se objednávám přes internet nebo telefonem."],["Jaké doklady máte?","Mám pas, povolení k pobytu a řidičský průkaz."],["Kdy jste byl/a naposledy na úřadě?","Naposledy jsem byl/a na úřadě minulý měsíc kvůli prodloužení pobytu."],["Jak dlouho jste tam čekal/a?","Čekal/a jsem asi hodinu, bylo tam hodně lidí."],["Kdo vám pomáhá s formuláři?","S formuláři mi pomáhá kolegyně Češka nebo integrační centrum."],["Kdy budete žádat o trvalý pobyt?","O trvalý pobyt budu žádat příští rok, až udělám zkoušku."],["Co byste na úřadech změnil/a?","Chtěl/a bych, aby bylo víc informací v jiných jazycích."]]},{"cz":"Banka a peníze","t":["Банк і гроші","Banking and money","Банк и деньги","Ngân hàng và tiền bạc"],"qa":[["Máte účet v české bance?","Ano, mám účet v bance, kterou mám blízko domu."],["Jak platíte v obchodě?","V obchodě platím kartou nebo telefonem."],["Používáte internetové bankovnictví?","Ano, platby dělám v aplikaci v telefonu."],["Spoříte peníze?","Ano, každý měsíc spořím trochu peněz na dovolenou."],["Na co nejvíc utrácíte?","Nejvíc utrácím za nájem a za jídlo."],["Posíláte peníze domů?","Někdy posílám peníze rodičům na Ukrajinu."],["Kdy jste si založil/a účet?","Účet jsem si založil/a hned první měsíc v Česku."],["Ztratil/a jste někdy kartu?","Ano, jednou jsem ji ztratil/a a hned jsem ji zablokoval/a."],["Na co budete šetřit?","Budu šetřit na auto a na studium dětí."],["Co byste udělal/a, kdybyste vyhrál/a milion?","Koupil/a bych byt a část peněz bych dal/a rodině."]]},{"cz":"Pošta a služby","t":["Пошта й послуги","Post office and services","Почта и услуги","Bưu điện và dịch vụ"],"qa":[["Chodíte na poštu?","Na poštu chodím jen někdy, když posílám balík."],["Co posíláte poštou?","Poštou posílám balíky rodině a dopisy na úřad."],["Kde si vyzvedáváte balíky?","Balíky si vyzvedávám ve výdejním boxu u obchodu."],["Chodíte ke kadeřníkovi?","Ke kadeřníkovi chodím jednou za dva měsíce."],["Kolik stojí střih u kadeřníka?","Pánský střih stojí asi tři sta korun."],["Kdo vám opravuje auto?","Auto mi opravuje autoservis v našem městě."],["Kdy jste naposledy posílal/a balík?","Minulý týden jsem posílal/a balík babičce na Ukrajinu."],["Měl/a jste někdy problém se službou?","Ano, jednou mi čistírna zničila košili a musel/a jsem reklamovat."],["Kdy půjdete ke kadeřníkovi?","Ke kadeřníkovi půjdu v pátek odpoledne."],["Jakou službu byste chtěl/a mít blízko domu?","Chtěl/a bych mít blízko domu poštu, protože je daleko."]]},{"cz":"Příroda a výlety","t":["Природа й прогулянки","Nature and trips","Природа и прогулки","Thiên nhiên và dã ngoại"],"qa":[["Máte rád/a přírodu?","Ano, přírodu mám moc rád/a, uklidňuje mě."],["Kam chodíte do přírody?","Chodím do lesa za městem a k řece."],["Jezdíte na výlety?","Na výlety jezdíme skoro každý měsíc."],["Co si berete na výlet?","Na výlet si beru vodu, svačinu, mapu a deštník."],["Jaké místo v Česku se vám líbí?","Líbí se mi Český ráj, jsou tam krásné skály."],["Kde jste byl/a na posledním výletě?","Na posledním výletě jsme byli na Šumavě."],["Co jste tam viděl/a?","Viděl/a jsem jezero, velké lesy a jelena."],["Sbíráte houby?","Ano, na podzim sbíráme houby, loni jsme jich našli hodně."],["Kam pojedete na příští výlet?","Na příští výlet pojedeme do Krkonoš."],["Kde byste chtěl/a strávit týden v přírodě?","Týden bych chtěl/a strávit na horách ve stanu."]]},{"cz":"Zvířata","t":["Тварини","Animals","Животные","Động vật"],"qa":[["Máte doma zvíře?","Ano, máme psa, jmenuje se Bobík."],["Jaké zvíře máte nejraději?","Nejraději mám psy, protože jsou věrní."],["Kdo se stará o vašeho psa?","O psa se stará hlavně syn, chodí s ním ven."],["Kolikrát denně chodíte se psem ven?","Se psem chodíme ven třikrát denně."],["Co jí vaše zvíře?","Náš pes jí granule a někdy maso."],["Měl/a jste zvíře jako dítě?","Jako dítě jsem měl/a kočku a králíka."],["Kdy jste byl/a naposledy v zoo?","V zoo jsme byli loni na jaře v Praze."],["Jaké zvíře se vám v zoo líbilo?","V zoo se mi nejvíc líbili sloni a žirafy."],["Budete si pořizovat další zvíře?","Ne, další zvíře si pořizovat nebudeme, byt je malý."],["Jaké zvíře byste chtěl/a mít?","Chtěl/a bych mít koně, ale potřebuju velkou zahradu."]]},{"cz":"Česko","t":["Чехія","The Czech Republic","Чехия","Cộng hòa Séc"],"qa":[["Jak se vám líbí v Česku?","V Česku se mi líbí, je tady klid a pořádek."],["Co se vám v Česku líbí nejvíc?","Nejvíc se mi líbí příroda a staré hrady."],["Co se vám v Česku nelíbí?","Nelíbí se mi, že je tady často zima a prší."],["Jaká česká města znáte?","Znám Prahu, Brno, Plzeň a Český Krumlov."],["Jací jsou Češi?","Češi jsou podle mě klidní, pracovití a mají rádi pivo."],["Co bylo pro vás v Česku nové?","Nové pro mě bylo, že obchody mají v neděli často zavřeno."],["Které místo v Česku jste navštívil/a jako první?","Jako první jsem navštívil/a Prahu a Karlův most."],["Co jste se v Česku naučil/a?","Naučil/a jsem se česky a třídit odpad."],["Zůstanete v Česku?","Ano, chci tady zůstat a dostat trvalý pobyt."],["Kam byste v Česku chtěl/a ještě jet?","Chtěl/a bych ještě jet na Moravu na víno."]]},{"cz":"Moje země","t":["Моя країна","My country","Моя страна","Đất nước tôi"],"qa":[["Odkud jste?","Jsem z Ukrajiny, z města Záporoží."],["Jaká je vaše země?","Moje země je velká, má moře, hory a velké řeky."],["Co je typické pro vaši zemi?","Typický je boršč, vyšívané košile a lidové písně."],["Jaké je hlavní město vaší země?","Hlavní město je Kyjev, je velké a krásné."],["Jaký je rozdíl mezi Českem a vaší zemí?","Česko je menší a lidé tady mluví tišeji."],["Co vám z vaší země chybí?","Chybí mi rodina, kamarádi a jídlo od maminky."],["Kdy jste byl/a naposledy doma?","Doma jsem byl/a naposledy před dvěma lety."],["Co jste dělal/a ve své zemi o víkendech?","O víkendech jsme jezdili na chatu a k řece."],["Pojedete brzy do své země?","Ano, v létě pojedu navštívit rodiče."],["Co byste ukázal/a Čechovi ve své zemi?","Ukázal/a bych mu moře a staré centrum Oděsy."]]},{"cz":"Plány do budoucna","t":["Плани на майбутнє","Plans for the future","Планы на будущее","Kế hoạch tương lai"],"qa":[["Jaké máte plány na příští rok?","Příští rok chci udělat zkoušku a najít lepší práci."],["Co budete dělat o prázdninách?","O prázdninách pojedeme k moři a potom na chatu."],["Kde budete bydlet za pět let?","Za pět let budu bydlet v Česku, možná v Praze."],["Jakou práci budete dělat v budoucnu?","V budoucnu chci pracovat v kanceláři."],["Chcete se dál učit česky?","Ano, po zkoušce se budu učit dál, chci úroveň B1."],["Co pro to musíte udělat?","Musím víc mluvit, číst a chodit na kurz."],["Co jste plánoval/a minulý rok a povedlo se to?","Minulý rok jsem plánoval/a koupit auto a povedlo se to."],["Co jste už pro své plány udělal/a?","Už jsem si našel/našla kurz a přihlásil/a jsem se na zkoušku."],["Co uděláte hned po zkoušce?","Po zkoušce si odpočinu a oslavím to s rodinou."],["Co byste chtěl/a změnit ve svém životě?","Chtěl/a bych mít víc času na rodinu a sport."]]},{"cz":"Děti a výchova","t":["Діти й виховання","Children","Дети и воспитание","Con cái và nuôi dạy"],"qa":[["Máte děti?","Ano, mám syna, je mu devět let."],["Kam chodí vaše děti do školy?","Syn chodí do základní školy v našem městě."],["Co dělají vaše děti ve volném čase?","Syn hraje fotbal a hraje hry na počítači."],["Chodí vaše dítě na nějaký kroužek?","Ano, chodí na fotbal dvakrát týdně a na angličtinu."],["Kdo vozí děti do školy?","Do školy syna vozí manžel, odpoledne ho vyzvedávám já."],["Jak se vaše dítě učí?","Syn se učí dobře, nejvíc ho baví matematika."],["Co jste dělali s dětmi minulý víkend?","Minulý víkend jsme byli s dětmi v zoo a na zmrzlině."],["Jak jste omluvil/a dítě ze školy, když bylo nemocné?","Napsal/a jsem učitelce zprávu přes aplikaci školy."],["Co budou dělat děti o prázdninách?","O prázdninách pojede syn na tábor a potom k babičce."],["Jakou práci byste chtěl/a pro své dítě?","Chtěl/a bych, aby syn měl zajímavou práci, třeba jako lékař."]]},{"cz":"Sousedé a dům","t":["Сусіди й будинок","Neighbours and the building","Соседи и дом","Hàng xóm và tòa nhà"],"qa":[["Znáte své sousedy?","Znám některé sousedy, zdravíme se na chodbě."],["Jací jsou vaši sousedé?","Moji sousedé jsou milí a tiší, jen jeden má hlučného psa."],["Pomáháte si se sousedy?","Ano, když jsme na dovolené, sousedka nám zalévá květiny."],["Kolik pater má váš dům?","Náš dům má osm pater a výtah."],["Kdo uklízí ve vašem domě?","Chodbu uklízí paní z úklidové firmy jednou týdně."],["Máte nějaký problém v domě?","Někdy nefunguje výtah a musíme chodit pěšky."],["Měl/a jste někdy problém se sousedem?","Jednou sousedé dělali v noci párty a bylo hodně hlučno."],["Co jste udělal/a?","Šel/šla jsem k nim a slušně jsem je poprosil/a, aby byli tišeji."],["Pozvete sousedy na návštěvu?","Ano, na Vánoce pozveme sousedy na cukroví."],["Jaké sousedy byste chtěl/a mít?","Chtěl/a bych sousedy, kteří jsou přátelští a tiší."]]},{"cz":"Auto a řízení","t":["Авто й водіння","Cars and driving","Авто и вождение","Ô tô và lái xe"],"qa":[["Máte řidičský průkaz?","Ano, mám řidičský průkaz už patnáct let."],["Jaké máte auto?","Mám starší Škodu Octavii, je modrá."],["Jak často jezdíte autem?","Autem jezdím každý den do práce a o víkendu na nákup."],["Kolik stojí benzín?","Benzín stojí asi třicet osm korun za litr."],["Kde parkujete?","Parkuju před domem, kde je parkoviště pro obyvatele."],["Kdy jste dělal/a řidičák?","Řidičák jsem dělal/a na Ukrajině, když mi bylo dvacet."],["Měl/a jste někdy nehodu?","Ano, jednou jsem měl/a malou nehodu na parkovišti, nikomu se nic nestalo."],["Zastavila vás někdy policie?","Jednou mě zastavila policie a chtěla vidět doklady."],["Kdy pojedete do servisu?","Do servisu pojedu příští týden přezout pneumatiky na zimu."],["Jaké auto byste si chtěl/a koupit?","Chtěl/a bych si koupit velké rodinné auto."]]},{"cz":"Domácí práce","t":["Домашні справи","Housework","Домашние дела","Việc nhà"],"qa":[["Kdo u vás doma uklízí?","Doma uklízíme všichni, každý má svou práci."],["Co děláte doma nejraději?","Nejraději vařím, nerad/a žehlím."],["Jak často uklízíte?","Velký úklid děláme jednou týdně, v sobotu."],["Co dělají děti doma?","Syn si uklízí pokoj a vynáší odpadky."],["Kdo u vás pere prádlo?","Prádlo pere manželka, já ho věším."],["Třídíte odpad?","Ano, třídíme papír, plast a sklo."],["Co jste dělal/a doma včera?","Včera jsem umyl/a okna a vyluxoval/a jsem."],["Co jste opravoval/a doma naposledy?","Naposledy jsem opravoval/a kapající kohoutek v kuchyni."],["Co musíte doma udělat zítra?","Zítra musím vyžehlit košile a nakoupit."],["Jakou domácí práci byste nechtěl/a dělat?","Nechtěl/a bych mýt nádobí, proto chci myčku."]]},{"cz":"Zdravý životní styl","t":["Здоровий спосіб життя","A healthy lifestyle","Здоровый образ жизни","Lối sống lành mạnh"],"qa":[["Žijete zdravě?","Snažím se žít zdravě, ale ne vždycky to jde."],["Co jíte zdravého?","Jím hodně zeleniny, ovoce a piju vodu."],["Kolik hodin spíte?","Spím asi sedm hodin, ale chtěl/a bych víc."],["Kouříte?","Ne, nekouřím, přestal/a jsem před třemi lety."],["Jak odpočíváte po práci?","Po práci si lehnu, poslouchám hudbu nebo jdu na procházku."],["Kolik chodíte denně pěšky?","Denně chodím asi pět kilometrů, mám to v telefonu."],["Co jste změnil/a, abyste byl/a zdravější?","Přestal/a jsem pít sladké limonády a začal/a jsem plavat."],["Kdy jste naposledy byl/a na preventivní prohlídce?","Na prohlídce jsem byl/a letos v březnu."],["Co pro své zdraví uděláte tento týden?","Tento týden budu chodit spát dřív a nebudu jíst sladké."],["Co je podle vás nejdůležitější pro zdraví?","Podle mě je nejdůležitější dobrý spánek a pohyb."]]},{"cz":"Problémy a pomoc","t":["Проблеми й допомога","Problems and getting help","Проблемы и помощь","Sự cố và nhờ giúp đỡ"],"qa":[["Jaké je číslo na záchrannou službu?","Číslo na záchrannou službu je 155, na policii 158 a evropské číslo 112."],["Komu voláte, když máte problém v bytě?","Když mám problém v bytě, volám majiteli bytu."],["Co děláte, když se ztratíte?","Když se ztratím, podívám se do mapy v telefonu nebo se zeptám lidí."],["Kdo vám pomáhá, když něčemu nerozumíte?","Pomáhá mi kolegyně Češka nebo překladač v telefonu."],["Co děláte, když ztratíte doklady?","Když ztratím doklady, jdu na policii a nahlásím to."],["Volal/a jste někdy záchranku?","Ano, jednou jsem volal/a záchranku, když se babičce udělalo špatně."],["Ztratil/a jste někdy něco důležitého?","Ano, ztratil/a jsem peněženku v autobuse, ale řidič ji našel."],["Kdo vám pomohl, když jste přijel/a do Česka?","Když jsem přijel/a, pomohli mi příbuzní a integrační centrum."],["Co uděláte, když se vám rozbije auto?","Zavolám asistenční službu a odvezou auto do servisu."],["Jak byste pomohl/a člověku, který nemluví česky?","Pomohl/a bych mu přeložit a ukázal/a bych mu cestu."]]},{"cz":"Knihy a čtení","t":["Книжки й читання","Books and reading","Книги и чтение","Sách và đọc"],"qa":[["Čtete rád/a?","Ano, čtu rád/a, hlavně večer před spaním."],["Jaké knihy čtete?","Čtu detektivky a knihy o historii."],["Čtete papírové knihy, nebo v telefonu?","Čtu hlavně v telefonu, ale papírové knihy mám radši."],["Kde si půjčujete knihy?","Knihy si půjčuju v městské knihovně."],["Kolik knih přečtete za rok?","Za rok přečtu asi deset knih."],["Posloucháte audioknihy?","Ano, audioknihy poslouchám v autě cestou do práce."],["Jakou knihu jste četl/a naposledy?","Naposledy jsem četl/a detektivku od Agathy Christie."],["Jakou knihu jste měl/a rád/a jako dítě?","Jako dítě jsem měl/a rád/a pohádky bratří Grimmů."],["Co budete číst příště?","Příště budu číst českou knihu pro začátečníky."],["Jakou knihu byste doporučil/a kamarádovi?","Doporučil/a bych Malého prince, je krátký a moudrý."]]}],"u2":[],"u3":[],"u4":[]}</script>
<script>
(function(){
const D = JSON.parse(document.getElementById('learn-data').textContent);
const LANGS = ['uk','en','ru','vi'], LI = {uk:0,en:1,ru:2,vi:3};
let lang = (new URLSearchParams(location.search).get('lang') || '').toLowerCase();
if(!(lang in LI)){ try{ lang = localStorage.getItem('a2-learn-lang') || ''; }catch(e){} }
if(!(lang in LI)) lang = 'uk';
try{ localStorage.setItem('a2-learn-lang', lang); }catch(e){}
document.documentElement.lang = lang;
const t = k => (D.ui[k] || [k])[LI[lang]] || (D.ui[k] || [k])[0];
const th = (u, part) => ((D.theory[u] || {})[lang] || (D.theory[u] || {}).uk || {})[part] || '';
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const track = (n, p) => { try{ if(typeof gtag === 'function') gtag('event', n, p || {}); }catch(e){} };
const fold = x => String(x).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

/* header */
$('#backLink').textContent = t('back'); $('#backLink').href = '/zkouska-a2/' + (lang === 'uk' ? '' : lang + '/');
$('#langs').innerHTML = LANGS.map(l => `<a href="?lang=${l}${location.hash}" ${l === lang ? 'aria-current="page"' : ''}>${{uk:'UA',en:'EN',ru:'RU',vi:'VI'}[l]}</a>`).join('');
function isDark(){ const a = document.documentElement.getAttribute('data-theme'); return a ? a === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); }
function themeUI(){ const b = $('#themeBtn'), d = isDark(); b.textContent = d ? '☀️' : '🌙'; b.title = d ? t('themeL') : t('themeD'); b.setAttribute('aria-label', b.title); }
$('#themeBtn').addEventListener('click', () => { const v = isDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', v); try{ localStorage.setItem('a2-theme', v); }catch(e){} themeUI(); });
themeUI();

/* progress */
let DONE = {}; try{ DONE = JSON.parse(localStorage.getItem('a2-learn-done') || '{}') || {}; }catch(e){ DONE = {}; }
const saveDone = () => { try{ localStorage.setItem('a2-learn-done', JSON.stringify(DONE)); }catch(e){} };

/* speech synthesis */
const hasTTS = 'speechSynthesis' in window; let VOICE = null;
function pickVoice(){ if(!hasTTS) return; const v = speechSynthesis.getVoices().filter(x => /^cs/i.test(x.lang)); VOICE = v.find(x => /google|natural|online/i.test(x.name)) || v[0] || null; }
if(hasTTS){ pickVoice(); try{ speechSynthesis.addEventListener('voiceschanged', pickVoice); }catch(e){} }
function speak(text, slow){ if(!hasTTS) return; try{ speechSynthesis.cancel(); }catch(e){}
  const u = new SpeechSynthesisUtterance(text); u.lang = 'cs-CZ'; if(VOICE) u.voice = VOICE; u.rate = slow ? 0.7 : 0.92;
  setTimeout(() => { try{ speechSynthesis.speak(u); }catch(e){} }, 60); }

/* speech recognition */
const SRC = window.SpeechRecognition || window.webkitSpeechRecognition; let SR = null;
const srNorm = x => fold(x).replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
function srMerge(list){ const out = []; for(const tx of list){ const n = srNorm(tx); if(!n) continue; const p = out.length ? srNorm(out[out.length-1]) : null;
  if(p !== null && n.startsWith(p)) out[out.length-1] = tx; else if(p !== null && (p.startsWith(n) || p.endsWith(n))) continue; else out.push(tx); } return out; }
const STOP = new Set('a i v ve na se je jsem jsi jsme jste to ten ta do z ze k ke s so o u po za pro ale protoze kdyz jak co kde kdy uz jen tak taky take moc velmi mi me mu ji jim nas vas'.split(' '));
function feedback(said, model, q){
  const W = srNorm(said).split(' ').filter(Boolean), M = new Set(srNorm(model).split(' ').filter(w => w.length > 2 && !STOP.has(w)));
  const common = [...new Set(W)].filter(w => M.has(w));
  const qv = srNorm(q).split(' ').filter(w => w.length > 3 && !STOP.has(w)).map(w => w.slice(0, 4));
  const verbHit = qv.some(st => W.some(w => w.startsWith(st)));
  const items = [`<li class="${W.length >= 6 ? 'ok' : 'no'}">${W.length} ${t('fbWords')}. ${W.length >= 6 ? t('fbOk') : t('fbShort')}</li>`,
    `<li class="${verbHit ? 'ok' : 'no'}">${verbHit ? t('fbVerb') : t('fbNoVerb')}</li>`];
  if(common.length) items.push(`<li class="ok">✓ ${esc(common.slice(0, 6).join(', '))}</li>`);
  return `<ul class="fb">${items.join('')}</ul>`; }
function srToggle(btn, out, model, q){
  if(SR){ const same = SR.btn === btn; SR.user = true; try{ SR.rec.stop(); }catch(e){} if(same) return; }
  if(!SRC){ out.innerHTML = `<p class="note">${t('noSR')}</p>`; return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  const st = {btn, finals: [], user: false, t0: Date.now()}; const label = btn.textContent;
  const start = () => { const rec = new SRC(); rec.lang = 'cs-CZ'; rec.continuous = true; rec.interimResults = true; st.rec = rec; const base = st.finals.slice();
    rec.onresult = e => { let fin = [], it = ''; for(let i = 0; i < e.results.length; i++){ const r = e.results[i], tx = (r[0].transcript || '').trim(); if(!tx) continue; if(r.isFinal) fin.push(tx); else if(i >= e.resultIndex) it += ' ' + tx; }
      st.finals = srMerge(base.concat(fin)); out.innerHTML = `<p class="heard">${esc(st.finals.join(' · '))} <i>${esc(it)}</i></p>`; };
    rec.onerror = e => { if(e.error === 'no-speech' || e.error === 'aborted') return; st.user = true; out.innerHTML = `<p class="note">${t('noSR')}</p>`; };
    rec.onend = () => { if(!st.user && Date.now() - st.t0 < 120000){ try{ start(); return; }catch(err){} }
      if(SR === st) SR = null; btn.classList.remove('on'); btn.textContent = label;
      const said = st.finals.join('. ');
      out.innerHTML = said ? `<p class="heard"><b>${t('heard')}:</b> ${esc(said)}</p>${feedback(said, model, q)}` : `<p class="note">${t('nothing')}</p>`; };
    rec.start(); };
  try{ start(); }catch(err){ out.innerHTML = `<p class="note">${t('noSR')}</p>`; return; }
  SR = st; btn.classList.add('on'); btn.textContent = t('stop'); out.innerHTML = `<p class="note">${t('listening')}</p>`; track('learn_speak');
}

/* videos */
function vidHTML(list){ if(!list || !list.length) return '';
  return `<details class="sec"><summary>🎬 ${t('videos')}</summary><div class="body"><div class="vids">${list.map(v => `<div class="vid"><div class="ph"><button class="btn primary" type="button" data-vid="${esc(v[0])}">${t('vplay')}</button></div><div class="meta"><b>${esc(v[1])}</b><a class="small" href="https://www.youtube.com/watch?v=${esc(v[0])}" target="_blank" rel="noopener">${t('vyt')} ↗</a></div></div>`).join('')}</div><p class="note">${t('vnote')}</p></div></details>`; }

/* views */
const U = ['u1','u2','u3','u4'];
const ready = u => (D[u] || []).length > 0;
function home(){
  return `<section class="sheet"><div class="hero"><h1>📚 ${t('title')}</h1><p>${t('lead')}</p></div>
  <div class="cards">${U.map(u => { const n = (D[u] || []).length, d = (D[u] || []).filter((_, i) => DONE[u + '-' + i]).length;
    return `<a class="ucard ${u} ${ready(u) ? '' : 'off'}" href="#${u}"><b>${t(u)}</b><span class="small muted">${t(u + 'd')}</span>${ready(u) ? `<span class="small">${t('progress')}: ${d} / ${n}</span><div class="prog"><i style="width:${n ? d / n * 100 : 0}%"></i></div>` : `<span class="soon">${t('soon')}</span>`}</a>`; }).join('')}</div>
  <p class="note">${t('voiceNote')}</p>${vidHTML(D.videos.home)}</section>`; }
function lesson(u){
  const items = D[u] || [];
  return `<section class="sheet u ${u}"><a href="#" class="small">${t('home')}</a><h2>${t(u)}</h2>
  <details class="sec" open><summary>📋 ${t('how')}</summary><div class="body">${th(u, 'how')}</div></details>
  <details class="sec"><summary>🧩 ${t('grammar')}</summary><div class="body">${th(u, 'grammar')}<p class="note">${t('clickCz')}</p></div></details>
  <details class="sec"><summary>💡 ${t('tips')}</summary><div class="body">${th(u, 'tips')}</div></details>
  ${vidHTML(D.videos[u])}
  ${u === 'u1' ? `<div class="trainbox"><b>🎯 ${t('practice')}</b><p class="small">${t('practiceD')}</p><a class="btn primary" href="#${u}-train">${t('start')}</a></div>` : ''}
  <h3>${t('topics')}</h3><p class="small muted">${t('topicsd')}</p>
  <div class="tgrid">${items.map((it, i) => `<a class="tbtn ${DONE[u + '-' + i] ? 'done' : ''}" href="#${u}-${i}"><span>${esc(it.cz)}<span class="tr">${esc(it.t[LI[lang]] || it.t[0])}</span></span>${DONE[u + '-' + i] ? '<span class="ck">✓</span>' : ''}</a>`).join('')}</div></section>`; }
function qaHTML(q, a, n){
  return `<div class="qa"><div class="qrow"><span class="num">${n}.</span><button class="btn sm" type="button" data-say="${esc(q)}" aria-label="▶">▶</button><span class="qtext">${esc(q)}</span></div>
  <div class="acts"><button class="btn sm" type="button" data-show>${t('showA')}</button><button class="btn sm" type="button" data-sr data-model="${esc(a)}" data-q="${esc(q)}">${t('say')}</button></div>
  <div class="ans" hidden><button class="btn sm" type="button" data-say="${esc(a)}" aria-label="▶">▶</button><button class="btn sm" type="button" data-say="${esc(a)}" data-slow="1">${t('slow')}</button><p>${esc(a)}</p></div>
  <div class="srout"></div></div>`; }
function topic(u, i){
  const it = (D[u] || [])[i]; if(!it) return lesson(u);
  const k = u + '-' + i;
  return `<section class="sheet u ${u}"><a href="#${u}" class="small">${t('toList')}</a>
  <div><span class="small muted">${t(u)} · ${t('topic')} ${i + 1} / ${D[u].length}</span><h2>${esc(it.cz)}</h2><p class="muted">${esc(it.t[LI[lang]] || it.t[0])}</p></div>
  <div>${it.qa.map((p, n) => qaHTML(p[0], p[1], n + 1)).join('')}</div>
  <div class="acts"><button class="btn ${DONE[k] ? '' : 'primary'}" type="button" data-done="${k}">${DONE[k] ? t('unmarkL') : t('markL')}</button>${i + 1 < D[u].length ? `<a class="btn" href="#${u}-${i + 1}">${esc(D[u][i + 1].cz)} →</a>` : ''}</div></section>`; }
let TR = null;
function train(u){
  const items = D[u]; const pick = []; const idx = items.map((_, i) => i).sort(() => Math.random() - 0.5).slice(0, 2);
  idx.forEach(ti => { items[ti].qa.map((p, qi) => qi).sort(() => Math.random() - 0.5).slice(0, 4).sort((a, b) => a - b).forEach(qi => pick.push([ti, qi])); });
  TR = {u, pick, n: 0}; track('learn_train', {u}); return trainView(); }
function trainView(){
  const {u, pick, n} = TR; const items = D[u];
  if(n >= pick.length) return `<section class="sheet u ${u}"><a href="#${u}" class="small">${t('toLesson')}</a><div class="trainbox"><p class="big">🎉 ${t('done')}</p><a class="btn primary" href="#${u}-train" data-retrain>${t('again')}</a></div></section>`;
  const [ti, qi] = pick[n], it = items[ti], [q, a] = it.qa[qi];
  return `<section class="sheet u ${u}"><a href="#${u}" class="small">${t('toLesson')}</a>
  <div class="trainbox"><span class="small muted">${t('topic')}: <b>${esc(it.cz)}</b> · ${t('qOf')} ${n + 1} / ${pick.length}</span>
  <div class="qrow"><button class="btn sm" type="button" data-say="${esc(q)}">▶</button><span class="big">${esc(q)}</span></div>
  <div class="acts"><button class="btn sm" type="button" data-sr data-model="${esc(a)}" data-q="${esc(q)}">${t('say')}</button><button class="btn sm" type="button" data-show>${t('showA')}</button></div>
  <div class="ans" hidden><button class="btn sm" type="button" data-say="${esc(a)}">▶</button><p>${esc(a)}</p></div><div class="srout"></div>
  <button class="btn primary" type="button" data-next>${t('next')}</button></div></section>`; }

function route(){
  if(SR){ SR.user = true; try{ SR.rec.stop(); }catch(e){} SR = null; }
  try{ speechSynthesis.cancel(); }catch(e){}
  const h = location.hash.replace('#', ''); let html;
  let m;
  if(!h) html = home();
  else if((m = h.match(/^(u[1-4])-train$/)) && ready(m[1])){ html = train(m[1]); setTimeout(() => { const b = $('.trainbox [data-say]'); if(b) speak(b.dataset.say); }, 300); }
  else if((m = h.match(/^(u[1-4])-(\d+)$/)) && ready(m[1])){ html = topic(m[1], +m[2]); track('learn_topic', {u: m[1], i: +m[2]}); }
  else if((m = h.match(/^(u[1-4])$/)) && ready(m[1])){ html = lesson(m[1]); track('learn_lesson', {u: m[1]}); }
  else html = home();
  $('#app').innerHTML = html; window.scrollTo({top: 0});
}
window.addEventListener('hashchange', route);
document.addEventListener('click', e => {
  const cz = e.target.closest('.cz'); if(cz){ speak(cz.textContent.replace(/[/]/g, ' ')); return; }
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.say){ speak(b.dataset.say, !!b.dataset.slow); return; }
  if(b.hasAttribute('data-show')){ const box = b.closest('.qa, .trainbox').querySelector('.ans'); box.hidden = !box.hidden; b.textContent = box.hidden ? t('showA') : t('hideA'); return; }
  if(b.hasAttribute('data-sr')){ srToggle(b, b.closest('.qa, .trainbox').querySelector('.srout'), b.dataset.model, b.dataset.q); return; }
  if(b.dataset.done){ const k = b.dataset.done; if(DONE[k]) delete DONE[k]; else DONE[k] = 1; saveDone(); route(); return; }
  if(b.hasAttribute('data-next')){ TR.n++; $('#app').innerHTML = trainView(); const s = $('.trainbox [data-say]'); if(s) speak(s.dataset.say); return; }
  if(b.dataset.vid){ const ph = b.closest('.ph'); ph.outerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(b.dataset.vid)}?autoplay=1&rel=0" title="YouTube" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`; track('learn_video', {id: b.dataset.vid}); return; }
});
document.addEventListener('click', e => { const a = e.target.closest('[data-retrain]'); if(a && location.hash === a.getAttribute('href')){ e.preventDefault(); route(); } });
route();
})();
</script>
</body>
</html>
