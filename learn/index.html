е звучати розмова на іспиті. Слухайте репліки екзаменатора й тренуйте свої.","This is how the exam conversation can sound. Listen to the examiner and practise your lines.","Так может звучать разговор на экзамене. Слушайте реплики экзаменатора и тренируйте свои.","Cuộc hội thoại khi thi có thể như thế này. Nghe giám khảo và luyện phần của bạn."],"examiner":["Екзаменатор","Examiner","Экзаменатор","Giám khảo"],"you":["Ви","You","Вы","Bạn"],"fb2q":["✓ Це питання (є питальне слово або «Máte / Můžu…»)","✓ It is a question (question word or “Máte / Můžu…”)","✓ Это вопрос (есть вопросительное слово или «Máte / Můžu…»)","✓ Đây là câu hỏi (có từ để hỏi hoặc «Máte / Můžu…»)"],"fb2noq":["Не чути питального слова. Почніть з Kolik / Kdy / Kde / Jak… або Máte / Můžu…","No question word heard. Start with Kolik / Kdy / Kde / Jak… or Máte / Můžu…","Не слышно вопросительного слова. Начните с Kolik / Kdy / Kde / Jak… или Máte / Můžu…","Không nghe thấy từ để hỏi. Bắt đầu bằng Kolik / Kdy / Kde / Jak… hoặc Máte / Můžu…"],"fb2ty":["Почуто «ти» (máš, můžeš…). Тут треба на «Ви»: máte, můžete.","Informal “ty” heard (máš, můžeš…). Use the formal “Vy” here: máte, můžete.","Слышно «ты» (máš, můžeš…). Здесь нужно на «Вы»: máte, můžete.","Nghe thấy «ty» (máš, můžeš…). Ở đây cần «Vy»: máte, můžete."],"fb2vy":["✓ Без «ти», ввічливо","✓ No informal “ty”, polite","✓ Без «ты», вежливо","✓ Không dùng «ty», lịch sự"],"situation":["Ситуація","Situation","Ситуация","Tình huống"],"situations":["Ситуації","Situations","Ситуации","Các tình huống"],"situationsd":["40 ситуацій з трьома варіантами й озвученим діалогом.","40 situations with three options and a dialogue with audio.","40 ситуаций с тремя вариантами и озвученным диалогом.","40 tình huống với ba lựa chọn và hội thoại có âm thanh."],"dialog4":["Діалог: ваші репліки","Dialogue: your lines","Диалог: ваши реплики","Hội thoại: lượt của bạn"],"dialog4D":["Прослухайте друга (▶), скажіть свою репліку вголос (🗣), потім звірте зі зразком.","Listen to your friend (▶), say your line out loud (🗣), then check the sample.","Послушайте друга (▶), скажите свою реплику вслух (🗣), потом сверьте с образцом.","Nghe bạn nói (▶), nói lượt của bạn thành tiếng (🗣), rồi so với mẫu."],"friend":["Друг","Friend","Друг","Bạn bè"],"fb4sug":["✓ Є пропозиція (můžeme, pojďme, co třeba…)","✓ A suggestion (můžeme, pojďme, co třeba…)","✓ Есть предложение (můžeme, pojďme, co třeba…)","✓ Có đề xuất (můžeme, pojďme, co třeba…)"],"fb4nosug":["Пропозиції не чути. Спробуйте: Můžeme… / Pojďme… / Co třeba…?","No suggestion heard. Try: Můžeme… / Pojďme… / Co třeba…?","Предложения не слышно. Попробуйте: Můžeme… / Pojďme… / Co třeba…?","Không nghe thấy đề xuất. Thử: Můžeme… / Pojďme… / Co třeba…?"],"fb4why":["Додайте пояснення: «protože…»","Add a reason: «protože…»","Добавьте объяснение: «protože…»","Thêm lý do: «protože…»"],"fb4vy":["Почуто «Ви» (máte, chcete…). З другом говоримо на «ти»: máš, chceš.","Formal “Vy” heard (máte, chcete…). With a friend use “ty”: máš, chceš.","Слышно «Вы» (máte, chcete…). С другом говорим на «ты»: máš, chceš.","Nghe thấy «Vy» (máte, chcete…). Với bạn bè dùng «ty»: máš, chceš."],"fb4ty":["✓ Неформально, на «ти»","✓ Informal “ty”, as with a friend","✓ Неформально, на «ты»","✓ Thân mật, dùng «ty»"],"gP":["Psaní · письмо","Psaní · writing","Psaní · письмо","Psaní · phần viết"],"w1":["Psaní 1 · Формуляр","Psaní 1 · The form","Psaní 1 · Формуляр","Psaní 1 · Mẫu đơn"],"w2":["Psaní 2 · E-mail","Psaní 2 · The e-mail","Psaní 2 · E-mail","Psaní 2 · E-mail"],"w1d":["3 відповіді по 10+ слів цілим реченням.","3 answers of 10+ words in full sentences.","3 ответа по 10+ слов полным предложением.","3 câu trả lời, mỗi câu 10+ từ."],"w2d":["Лист на 35+ слів за 5 картинками: звертання, мета, прощання.","An e-mail of 35+ words from 5 pictures: greeting, purpose, closing.","Письмо на 35+ слов по 5 картинкам: обращение, цель, прощание.","E-mail 35+ từ theo 5 tranh: chào, mục đích, kết thư."],"forms":["Формуляри","Forms","Формуляры","Mẫu đơn"],"formsd":["40 формулярів: напишіть відповіді, перевірте кількість слів і порівняйте зі зразком.","40 forms: write your answers, check the word count and compare with the sample.","40 формуляров: напишите ответы, проверьте количество слов и сравните с образцом.","40 mẫu đơn: viết câu trả lời, kiểm tra số từ và so với mẫu."],"mails":["Листи","E-mails","Письма","Các e-mail"],"mailsd":["40 ситуацій: напишіть лист за картинками, перевірте його й порівняйте зі зразком.","40 situations: write the e-mail from the pictures, check it and compare with the sample.","40 ситуаций: напишите письмо по картинкам, проверьте его и сравните с образцом.","40 tình huống: viết e-mail theo tranh, kiểm tra và so với mẫu."],"form":["Формуляр","Form","Формуляр","Mẫu đơn"],"mail":["Лист","E-mail","Письмо","E-mail"],"modelMail":["Зразок листа","Sample e-mail","Образец письма","E-mail mẫu"],"writeHere":["Пишіть чеською тут…","Write in Czech here…","Пишите по-чешски здесь…","Viết tiếng Séc ở đây…"],"check":["Перевірити","Check","Проверить","Kiểm tra"],"fbW1min":["потрібно мінімум 10","at least 10 needed","нужно минимум 10","cần ít nhất 10"],"fbW2min":["потрібно мінімум 35, інакше 0 балів","at least 35 needed, otherwise 0 points","нужно минимум 35, иначе 0 баллов","cần ít nhất 35, nếu không được 0 điểm"],"fbSent":["✓ Речення з великої літери й крапкою","✓ Sentence with a capital letter and a full stop","✓ Предложение с заглавной буквы и точкой","✓ Câu có chữ hoa đầu và dấu chấm"],"fbNoSent":["Почніть з великої літери й закінчіть крапкою.","Start with a capital letter and end with a full stop.","Начните с заглавной буквы и закончите точкой.","Bắt đầu bằng chữ hoa và kết thúc bằng dấu chấm."],"fbGreet":["✓ Є звертання","✓ Greeting","✓ Есть обращение","✓ Có lời chào"],"fbNoGreet":["Почніть зі звертання: Dobrý den, / Ahoj Petře,","Start with a greeting: Dobrý den, / Ahoj Petře,","Начните с обращения: Dobrý den, / Ahoj Petře,","Bắt đầu bằng lời chào: Dobrý den, / Ahoj Petře,"],"fbClose":["✓ Є прощання","✓ Closing","✓ Есть прощание","✓ Có lời kết"],"fbNoClose":["Додайте прощання: S pozdravem / Děkuji / Měj se","Add a closing: S pozdravem / Děkuji / Měj se","Добавьте прощание: S pozdravem / Děkuji / Měj se","Thêm lời kết: S pozdravem / Děkuji / Měj se"],"fbSign":["✓ Є підпис","✓ Signature","✓ Есть подпись","✓ Có chữ ký"],"fbNoSign":["Підпишіться в останньому рядку своїм ім’ям.","Sign with your name on the last line.","Подпишитесь в последней строке своим именем.","Ký tên ở dòng cuối."],"fbSents":["Речень","Sentences","Предложений","Số câu"],"fbSentsMore":["бажано 4+: мета й по реченню на кожну картинку","aim for 4+: purpose and one per picture","желательно 4+: цель и по предложению на каждую картинку","nên 4+: mục đích và mỗi tranh một câu"],"fbMix":["Змішано «Ви» і «ти» в одному листі. Оберіть одне.","Formal and informal “you” are mixed. Choose one.","Смешаны «Вы» и «ты» в одном письме. Выберите одно.","Trộn lẫn «Vy» và «ty» trong một e-mail. Hãy chọn một."],"practiceW":["Psaní на час","Timed Psaní","Psaní на время","Psaní có giờ"],"practiceWD":["Як на іспиті: випадковий формуляр і випадковий лист, 25 хвилин на все.","Like the exam: a random form and a random e-mail, 25 minutes in total.","Как на экзамене: случайный формуляр и случайное письмо, 25 минут на всё.","Giống khi thi: một mẫu đơn và một e-mail ngẫu nhiên, tổng cộng 25 phút."]},"theory":{"u1":{"uk":{"how":"\n<p>Екзаменатор називає <b>тему<\/b> і ставить <b>4 питання<\/b>. Потім друга тема і ще 4 питання. Разом 8 питань, близько 3 хвилин, <b>8 балів<\/b>. Питань ви заздалегідь не бачите, лише чуєте.<\/p>\n<ul>\n<li>Питання прості, про ваше життя: де живете, що робите, що робили вчора, що будете робити.<\/li>\n<li>У кожній темі зазвичай є питання в <b>різних часах<\/b>: теперішньому, минулому, майбутньому, а часто й «що б ви хотіли».<\/li>\n<li>Оцінюють, чи ви зрозуміли питання, чи відповіли <b>цілим реченням<\/b>, чи правильний час і чи достатньо слів.<\/li>\n<\/ul>","grammar":"\n<h4>Формула доброї відповіді<\/h4>\n<p class=\"formula\">Відповідь цілим реченням <span>+<\/span> одна деталь <span>+<\/span> <span class=\"cz\">protože…<\/span> / <span class=\"cz\">a…<\/span> / <span class=\"cz\">ale…<\/span><\/p>\n<p>Не <span class=\"cz\">V Kralupech.<\/span>, а <span class=\"cz\">Bydlím v Kralupech, je to malé město blízko Prahy.<\/span><\/p>\n<h4>Головний секрет: беріть дієслово з питання<\/h4>\n<table class=\"tbl\">\n<tr><th>Питання<\/th><th>Відповідь починається так<\/th><th>Час<\/th><\/tr>\n<tr><td><span class=\"cz\">Kde bydlíte?<\/span><\/td><td><span class=\"cz\">Bydlím…<\/span><\/td><td>теперішній<\/td><\/tr>\n<tr><td><span class=\"cz\">Co děláte ve volném čase?<\/span><\/td><td><span class=\"cz\">Ve volném čase dělám / čtu / chodím…<\/span><\/td><td>теперішній<\/td><\/tr>\n<tr><td><span class=\"cz\">Co jste dělal/a včera?<\/span><\/td><td><span class=\"cz\">Včera jsem dělal/a…<\/span><\/td><td>минулий<\/td><\/tr>\n<tr><td><span class=\"cz\">Kde jste byl/a na dovolené?<\/span><\/td><td><span class=\"cz\">Na dovolené jsem byl/a…<\/span><\/td><td>минулий<\/td><\/tr>\n<tr><td><span class=\"cz\">Co budete dělat o víkendu?<\/span><\/td><td><span class=\"cz\">O víkendu budu…<\/span> / <span class=\"cz\">pojedu…<\/span> / <span class=\"cz\">půjdu…<\/span><\/td><td>майбутній<\/td><\/tr>\n<tr><td><span class=\"cz\">Co byste chtěl/a…?<\/span><\/td><td><span class=\"cz\">Chtěl/a bych…<\/span><\/td><td>«хотів би»<\/td><\/tr>\n<\/table>\n<h4>Теперішній час: закінчення «я»<\/h4>\n<p><span class=\"cz\">bydlet → bydlím<\/span> · <span class=\"cz\">dělat → dělám<\/span> · <span class=\"cz\">mít → mám<\/span> · <span class=\"cz\">být → jsem<\/span> · <span class=\"cz\">pracovat → pracuju<\/span> · <span class=\"cz\">jít → jdu<\/span> · <span class=\"cz\">jet → jedu<\/span><\/p>\n<h4>Минулий час: дієслово на -l + jsem<\/h4>\n<p><span class=\"cz\">dělat → dělal jsem<\/span> (чоловік) / <span class=\"cz\">dělala jsem<\/span> (жінка). У питанні «ви»: <span class=\"cz\">Co jste dělal/a?<\/span> Відповідь «я»: <span class=\"cz\">Dělal/a jsem…<\/span><\/p>\n<p>Часті неправильні: <span class=\"cz\">být → byl/a<\/span> · <span class=\"cz\">jít → šel / šla<\/span> · <span class=\"cz\">jet → jel/a<\/span> · <span class=\"cz\">mít → měl/a<\/span> · <span class=\"cz\">jíst → jedl/a<\/span> · <span class=\"cz\">vidět → viděl/a<\/span><\/p>\n<h4>Майбутній час<\/h4>\n<p><span class=\"cz\">budu + інфінітив<\/span>: <span class=\"cz\">budu pracovat, budu se učit<\/span>. Рух: <span class=\"cz\">pojedu<\/span> (поїду), <span class=\"cz\">půjdu<\/span> (піду). Коли: <span class=\"cz\">zítra, o víkendu, příští týden, příští rok<\/span>.<\/p>\n<h4>«Хотів би»<\/h4>\n<p><span class=\"cz\">Chtěl bych<\/span> (чоловік) / <span class=\"cz\">Chtěla bych<\/span> (жінка) + інфінітив: <span class=\"cz\">Chtěla bych mít větší byt.<\/span><\/p>","tips":"\n<ul>\n<li><b>Не зрозуміли питання?<\/b> Попросіть повторити: <span class=\"cz\">Promiňte, můžete to zopakovat?<\/span> Це нормально, балів за це не знімають.<\/li>\n<li><b>Не відповідайте одним словом.<\/b> «Ano» чи «V sobotu» майже нічого не дає. Додайте речення.<\/li>\n<li><b>Слухайте, в якому часі питання<\/b>: <span class=\"cz\">jste dělal/a<\/span> — минулий, <span class=\"cz\">budete<\/span> — майбутній.<\/li>\n<li><b>Не знаєте слова?<\/b> Скажіть простіше: замість <span class=\"cz\">účetní<\/span> — <span class=\"cz\">pracuju v kanceláři s čísly<\/span>.<\/li>\n<li><b>Підготуйте розповідь про себе<\/b> на 1 хвилину: ім'я, звідки ви, сім'я, робота, хобі. Її шматки підходять до багатьох тем.<\/li>\n<li>Відповідь не мусить бути правдою. Головне, щоб вона була правильна й зрозуміла.<\/li>\n<\/ul>"},"en":{"how":"\n<p>The examiner names a <b>topic<\/b> and asks <b>4 questions<\/b>. Then a second topic and 4 more questions. 8 questions in total, about 3 minutes, <b>8 points<\/b>. You do not see the questions in advance, you only hear them.<\/p>\n<ul>\n<li>The questions are simple and about your life: where you live, what you do, what you did yesterday, what you will do.<\/li>\n<li>Each topic usually has questions in <b>different tenses<\/b>: present, past, future, and often “what would you like”.<\/li>\n<li>They assess whether you understood the question, answered in a <b>full sentence<\/b>, used the right tense and said enough words.<\/li>\n<\/ul>","grammar":"\n<h4>The formula of a good answer<\/h4>\n<p class=\"formula\">A full-sentence answer <span>+<\/span> one detail <span>+<\/span> <span class=\"cz\">protože…<\/span> / <span class=\"cz\">a…<\/span> / <span class=\"cz\">ale…<\/span><\/p>\n<p>Not <span class=\"cz\">V Kralupech.<\/span> but <span class=\"cz\">Bydlím v Kralupech, je to malé město blízko Prahy.<\/span><\/p>\n<h4>The main secret: take the verb from the question<\/h4>\n<table class=\"tbl\">\n<tr><th>Question<\/th><th>The answer starts like this<\/th><th>Tense<\/th><\/tr>\n<tr><td><span class=\"cz\">Kde bydlíte?<\/span><\/td><td><span class=\"cz\">Bydlím…<\/span><\/td><td>present<\/td><\/tr>\n<tr><td><span class=\"cz\">Co děláte ve volném čase?<\/span><\/td><td><span class=\"cz\">Ve volném čase dělám / čtu / chodím…<\/span><\/td><td>present<\/td><\/tr>\n<tr><td><span class=\"cz\">Co jste dělal/a včera?<\/span><\/td><td><span class=\"cz\">Včera jsem dělal/a…<\/span><\/td><td>past<\/td><\/tr>\n<tr><td><span class=\"cz\">Kde jste byl/a na dovolené?<\/span><\/td><td><span class=\"cz\">Na dovolené jsem byl/a…<\/span><\/td><td>past<\/td><\/tr>\n<tr><td><span class=\"cz\">Co budete dělat o víkendu?<\/span><\/td><td><span class=\"cz\">O víkendu budu…<\/span> / <span class=\"cz\">pojedu…<\/span> / <span class=\"cz\">půjdu…<\/span><\/td><td>future<\/td><\/tr>\n<tr><td><span class=\"cz\">Co byste chtěl/a…?<\/span><\/td><td><span class=\"cz\">Chtěl/a bych…<\/span><\/td><td>“would like”<\/td><\/tr>\n<\/table>\n<h4>Present tense: the “I” ending<\/h4>\n<p><span class=\"cz\">bydlet → bydlím<\/span> · <span class=\"cz\">dělat → dělám<\/span> · <span class=\"cz\">mít → mám<\/span> · <span class=\"cz\">být → jsem<\/span> · <span class=\"cz\">pracovat → pracuju<\/span> · <span class=\"cz\">jít → jdu<\/span> · <span class=\"cz\">jet → jedu<\/span><\/p>\n<h4>Past tense: verb ending in -l + jsem<\/h4>\n<p><span class=\"cz\">dělat → dělal jsem<\/span> (man) / <span class=\"cz\">dělala jsem<\/span> (woman). The question uses “you”: <span class=\"cz\">Co jste dělal/a?<\/span> The answer uses “I”: <span class=\"cz\">Dělal/a jsem…<\/span><\/p>\n<p>Common irregular ones: <span class=\"cz\">být → byl/a<\/span> · <span class=\"cz\">jít → šel / šla<\/span> · <span class=\"cz\">jet → jel/a<\/span> · <span class=\"cz\">mít → měl/a<\/span> · <span class=\"cz\">jíst → jedl/a<\/span> · <span class=\"cz\">vidět → viděl/a<\/span><\/p>\n<h4>Future tense<\/h4>\n<p><span class=\"cz\">budu + infinitive<\/span>: <span class=\"cz\">budu pracovat, budu se učit<\/span>. Movement: <span class=\"cz\">pojedu<\/span> (I will go by vehicle), <span class=\"cz\">půjdu<\/span> (I will go on foot). When: <span class=\"cz\">zítra, o víkendu, příští týden, příští rok<\/span>.<\/p>\n<h4>“I would like”<\/h4>\n<p><span class=\"cz\">Chtěl bych<\/span> (man) / <span class=\"cz\">Chtěla bych<\/span> (woman) + infinitive: <span class=\"cz\">Chtěla bych mít větší byt.<\/span><\/p>","tips":"\n<ul>\n<li><b>Didn't understand?<\/b> Ask them to repeat: <span class=\"cz\">Promiňte, můžete to zopakovat?<\/span> This is normal and costs no points.<\/li>\n<li><b>Don't answer with one word.<\/b> “Ano” or “V sobotu” gives almost nothing. Add a sentence.<\/li>\n<li><b>Listen for the tense<\/b>: <span class=\"cz\">jste dělal/a<\/span> is past, <span class=\"cz\">budete<\/span> is future.<\/li>\n<li><b>Don't know a word?<\/b> Say it more simply: instead of <span class=\"cz\">účetní<\/span> say <span class=\"cz\">pracuju v kanceláři s čísly<\/span>.<\/li>\n<li><b>Prepare a 1-minute talk about yourself<\/b>: name, where you are from, family, work, hobbies. Parts of it fit many topics.<\/li>\n<li>Your answer doesn't have to be true. It just has to be correct and clear.<\/li>\n<\/ul>"},"ru":{"how":"\n<p>Экзаменатор называет <b>тему<\/b> и задаёт <b>4 вопроса<\/b>. Потом вторая тема и ещё 4 вопроса. Всего 8 вопросов, около 3 минут, <b>8 баллов<\/b>. Вопросов заранее вы не видите, только слышите.<\/p>\n<ul>\n<li>Вопросы простые, о вашей жизни: где живёте, что делаете, что делали вчера, что будете делать.<\/li>\n<li>В каждой теме обычно есть вопросы в <b>разных временах<\/b>: настоящем, прошедшем, будущем, а часто и «что бы вы хотели».<\/li>\n<li>Оценивают, поняли ли вы вопрос, ответили ли <b>полным предложением<\/b>, правильно ли время и достаточно ли слов.<\/li>\n<\/ul>","grammar":"\n<h4>Формула хорошего ответа<\/h4>\n<p class=\"formula\">Ответ полным предложением <span>+<\/span> одна деталь <span>+<\/span> <span class=\"cz\">protože…<\/span> / <span class=\"cz\">a…<\/span> / <span class=\"cz\">ale…<\/span><\/p>\n<p>Не <span class=\"cz\">V Kralupech.<\/span>, а <span class=\"cz\">Bydlím v Kralupech, je to malé město blízko Prahy.<\/span><\/p>\n<h4>Главный секрет: берите глагол из вопроса<\/h4>\n<table class=\"tbl\">\n<tr><th>Вопрос<\/th><th>Ответ начинается так<\/th><th>Время<\/th><\/tr>\n<tr><td><span class=\"cz\">Kde bydlíte?<\/span><\/td><td><span class=\"cz\">Bydlím…<\/span><\/td><td>настоящее<\/td><\/tr>\n<tr><td><span class=\"cz\">Co děláte ve volném čase?<\/span><\/td><td><span class=\"cz\">Ve volném čase dělám / čtu / chodím…<\/span><\/td><td>настоящее<\/td><\/tr>\n<tr><td><span class=\"cz\">Co jste dělal/a včera?<\/span><\/td><td><span class=\"cz\">Včera jsem dělal/a…<\/span><\/td><td>прошедшее<\/td><\/tr>\n<tr><td><span class=\"cz\">Kde jste byl/a na dovolené?<\/span><\/td><td><span class=\"cz\">Na dovolené jsem byl/a…<\/span><\/td><td>прошедшее<\/td><\/tr>\n<tr><td><span class=\"cz\">Co budete dělat o víkendu?<\/span><\/td><td><span class=\"cz\">O víkendu budu…<\/span> / <span class=\"cz\">pojedu…<\/span> / <span class=\"cz\">půjdu…<\/span><\/td><td>будущее<\/td><\/tr>\n<tr><td><span class=\"cz\">Co byste chtěl/a…?<\/span><\/td><td><span class=\"cz\">Chtěl/a bych…<\/span><\/td><td>«хотел бы»<\/td><\/tr>\n<\/table>\n<h4>Настоящее время: окончание «я»<\/h4>\n<p><span class=\"cz\">bydlet → bydlím<\/span> · <span class=\"cz\">dělat → dělám<\/span> · <span class=\"cz\">mít → mám<\/span> · <span class=\"cz\">být → jsem<\/span> · <span class=\"cz\">pracovat → pracuju<\/span> · <span class=\"cz\">jít → jdu<\/span> · <span class=\"cz\">jet → jedu<\/span><\/p>\n<h4>Прошедшее время: глагол на -l + jsem<\/h4>\n<p><span class=\"cz\">dělat → dělal jsem<\/span> (мужчина) / <span class=\"cz\">dělala jsem<\/span> (женщина). В вопросе «вы»: <span class=\"cz\">Co jste dělal/a?<\/span> В ответе «я»: <span class=\"cz\">Dělal/a jsem…<\/span><\/p>\n<p>Частые неправильные: <span class=\"cz\">být → byl/a<\/span> · <span class=\"cz\">jít → šel / šla<\/span> · <span class=\"cz\">jet → jel/a<\/span> · <span class=\"cz\">mít → měl/a<\/span> · <span class=\"cz\">jíst → jedl/a<\/span> · <span class=\"cz\">vidět → viděl/a<\/span><\/p>\n<h4>Будущее время<\/h4>\n<p><span class=\"cz\">budu + инфинитив<\/span>: <span class=\"cz\">budu pracovat, budu se učit<\/span>. Движение: <span class=\"cz\">pojedu<\/span> (поеду), <span class=\"cz\">půjdu<\/span> (пойду). Когда: <span class=\"cz\">zítra, o víkendu, příští týden, příští rok<\/span>.<\/p>\n<h4>«Хотел бы»<\/h4>\n<p><span class=\"cz\">Chtěl bych<\/span> (мужчина) / <span class=\"cz\">Chtěla bych<\/span> (женщина) + инфинитив: <span class=\"cz\">Chtěla bych mít větší byt.<\/span><\/p>","tips":"\n<ul>\n<li><b>Не поняли вопрос?<\/b> Попросите повторить: <span class=\"cz\">Promiňte, můžete to zopakovat?<\/span> Это нормально, баллы за это не снимают.<\/li>\n<li><b>Не отвечайте одним словом.<\/b> «Ano» или «V sobotu» почти ничего не даёт. Добавьте предложение.<\/li>\n<li><b>Слушайте, в каком времени вопрос<\/b>: <span class=\"cz\">jste dělal/a<\/span> — прошедшее, <span class=\"cz\">budete<\/span> — будущее.<\/li>\n<li><b>Не знаете слова?<\/b> Скажите проще: вместо <span class=\"cz\">účetní<\/span> — <span class=\"cz\">pracuju v kanceláři s čísly<\/span>.<\/li>\n<li><b>Подготовьте рассказ о себе<\/b> на 1 минуту: имя, откуда вы, семья, работа, хобби. Его части подходят ко многим темам.<\/li>\n<li>Ответ не обязан быть правдой. Главное, чтобы он был правильным и понятным.<\/li>\n<\/ul>"},"vi":{"how":"\n<p>Giám khảo nêu một <b>chủ đề<\/b> và hỏi <b>4 câu<\/b>. Sau đó là chủ đề thứ hai và thêm 4 câu. Tổng cộng 8 câu, khoảng 3 phút, <b>8 điểm<\/b>. Bạn không nhìn thấy câu hỏi trước, chỉ nghe.<\/p>\n<ul>\n<li>Câu hỏi đơn giản, về cuộc sống của bạn: sống ở đâu, làm gì, hôm qua làm gì, sẽ làm gì.<\/li>\n<li>Mỗi chủ đề thường có câu hỏi ở <b>các thì khác nhau<\/b>: hiện tại, quá khứ, tương lai, và thường có cả «bạn muốn gì».<\/li>\n<li>Giám khảo đánh giá bạn có hiểu câu hỏi không, có trả lời bằng <b>câu đầy đủ<\/b>, dùng đúng thì và nói đủ từ không.<\/li>\n<\/ul>","grammar":"\n<h4>Công thức một câu trả lời tốt<\/h4>\n<p class=\"formula\">Trả lời bằng câu đầy đủ <span>+<\/span> một chi tiết <span>+<\/span> <span class=\"cz\">protože…<\/span> / <span class=\"cz\">a…<\/span> / <span class=\"cz\">ale…<\/span><\/p>\n<p>Không phải <span class=\"cz\">V Kralupech.<\/span> mà là <span class=\"cz\">Bydlím v Kralupech, je to malé město blízko Prahy.<\/span><\/p>\n<h4>Bí quyết chính: lấy động từ trong câu hỏi<\/h4>\n<table class=\"tbl\">\n<tr><th>Câu hỏi<\/th><th>Câu trả lời bắt đầu như sau<\/th><th>Thì<\/th><\/tr>\n<tr><td><span class=\"cz\">Kde bydlíte?<\/span><\/td><td><span class=\"cz\">Bydlím…<\/span><\/td><td>hiện tại<\/td><\/tr>\n<tr><td><span class=\"cz\">Co děláte ve volném čase?<\/span><\/td><td><span class=\"cz\">Ve volném čase dělám / čtu / chodím…<\/span><\/td><td>hiện tại<\/td><\/tr>\n<tr><td><span class=\"cz\">Co jste dělal/a včera?<\/span><\/td><td><span class=\"cz\">Včera jsem dělal/a…<\/span><\/td><td>quá khứ<\/td><\/tr>\n<tr><td><span class=\"cz\">Kde jste byl/a na dovolené?<\/span><\/td><td><span class=\"cz\">Na dovolené jsem byl/a…<\/span><\/td><td>quá khứ<\/td><\/tr>\n<tr><td><span class=\"cz\">Co budete dělat o víkendu?<\/span><\/td><td><span class=\"cz\">O víkendu budu…<\/span> / <span class=\"cz\">pojedu…<\/span> / <span class=\"cz\">půjdu…<\/span><\/td><td>tương lai<\/td><\/tr>\n<tr><td><span class=\"cz\">Co byste chtěl/a…?<\/span><\/td><td><span class=\"cz\">Chtěl/a bych…<\/span><\/td><td>«muốn»<\/td><\/tr>\n<\/table>\n<h4>Thì hiện tại: đuôi của «tôi»<\/h4>\n<p><span class=\"cz\">bydlet → bydlím<\/span> · <span class=\"cz\">dělat → dělám<\/span> · <span class=\"cz\">mít → mám<\/span> · <span class=\"cz\">být → jsem<\/span> · <span class=\"cz\">pracovat → pracuju<\/span> · <span class=\"cz\">jít → jdu<\/span> · <span class=\"cz\">jet → jedu<\/span><\/p>\n<h4>Thì quá khứ: động từ đuôi -l + jsem<\/h4>\n<p><span class=\"cz\">dělat → dělal jsem<\/span> (nam) / <span class=\"cz\">dělala jsem<\/span> (nữ). Câu hỏi dùng «bạn»: <span class=\"cz\">Co jste dělal/a?<\/span> Câu trả lời dùng «tôi»: <span class=\"cz\">Dělal/a jsem…<\/span><\/p>\n<p>Các động từ bất quy tắc hay gặp: <span class=\"cz\">být → byl/a<\/span> · <span class=\"cz\">jít → šel / šla<\/span> · <span class=\"cz\">jet → jel/a<\/span> · <span class=\"cz\">mít → měl/a<\/span> · <span class=\"cz\">jíst → jedl/a<\/span> · <span class=\"cz\">vidět → viděl/a<\/span><\/p>\n<h4>Thì tương lai<\/h4>\n<p><span class=\"cz\">budu + động từ nguyên thể<\/span>: <span class=\"cz\">budu pracovat, budu se učit<\/span>. Di chuyển: <span class=\"cz\">pojedu<\/span> (đi bằng xe), <span class=\"cz\">půjdu<\/span> (đi bộ). Khi nào: <span class=\"cz\">zítra, o víkendu, příští týden, příští rok<\/span>.<\/p>\n<h4>«Tôi muốn»<\/h4>\n<p><span class=\"cz\">Chtěl bych<\/span> (nam) / <span class=\"cz\">Chtěla bych<\/span> (nữ) + động từ nguyên thể: <span class=\"cz\">Chtěla bych mít větší byt.<\/span><\/p>","tips":"\n<ul>\n<li><b>Không hiểu câu hỏi?<\/b> Xin nhắc lại: <span class=\"cz\">Promiňte, můžete to zopakovat?<\/span> Điều này bình thường và không bị trừ điểm.<\/li>\n<li><b>Đừng trả lời bằng một từ.<\/b> «Ano» hay «V sobotu» gần như không được điểm. Hãy nói thêm một câu.<\/li>\n<li><b>Nghe xem câu hỏi ở thì nào<\/b>: <span class=\"cz\">jste dělal/a<\/span> là quá khứ, <span class=\"cz\">budete<\/span> là tương lai.<\/li>\n<li><b>Không biết từ?<\/b> Nói đơn giản hơn: thay vì <span class=\"cz\">účetní<\/span> hãy nói <span class=\"cz\">pracuju v kanceláři s čísly<\/span>.<\/li>\n<li><b>Chuẩn bị một phút nói về bản thân<\/b>: tên, quê, gia đình, công việc, sở thích. Các phần của nó dùng được cho nhiều chủ đề.<\/li>\n<li>Câu trả lời không cần phải đúng sự thật. Quan trọng là đúng ngữ pháp và dễ hiểu.<\/li>\n<\/ul>"}},"u2":{"uk":{"how":"\n<p>Ви отримуєте <b>2 картки<\/b> з ситуацією, наприклад <span class=\"cz\">Jste na recepci hotelu.<\/span> На картці <b>3 короткі підказки<\/b> (<span class=\"cz\">Volný pokoj?<\/span> · <span class=\"cz\">Kč za noc?<\/span> · <span class=\"cz\">Hodina snídaně?<\/span>) і четвертий пункт <span class=\"cz\">…? (vaše otázka)<\/span>, де питання треба придумати самому. Разом 8 питань, <b>12 балів<\/b>.<\/p>\n<ul>\n<li><b>Питаєте ви<\/b>, екзаменатор відповідає, як працівник готелю, пошти чи магазину.<\/li>\n<li>Оцінюють, чи з підказки вийшло <b>повне правильне питання<\/b>, чи ви говорите ввічливо на <b>«Ви»<\/b> і чи четверте питання підходить до ситуації.<\/li>\n<li>Добрий порядок: привітання і мета → 4 питання → подяка й прощання.<\/li>\n<\/ul>","grammar":"\n<h4>З підказки робимо питання<\/h4>\n<div class=\"tblw\"><table class=\"tbl\">\n<tr><th>Підказка<\/th><th>Питання<\/th><\/tr>\n<tr><td><span class=\"cz\">Volný pokoj?<\/span><\/td><td><span class=\"cz\">Máte volný pokoj?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Kč za noc?<\/span> / <span class=\"cz\">Cena?<\/span><\/td><td><span class=\"cz\">Kolik stojí jedna noc?<\/span> · <span class=\"cz\">Kolik to stojí?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Hodina snídaně?<\/span><\/td><td><span class=\"cz\">V kolik hodin je snídaně?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Otevírací doba?<\/span><\/td><td><span class=\"cz\">Od kolika do kolika máte otevřeno?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Platba kartou?<\/span><\/td><td><span class=\"cz\">Můžu platit kartou?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Doba opravy?<\/span><\/td><td><span class=\"cz\">Jak dlouho bude oprava trvat?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Parkování?<\/span><\/td><td><span class=\"cz\">Je u vás parkoviště?<\/span> · <span class=\"cz\">Kde můžu parkovat?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Sleva?<\/span><\/td><td><span class=\"cz\">Máte nějakou slevu?<\/span><\/td><\/tr>\n<\/table><\/div>\n<h4>Питальні слова<\/h4>\n<p><span class=\"cz\">Kolik?<\/span> скільки · <span class=\"cz\">Kdy? V kolik hodin?<\/span> коли · <span class=\"cz\">Kde?<\/span> де · <span class=\"cz\">Jak dlouho?<\/span> як довго · <span class=\"cz\">Jaký? Která?<\/span> який · <span class=\"cz\">Proč?<\/span> чому · <span class=\"cz\">Od kolika do kolika?<\/span> з якої до якої години<\/p>\n<h4>Питання «так / ні»: дієслово на початку<\/h4>\n<p><span class=\"cz\">Máte…?<\/span> (у вас є) · <span class=\"cz\">Můžu…? / Můžete…?<\/span> (можна / можете) · <span class=\"cz\">Musím…?<\/span> (мушу) · <span class=\"cz\">Je možné…?<\/span> (чи можна) · <span class=\"cz\">Je tam…?<\/span> (чи там є)<\/p>\n<h4>Ввічливо на «Ви»<\/h4>\n<p>Правильно: <span class=\"cz\">máte, můžete, víte, potřebujete<\/span>. Неправильно в цьому завданні: <span class=\"cz\">máš, můžeš, víš<\/span>. Початок: <span class=\"cz\">Dobrý den, chtěl/a bych…<\/span> або <span class=\"cz\">Prosím vás, …<\/span>. Кінець: <span class=\"cz\">Děkuju, na shledanou.<\/span><\/p>\n<h4>Четверте питання: універсальні варіанти<\/h4>\n<p><span class=\"cz\">Můžu platit kartou?<\/span> · <span class=\"cz\">Musím se objednat předem?<\/span> · <span class=\"cz\">Je tam parkoviště?<\/span> · <span class=\"cz\">Máte slevu pro děti?<\/span> · <span class=\"cz\">Kde to najdu?<\/span> · <span class=\"cz\">Máte otevřeno i v sobotu?<\/span><\/p>","tips":"\n<ul>\n<li><b>Не читайте підказку вголос<\/b> («Cena?»): з неї треба зробити речення-питання.<\/li>\n<li><b>Слухайте відповідь екзаменатора<\/b> і не питайте того самого двічі.<\/li>\n<li>Четверте питання має <b>стосуватися ситуації<\/b>: у готелі про сніданок чи паркування, а не про погоду.<\/li>\n<li>Якщо відповідь незрозуміла: <span class=\"cz\">Promiňte, můžete to zopakovat?<\/span><\/li>\n<li>Наприкінці подякуйте: <span class=\"cz\">Děkuju za informace. Na shledanou.<\/span><\/li>\n<\/ul>"},"en":{"how":"\n<p>You get <b>2 cards<\/b> with a situation, for example <span class=\"cz\">Jste na recepci hotelu.<\/span> Each card has <b>3 short prompts<\/b> (<span class=\"cz\">Volný pokoj?<\/span> · <span class=\"cz\">Kč za noc?<\/span> · <span class=\"cz\">Hodina snídaně?<\/span>) and a fourth item <span class=\"cz\">…? (vaše otázka)<\/span> where you make up the question yourself. 8 questions in total, <b>12 points<\/b>.<\/p>\n<ul>\n<li><b>You ask<\/b>, the examiner answers as a hotel, post office or shop employee.<\/li>\n<li>They assess whether each prompt became a <b>full correct question<\/b>, whether you speak politely with the formal <b>“Vy”<\/b> and whether the fourth question fits the situation.<\/li>\n<li>A good order: greeting and purpose → 4 questions → thanks and goodbye.<\/li>\n<\/ul>","grammar":"\n<h4>Turn the prompt into a question<\/h4>\n<div class=\"tblw\"><table class=\"tbl\">\n<tr><th>Prompt<\/th><th>Question<\/th><\/tr>\n<tr><td><span class=\"cz\">Volný pokoj?<\/span><\/td><td><span class=\"cz\">Máte volný pokoj?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Kč za noc?<\/span> / <span class=\"cz\">Cena?<\/span><\/td><td><span class=\"cz\">Kolik stojí jedna noc?<\/span> · <span class=\"cz\">Kolik to stojí?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Hodina snídaně?<\/span><\/td><td><span class=\"cz\">V kolik hodin je snídaně?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Otevírací doba?<\/span><\/td><td><span class=\"cz\">Od kolika do kolika máte otevřeno?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Platba kartou?<\/span><\/td><td><span class=\"cz\">Můžu platit kartou?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Doba opravy?<\/span><\/td><td><span class=\"cz\">Jak dlouho bude oprava trvat?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Parkování?<\/span><\/td><td><span class=\"cz\">Je u vás parkoviště?<\/span> · <span class=\"cz\">Kde můžu parkovat?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Sleva?<\/span><\/td><td><span class=\"cz\">Máte nějakou slevu?<\/span><\/td><\/tr>\n<\/table><\/div>\n<h4>Question words<\/h4>\n<p><span class=\"cz\">Kolik?<\/span> how much · <span class=\"cz\">Kdy? V kolik hodin?<\/span> when · <span class=\"cz\">Kde?<\/span> where · <span class=\"cz\">Jak dlouho?<\/span> how long · <span class=\"cz\">Jaký? Která?<\/span> which · <span class=\"cz\">Proč?<\/span> why · <span class=\"cz\">Od kolika do kolika?<\/span> from what time to what time<\/p>\n<h4>Yes/no questions: the verb comes first<\/h4>\n<p><span class=\"cz\">Máte…?<\/span> (do you have) · <span class=\"cz\">Můžu…? / Můžete…?<\/span> (can I / can you) · <span class=\"cz\">Musím…?<\/span> (must I) · <span class=\"cz\">Je možné…?<\/span> (is it possible) · <span class=\"cz\">Je tam…?<\/span> (is there)<\/p>\n<h4>Politely with “Vy”<\/h4>\n<p>Correct: <span class=\"cz\">máte, můžete, víte, potřebujete<\/span>. Wrong in this task: <span class=\"cz\">máš, můžeš, víš<\/span>. Start: <span class=\"cz\">Dobrý den, chtěl/a bych…<\/span> or <span class=\"cz\">Prosím vás, …<\/span>. End: <span class=\"cz\">Děkuju, na shledanou.<\/span><\/p>\n<h4>The fourth question: universal options<\/h4>\n<p><span class=\"cz\">Můžu platit kartou?<\/span> · <span class=\"cz\">Musím se objednat předem?<\/span> · <span class=\"cz\">Je tam parkoviště?<\/span> · <span class=\"cz\">Máte slevu pro děti?<\/span> · <span class=\"cz\">Kde to najdu?<\/span> · <span class=\"cz\">Máte otevřeno i v sobotu?<\/span><\/p>","tips":"\n<ul>\n<li><b>Don't read the prompt aloud<\/b> (“Cena?”): turn it into a question sentence.<\/li>\n<li><b>Listen to the examiner's answer<\/b> and don't ask the same thing twice.<\/li>\n<li>The fourth question must <b>fit the situation<\/b>: at a hotel ask about breakfast or parking, not the weather.<\/li>\n<li>If you don't understand the answer: <span class=\"cz\">Promiňte, můžete to zopakovat?<\/span><\/li>\n<li>Thank them at the end: <span class=\"cz\">Děkuju za informace. Na shledanou.<\/span><\/li>\n<\/ul>"},"ru":{"how":"\n<p>Вы получаете <b>2 карточки<\/b> с ситуацией, например <span class=\"cz\">Jste na recepci hotelu.<\/span> На карточке <b>3 короткие подсказки<\/b> (<span class=\"cz\">Volný pokoj?<\/span> · <span class=\"cz\">Kč za noc?<\/span> · <span class=\"cz\">Hodina snídaně?<\/span>) и четвёртый пункт <span class=\"cz\">…? (vaše otázka)<\/span>, где вопрос нужно придумать самому. Всего 8 вопросов, <b>12 баллов<\/b>.<\/p>\n<ul>\n<li><b>Спрашиваете вы<\/b>, экзаменатор отвечает как сотрудник отеля, почты или магазина.<\/li>\n<li>Оценивают, получился ли из подсказки <b>полный правильный вопрос<\/b>, говорите ли вы вежливо на <b>«Вы»<\/b> и подходит ли четвёртый вопрос к ситуации.<\/li>\n<li>Хороший порядок: приветствие и цель → 4 вопроса → благодарность и прощание.<\/li>\n<\/ul>","grammar":"\n<h4>Из подсказки делаем вопрос<\/h4>\n<div class=\"tblw\"><table class=\"tbl\">\n<tr><th>Подсказка<\/th><th>Вопрос<\/th><\/tr>\n<tr><td><span class=\"cz\">Volný pokoj?<\/span><\/td><td><span class=\"cz\">Máte volný pokoj?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Kč za noc?<\/span> / <span class=\"cz\">Cena?<\/span><\/td><td><span class=\"cz\">Kolik stojí jedna noc?<\/span> · <span class=\"cz\">Kolik to stojí?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Hodina snídaně?<\/span><\/td><td><span class=\"cz\">V kolik hodin je snídaně?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Otevírací doba?<\/span><\/td><td><span class=\"cz\">Od kolika do kolika máte otevřeno?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Platba kartou?<\/span><\/td><td><span class=\"cz\">Můžu platit kartou?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Doba opravy?<\/span><\/td><td><span class=\"cz\">Jak dlouho bude oprava trvat?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Parkování?<\/span><\/td><td><span class=\"cz\">Je u vás parkoviště?<\/span> · <span class=\"cz\">Kde můžu parkovat?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Sleva?<\/span><\/td><td><span class=\"cz\">Máte nějakou slevu?<\/span><\/td><\/tr>\n<\/table><\/div>\n<h4>Вопросительные слова<\/h4>\n<p><span class=\"cz\">Kolik?<\/span> сколько · <span class=\"cz\">Kdy? V kolik hodin?<\/span> когда · <span class=\"cz\">Kde?<\/span> где · <span class=\"cz\">Jak dlouho?<\/span> как долго · <span class=\"cz\">Jaký? Která?<\/span> какой · <span class=\"cz\">Proč?<\/span> почему · <span class=\"cz\">Od kolika do kolika?<\/span> с которого до которого часа<\/p>\n<h4>Вопросы «да / нет»: глагол в начале<\/h4>\n<p><span class=\"cz\">Máte…?<\/span> (у вас есть) · <span class=\"cz\">Můžu…? / Můžete…?<\/span> (можно / можете) · <span class=\"cz\">Musím…?<\/span> (должен ли) · <span class=\"cz\">Je možné…?<\/span> (можно ли) · <span class=\"cz\">Je tam…?<\/span> (есть ли там)<\/p>\n<h4>Вежливо на «Вы»<\/h4>\n<p>Правильно: <span class=\"cz\">máte, můžete, víte, potřebujete<\/span>. Неправильно в этом задании: <span class=\"cz\">máš, můžeš, víš<\/span>. Начало: <span class=\"cz\">Dobrý den, chtěl/a bych…<\/span> или <span class=\"cz\">Prosím vás, …<\/span>. Конец: <span class=\"cz\">Děkuju, na shledanou.<\/span><\/p>\n<h4>Четвёртый вопрос: универсальные варианты<\/h4>\n<p><span class=\"cz\">Můžu platit kartou?<\/span> · <span class=\"cz\">Musím se objednat předem?<\/span> · <span class=\"cz\">Je tam parkoviště?<\/span> · <span class=\"cz\">Máte slevu pro děti?<\/span> · <span class=\"cz\">Kde to najdu?<\/span> · <span class=\"cz\">Máte otevřeno i v sobotu?<\/span><\/p>","tips":"\n<ul>\n<li><b>Не читайте подсказку вслух<\/b> («Cena?»): из неё нужно сделать вопросительное предложение.<\/li>\n<li><b>Слушайте ответ экзаменатора<\/b> и не спрашивайте одно и то же дважды.<\/li>\n<li>Четвёртый вопрос должен <b>подходить к ситуации<\/b>: в отеле о завтраке или парковке, а не о погоде.<\/li>\n<li>Если ответ непонятен: <span class=\"cz\">Promiňte, můžete to zopakovat?<\/span><\/li>\n<li>В конце поблагодарите: <span class=\"cz\">Děkuju za informace. Na shledanou.<\/span><\/li>\n<\/ul>"},"vi":{"how":"\n<p>Bạn nhận <b>2 thẻ<\/b> với một tình huống, ví dụ <span class=\"cz\">Jste na recepci hotelu.<\/span> Trên thẻ có <b>3 gợi ý ngắn<\/b> (<span class=\"cz\">Volný pokoj?<\/span> · <span class=\"cz\">Kč za noc?<\/span> · <span class=\"cz\">Hodina snídaně?<\/span>) và mục thứ tư <span class=\"cz\">…? (vaše otázka)<\/span>, nơi bạn tự nghĩ ra câu hỏi. Tổng cộng 8 câu hỏi, <b>12 điểm<\/b>.<\/p>\n<ul>\n<li><b>Bạn hỏi<\/b>, giám khảo trả lời như nhân viên khách sạn, bưu điện hay cửa hàng.<\/li>\n<li>Giám khảo đánh giá mỗi gợi ý có thành <b>câu hỏi đầy đủ, đúng<\/b> không, bạn có nói lịch sự với <b>«Vy»<\/b> không và câu hỏi thứ tư có hợp tình huống không.<\/li>\n<li>Trình tự tốt: chào và nói mục đích → 4 câu hỏi → cảm ơn và chào tạm biệt.<\/li>\n<\/ul>","grammar":"\n<h4>Biến gợi ý thành câu hỏi<\/h4>\n<div class=\"tblw\"><table class=\"tbl\">\n<tr><th>Gợi ý<\/th><th>Câu hỏi<\/th><\/tr>\n<tr><td><span class=\"cz\">Volný pokoj?<\/span><\/td><td><span class=\"cz\">Máte volný pokoj?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Kč za noc?<\/span> / <span class=\"cz\">Cena?<\/span><\/td><td><span class=\"cz\">Kolik stojí jedna noc?<\/span> · <span class=\"cz\">Kolik to stojí?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Hodina snídaně?<\/span><\/td><td><span class=\"cz\">V kolik hodin je snídaně?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Otevírací doba?<\/span><\/td><td><span class=\"cz\">Od kolika do kolika máte otevřeno?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Platba kartou?<\/span><\/td><td><span class=\"cz\">Můžu platit kartou?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Doba opravy?<\/span><\/td><td><span class=\"cz\">Jak dlouho bude oprava trvat?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Parkování?<\/span><\/td><td><span class=\"cz\">Je u vás parkoviště?<\/span> · <span class=\"cz\">Kde můžu parkovat?<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Sleva?<\/span><\/td><td><span class=\"cz\">Máte nějakou slevu?<\/span><\/td><\/tr>\n<\/table><\/div>\n<h4>Từ để hỏi<\/h4>\n<p><span class=\"cz\">Kolik?<\/span> bao nhiêu · <span class=\"cz\">Kdy? V kolik hodin?<\/span> khi nào · <span class=\"cz\">Kde?<\/span> ở đâu · <span class=\"cz\">Jak dlouho?<\/span> bao lâu · <span class=\"cz\">Jaký? Která?<\/span> loại nào · <span class=\"cz\">Proč?<\/span> tại sao · <span class=\"cz\">Od kolika do kolika?<\/span> từ mấy giờ đến mấy giờ<\/p>\n<h4>Câu hỏi có / không: động từ đứng đầu<\/h4>\n<p><span class=\"cz\">Máte…?<\/span> (bạn có) · <span class=\"cz\">Můžu…? / Můžete…?<\/span> (tôi có thể / bạn có thể) · <span class=\"cz\">Musím…?<\/span> (tôi có phải) · <span class=\"cz\">Je možné…?<\/span> (có thể không) · <span class=\"cz\">Je tam…?<\/span> (ở đó có)<\/p>\n<h4>Lịch sự với «Vy»<\/h4>\n<p>Đúng: <span class=\"cz\">máte, můžete, víte, potřebujete<\/span>. Sai trong bài này: <span class=\"cz\">máš, můžeš, víš<\/span>. Mở đầu: <span class=\"cz\">Dobrý den, chtěl/a bych…<\/span> hoặc <span class=\"cz\">Prosím vás, …<\/span>. Kết thúc: <span class=\"cz\">Děkuju, na shledanou.<\/span><\/p>\n<h4>Câu hỏi thứ tư: các mẫu dùng được nhiều nơi<\/h4>\n<p><span class=\"cz\">Můžu platit kartou?<\/span> · <span class=\"cz\">Musím se objednat předem?<\/span> · <span class=\"cz\">Je tam parkoviště?<\/span> · <span class=\"cz\">Máte slevu pro děti?<\/span> · <span class=\"cz\">Kde to najdu?<\/span> · <span class=\"cz\">Máte otevřeno i v sobotu?<\/span><\/p>","tips":"\n<ul>\n<li><b>Đừng đọc to gợi ý<\/b> («Cena?»): hãy biến nó thành câu hỏi.<\/li>\n<li><b>Nghe câu trả lời của giám khảo<\/b> và đừng hỏi lại cùng một điều.<\/li>\n<li>Câu hỏi thứ tư phải <b>hợp tình huống<\/b>: ở khách sạn hỏi về bữa sáng hay chỗ đỗ xe, không hỏi về thời tiết.<\/li>\n<li>Nếu không hiểu câu trả lời: <span class=\"cz\">Promiňte, můžete to zopakovat?<\/span><\/li>\n<li>Cuối cùng hãy cảm ơn: <span class=\"cz\">Děkuju za informace. Na shledanou.<\/span><\/li>\n<\/ul>"}},"u3":{"uk":{"how":"\n<p>Ви бачите <b>4 картинки<\/b> і питання, наприклад <span class=\"cz\">Co včera dělali muž a žena?<\/span> Ваше завдання — розповісти історію <b>в минулому часі<\/b>, використавши <b>всі 4 картинки<\/b>. На іспиті на це є <b>1 хвилина<\/b>, завдання дає <b>10 балів<\/b>.<\/p>\n<ul>\n<li>Оцінюють: чи є всі 4 картинки, чи правильний минулий час, чи розповідь зв'язна (слова «потім», «нарешті») і чи вистачає слів саме з цієї ситуації.<\/li>\n<li>Добра розповідь має 60–90 слів: по 2–3 речення на картинку.<\/li>\n<li>У новому форматі ситуації практичні: поліція, лікар, пошта, поломка, переїзд. Тому важливо знати конкретні слова.<\/li>\n<\/ul>","grammar":"\n<h4>Як утворити минулий час<\/h4>\n<p>Беремо інфінітив, відкидаємо <b>-t<\/b> і додаємо <b>-l<\/b>. Закінчення залежить від того, <b>хто<\/b> робив:<\/p>\n<div class=\"tblw\"><table class=\"tbl\">\n<tr><th>Хто<\/th><th>dělat<\/th><th>koupit<\/th><th>být<\/th><\/tr>\n<tr><td>він (muž, pan Novák)<\/td><td><span class=\"cz\">dělal<\/span><\/td><td><span class=\"cz\">koupil<\/span><\/td><td><span class=\"cz\">byl<\/span><\/td><\/tr>\n<tr><td>вона (žena, paní Nová)<\/td><td><span class=\"cz\">dělala<\/span><\/td><td><span class=\"cz\">koupila<\/span><\/td><td><span class=\"cz\">byla<\/span><\/td><\/tr>\n<tr><td>воно (dítě, auto)<\/td><td><span class=\"cz\">dělalo<\/span><\/td><td><span class=\"cz\">koupilo<\/span><\/td><td><span class=\"cz\">bylo<\/span><\/td><\/tr>\n<tr><td>вони (muž a žena, rodina → oni)<\/td><td><span class=\"cz\">dělali<\/span><\/td><td><span class=\"cz\">koupili<\/span><\/td><td><span class=\"cz\">byli<\/span><\/td><\/tr>\n<\/table><\/div>\n<p>У розповіді про <b>інших людей<\/b> слово <span class=\"cz\">jsem<\/span> не потрібне: <span class=\"cz\">Muž šel do obchodu.<\/span> Про <b>себе<\/b> додаємо <span class=\"cz\">jsem<\/span> або <span class=\"cz\">jsme<\/span>: <span class=\"cz\">Šel jsem do obchodu. Byli jsme v Praze.<\/span><\/p>\n<h4>Неправильні дієслова, які трапляються найчастіше<\/h4>\n<p><span class=\"cz\">jít → šel, šla<\/span> · <span class=\"cz\">jet → jel<\/span> · <span class=\"cz\">přijít → přišel<\/span> · <span class=\"cz\">najít → našel<\/span> · <span class=\"cz\">mít → měl<\/span> · <span class=\"cz\">chtít → chtěl<\/span> · <span class=\"cz\">moct → mohl<\/span> · <span class=\"cz\">říct → řekl<\/span> · <span class=\"cz\">vzít → vzal<\/span> · <span class=\"cz\">jíst → jedl<\/span> · <span class=\"cz\">pít → pil<\/span> · <span class=\"cz\">číst → četl<\/span> · <span class=\"cz\">začít → začal<\/span> · <span class=\"cz\">spát → spal<\/span> · <span class=\"cz\">zapomenout → zapomněl<\/span><\/p>\n<h4>Зворотні дієслова: se / si на другому місці<\/h4>\n<p><span class=\"cz\">Muž se probudil.<\/span> · <span class=\"cz\">Žena si koupila boty.<\/span> · <span class=\"cz\">Ráno se oblékl a umyl.<\/span><\/p>\n<h4>Каркас розповіді<\/h4>\n<div class=\"tblw\"><table class=\"tbl\">\n<tr><th>Частина<\/th><th>Слова-зв'язки<\/th><th>Приклад<\/th><\/tr>\n<tr><td>Початок: коли, хто, де<\/td><td><span class=\"cz\">Včera ráno…<\/span> · <span class=\"cz\">Minulou sobotu…<\/span><\/td><td><span class=\"cz\">Včera ráno jel pan Novák do práce.<\/span><\/td><\/tr>\n<tr><td>Картинка 1<\/td><td><span class=\"cz\">Nejdřív…<\/span> · <span class=\"cz\">Na začátku…<\/span><\/td><td><span class=\"cz\">Nejdřív si koupil kávu.<\/span><\/td><\/tr>\n<tr><td>Картинки 2–3<\/td><td><span class=\"cz\">Potom…<\/span> · <span class=\"cz\">Pak…<\/span> · <span class=\"cz\">Když…<\/span> · <span class=\"cz\">Najednou…<\/span><\/td><td><span class=\"cz\">Najednou začalo pršet.<\/span><\/td><\/tr>\n<tr><td>Картинка 4, кінець<\/td><td><span class=\"cz\">Nakonec…<\/span> · <span class=\"cz\">Večer…<\/span><\/td><td><span class=\"cz\">Nakonec šel domů a byl unavený.<\/span><\/td><\/tr>\n<\/table><\/div>\n<p>Додайте почуття: <span class=\"cz\">byl šťastný<\/span>, <span class=\"cz\">byla nervózní<\/span>, <span class=\"cz\">byli unavení<\/span>, і причину: <span class=\"cz\">protože…<\/span><\/p>","tips":"\n<ul>\n<li><b>Не описуйте картинку в теперішньому часі<\/b> («Na obrázku je muž…»). Розповідайте історію: <span class=\"cz\">Muž šel…<\/span><\/li>\n<li><b>Дайте людям імена<\/b>: <span class=\"cz\">pan Novák, paní Nová<\/span>. Так легше говорити й не плутатися.<\/li>\n<li><b>Не пропускайте жодної картинки<\/b>: за кожну пропущену втрачаються бали.<\/li>\n<li><b>Не знаєте слова?<\/b> Опишіть інакше: замість <span class=\"cz\">pokuta<\/span> — <span class=\"cz\">musel zaplatit peníze policii<\/span>.<\/li>\n<li><b>Слідкуйте за родом<\/b>: жінка — <span class=\"cz\">šla, byla, koupila<\/span>, чоловік — <span class=\"cz\">šel, byl, koupil<\/span>.<\/li>\n<li>Тренуйтеся з таймером на 1 хвилину: спочатку з текстом, потім лише з картинками.<\/li>\n<\/ul>"},"en":{"how":"\n<p>You see <b>4 pictures<\/b> and a question, for example <span class=\"cz\">Co včera dělali muž a žena?<\/span> Your task is to tell the story <b>in the past tense<\/b> using <b>all 4 pictures<\/b>. In the exam you have <b>1 minute<\/b>, and the task is worth <b>10 points<\/b>.<\/p>\n<ul>\n<li>They assess: all 4 pictures used, correct past tense, a connected story (“then”, “finally”) and vocabulary for this particular situation.<\/li>\n<li>A good story has 60–90 words: 2–3 sentences per picture.<\/li>\n<li>In the new format the situations are practical: police, doctor, post office, something broken, moving. So knowing specific words matters.<\/li>\n<\/ul>","grammar":"\n<h4>How to form the past tense<\/h4>\n<p>Take the infinitive, drop <b>-t<\/b> and add <b>-l<\/b>. The ending depends on <b>who<\/b> did it:<\/p>\n<div class=\"tblw\"><table class=\"tbl\">\n<tr><th>Who<\/th><th>dělat<\/th><th>koupit<\/th><th>být<\/th><\/tr>\n<tr><td>he (muž, pan Novák)<\/td><td><span class=\"cz\">dělal<\/span><\/td><td><span class=\"cz\">koupil<\/span><\/td><td><span class=\"cz\">byl<\/span><\/td><\/tr>\n<tr><td>she (žena, paní Nová)<\/td><td><span class=\"cz\">dělala<\/span><\/td><td><span class=\"cz\">koupila<\/span><\/td><td><span class=\"cz\">byla<\/span><\/td><\/tr>\n<tr><td>it (dítě, auto)<\/td><td><span class=\"cz\">dělalo<\/span><\/td><td><span class=\"cz\">koupilo<\/span><\/td><td><span class=\"cz\">bylo<\/span><\/td><\/tr>\n<tr><td>they (muž a žena, rodina → oni)<\/td><td><span class=\"cz\">dělali<\/span><\/td><td><span class=\"cz\">koupili<\/span><\/td><td><span class=\"cz\">byli<\/span><\/td><\/tr>\n<\/table><\/div>\n<p>When telling a story about <b>other people<\/b> you don't need <span class=\"cz\">jsem<\/span>: <span class=\"cz\">Muž šel do obchodu.<\/span> About <b>yourself<\/b> add <span class=\"cz\">jsem<\/span> or <span class=\"cz\">jsme<\/span>: <span class=\"cz\">Šel jsem do obchodu. Byli jsme v Praze.<\/span><\/p>\n<h4>The most common irregular verbs<\/h4>\n<p><span class=\"cz\">jít → šel, šla<\/span> · <span class=\"cz\">jet → jel<\/span> · <span class=\"cz\">přijít → přišel<\/span> · <span class=\"cz\">najít → našel<\/span> · <span class=\"cz\">mít → měl<\/span> · <span class=\"cz\">chtít → chtěl<\/span> · <span class=\"cz\">moct → mohl<\/span> · <span class=\"cz\">říct → řekl<\/span> · <span class=\"cz\">vzít → vzal<\/span> · <span class=\"cz\">jíst → jedl<\/span> · <span class=\"cz\">pít → pil<\/span> · <span class=\"cz\">číst → četl<\/span> · <span class=\"cz\">začít → začal<\/span> · <span class=\"cz\">spát → spal<\/span> · <span class=\"cz\">zapomenout → zapomněl<\/span><\/p>\n<h4>Reflexive verbs: se / si in second position<\/h4>\n<p><span class=\"cz\">Muž se probudil.<\/span> · <span class=\"cz\">Žena si koupila boty.<\/span> · <span class=\"cz\">Ráno se oblékl a umyl.<\/span><\/p>\n<h4>A story frame<\/h4>\n<div class=\"tblw\"><table class=\"tbl\">\n<tr><th>Part<\/th><th>Linking words<\/th><th>Example<\/th><\/tr>\n<tr><td>Start: when, who, where<\/td><td><span class=\"cz\">Včera ráno…<\/span> · <span class=\"cz\">Minulou sobotu…<\/span><\/td><td><span class=\"cz\">Včera ráno jel pan Novák do práce.<\/span><\/td><\/tr>\n<tr><td>Picture 1<\/td><td><span class=\"cz\">Nejdřív…<\/span> · <span class=\"cz\">Na začátku…<\/span><\/td><td><span class=\"cz\">Nejdřív si koupil kávu.<\/span><\/td><\/tr>\n<tr><td>Pictures 2–3<\/td><td><span class=\"cz\">Potom…<\/span> · <span class=\"cz\">Pak…<\/span> · <span class=\"cz\">Když…<\/span> · <span class=\"cz\">Najednou…<\/span><\/td><td><span class=\"cz\">Najednou začalo pršet.<\/span><\/td><\/tr>\n<tr><td>Picture 4, the end<\/td><td><span class=\"cz\">Nakonec…<\/span> · <span class=\"cz\">Večer…<\/span><\/td><td><span class=\"cz\">Nakonec šel domů a byl unavený.<\/span><\/td><\/tr>\n<\/table><\/div>\n<p>Add feelings: <span class=\"cz\">byl šťastný<\/span>, <span class=\"cz\">byla nervózní<\/span>, <span class=\"cz\">byli unavení<\/span>, and a reason: <span class=\"cz\">protože…<\/span><\/p>","tips":"\n<ul>\n<li><b>Don't describe the picture in the present<\/b> (“Na obrázku je muž…”). Tell a story: <span class=\"cz\">Muž šel…<\/span><\/li>\n<li><b>Give the people names<\/b>: <span class=\"cz\">pan Novák, paní Nová<\/span>. It makes speaking easier.<\/li>\n<li><b>Don't skip any picture<\/b>: every skipped picture costs points.<\/li>\n<li><b>Don't know a word?<\/b> Describe it: instead of <span class=\"cz\">pokuta<\/span> say <span class=\"cz\">musel zaplatit peníze policii<\/span>.<\/li>\n<li><b>Watch the gender<\/b>: a woman <span class=\"cz\">šla, byla, koupila<\/span>, a man <span class=\"cz\">šel, byl, koupil<\/span>.<\/li>\n<li>Practise with a 1-minute timer: first with the text, then with the pictures only.<\/li>\n<\/ul>"},"ru":{"how":"\n<p>Вы видите <b>4 картинки<\/b> и вопрос, например <span class=\"cz\">Co včera dělali muž a žena?<\/span> Задача — рассказать историю <b>в прошедшем времени<\/b>, используя <b>все 4 картинки<\/b>. На экзамене на это есть <b>1 минута<\/b>, задание даёт <b>10 баллов<\/b>.<\/p>\n<ul>\n<li>Оценивают: есть ли все 4 картинки, правильно ли прошедшее время, связный ли рассказ («потом», «наконец») и хватает ли слов именно из этой ситуации.<\/li>\n<li>Хороший рассказ — 60–90 слов: по 2–3 предложения на картинку.<\/li>\n<li>В новом формате ситуации практичные: полиция, врач, почта, поломка, переезд. Поэтому важно знать конкретные слова.<\/li>\n<\/ul>","grammar":"\n<h4>Как образовать прошедшее время<\/h4>\n<p>Берём инфинитив, отбрасываем <b>-t<\/b> и добавляем <b>-l<\/b>. Окончание зависит от того, <b>кто<\/b> делал:<\/p>\n<div class=\"tblw\"><table class=\"tbl\">\n<tr><th>Кто<\/th><th>dělat<\/th><th>koupit<\/th><th>být<\/th><\/tr>\n<tr><td>он (muž, pan Novák)<\/td><td><span class=\"cz\">dělal<\/span><\/td><td><span class=\"cz\">koupil<\/span><\/td><td><span class=\"cz\">byl<\/span><\/td><\/tr>\n<tr><td>она (žena, paní Nová)<\/td><td><span class=\"cz\">dělala<\/span><\/td><td><span class=\"cz\">koupila<\/span><\/td><td><span class=\"cz\">byla<\/span><\/td><\/tr>\n<tr><td>оно (dítě, auto)<\/td><td><span class=\"cz\">dělalo<\/span><\/td><td><span class=\"cz\">koupilo<\/span><\/td><td><span class=\"cz\">bylo<\/span><\/td><\/tr>\n<tr><td>они (muž a žena, rodina → oni)<\/td><td><span class=\"cz\">dělali<\/span><\/td><td><span class=\"cz\">koupili<\/span><\/td><td><span class=\"cz\">byli<\/span><\/td><\/tr>\n<\/table><\/div>\n<p>В рассказе о <b>других людях<\/b> слово <span class=\"cz\">jsem<\/span> не нужно: <span class=\"cz\">Muž šel do obchodu.<\/span> О <b>себе<\/b> добавляем <span class=\"cz\">jsem<\/span> или <span class=\"cz\">jsme<\/span>: <span class=\"cz\">Šel jsem do obchodu. Byli jsme v Praze.<\/span><\/p>\n<h4>Самые частые неправильные глаголы<\/h4>\n<p><span class=\"cz\">jít → šel, šla<\/span> · <span class=\"cz\">jet → jel<\/span> · <span class=\"cz\">přijít → přišel<\/span> · <span class=\"cz\">najít → našel<\/span> · <span class=\"cz\">mít → měl<\/span> · <span class=\"cz\">chtít → chtěl<\/span> · <span class=\"cz\">moct → mohl<\/span> · <span class=\"cz\">říct → řekl<\/span> · <span class=\"cz\">vzít → vzal<\/span> · <span class=\"cz\">jíst → jedl<\/span> · <span class=\"cz\">pít → pil<\/span> · <span class=\"cz\">číst → četl<\/span> · <span class=\"cz\">začít → začal<\/span> · <span class=\"cz\">spát → spal<\/span> · <span class=\"cz\">zapomenout → zapomněl<\/span><\/p>\n<h4>Возвратные глаголы: se / si на втором месте<\/h4>\n<p><span class=\"cz\">Muž se probudil.<\/span> · <span class=\"cz\">Žena si koupila boty.<\/span> · <span class=\"cz\">Ráno se oblékl a umyl.<\/span><\/p>\n<h4>Каркас рассказа<\/h4>\n<div class=\"tblw\"><table class=\"tbl\">\n<tr><th>Часть<\/th><th>Слова-связки<\/th><th>Пример<\/th><\/tr>\n<tr><td>Начало: когда, кто, где<\/td><td><span class=\"cz\">Včera ráno…<\/span> · <span class=\"cz\">Minulou sobotu…<\/span><\/td><td><span class=\"cz\">Včera ráno jel pan Novák do práce.<\/span><\/td><\/tr>\n<tr><td>Картинка 1<\/td><td><span class=\"cz\">Nejdřív…<\/span> · <span class=\"cz\">Na začátku…<\/span><\/td><td><span class=\"cz\">Nejdřív si koupil kávu.<\/span><\/td><\/tr>\n<tr><td>Картинки 2–3<\/td><td><span class=\"cz\">Potom…<\/span> · <span class=\"cz\">Pak…<\/span> · <span class=\"cz\">Když…<\/span> · <span class=\"cz\">Najednou…<\/span><\/td><td><span class=\"cz\">Najednou začalo pršet.<\/span><\/td><\/tr>\n<tr><td>Картинка 4, конец<\/td><td><span class=\"cz\">Nakonec…<\/span> · <span class=\"cz\">Večer…<\/span><\/td><td><span class=\"cz\">Nakonec šel domů a byl unavený.<\/span><\/td><\/tr>\n<\/table><\/div>\n<p>Добавьте чувства: <span class=\"cz\">byl šťastný<\/span>, <span class=\"cz\">byla nervózní<\/span>, <span class=\"cz\">byli unavení<\/span>, и причину: <span class=\"cz\">protože…<\/span><\/p>","tips":"\n<ul>\n<li><b>Не описывайте картинку в настоящем времени<\/b> («Na obrázku je muž…»). Рассказывайте историю: <span class=\"cz\">Muž šel…<\/span><\/li>\n<li><b>Дайте людям имена<\/b>: <span class=\"cz\">pan Novák, paní Nová<\/span>. Так проще говорить и не путаться.<\/li>\n<li><b>Не пропускайте ни одной картинки<\/b>: за каждую пропущенную теряются баллы.<\/li>\n<li><b>Не знаете слова?<\/b> Опишите иначе: вместо <span class=\"cz\">pokuta<\/span> — <span class=\"cz\">musel zaplatit peníze policii<\/span>.<\/li>\n<li><b>Следите за родом<\/b>: женщина — <span class=\"cz\">šla, byla, koupila<\/span>, мужчина — <span class=\"cz\">šel, byl, koupil<\/span>.<\/li>\n<li>Тренируйтесь с таймером на 1 минуту: сначала с текстом, потом только с картинками.<\/li>\n<\/ul>"},"vi":{"how":"\n<p>Bạn thấy <b>4 bức tranh<\/b> và một câu hỏi, ví dụ <span class=\"cz\">Co včera dělali muž a žena?<\/span> Nhiệm vụ là kể câu chuyện <b>ở thì quá khứ<\/b>, dùng <b>cả 4 bức tranh<\/b>. Khi thi bạn có <b>1 phút<\/b>, bài này được <b>10 điểm<\/b>.<\/p>\n<ul>\n<li>Giám khảo đánh giá: có đủ 4 tranh không, thì quá khứ có đúng không, câu chuyện có liền mạch không («sau đó», «cuối cùng») và có đủ từ vựng cho tình huống đó không.<\/li>\n<li>Một câu chuyện tốt có 60–90 từ: mỗi tranh 2–3 câu.<\/li>\n<li>Ở định dạng mới, tình huống rất thực tế: cảnh sát, bác sĩ, bưu điện, đồ bị hỏng, chuyển nhà. Vì vậy cần biết từ cụ thể.<\/li>\n<\/ul>","grammar":"\n<h4>Cách tạo thì quá khứ<\/h4>\n<p>Lấy động từ nguyên thể, bỏ <b>-t<\/b> và thêm <b>-l<\/b>. Đuôi phụ thuộc vào <b>ai<\/b> làm:<\/p>\n<div class=\"tblw\"><table class=\"tbl\">\n<tr><th>Ai<\/th><th>dělat<\/th><th>koupit<\/th><th>být<\/th><\/tr>\n<tr><td>anh ấy (muž, pan Novák)<\/td><td><span class=\"cz\">dělal<\/span><\/td><td><span class=\"cz\">koupil<\/span><\/td><td><span class=\"cz\">byl<\/span><\/td><\/tr>\n<tr><td>cô ấy (žena, paní Nová)<\/td><td><span class=\"cz\">dělala<\/span><\/td><td><span class=\"cz\">koupila<\/span><\/td><td><span class=\"cz\">byla<\/span><\/td><\/tr>\n<tr><td>nó (dítě, auto)<\/td><td><span class=\"cz\">dělalo<\/span><\/td><td><span class=\"cz\">koupilo<\/span><\/td><td><span class=\"cz\">bylo<\/span><\/td><\/tr>\n<tr><td>họ (muž a žena, rodina → oni)<\/td><td><span class=\"cz\">dělali<\/span><\/td><td><span class=\"cz\">koupili<\/span><\/td><td><span class=\"cz\">byli<\/span><\/td><\/tr>\n<\/table><\/div>\n<p>Khi kể về <b>người khác<\/b> không cần <span class=\"cz\">jsem<\/span>: <span class=\"cz\">Muž šel do obchodu.<\/span> Khi kể về <b>bản thân<\/b> thêm <span class=\"cz\">jsem<\/span> hoặc <span class=\"cz\">jsme<\/span>: <span class=\"cz\">Šel jsem do obchodu. Byli jsme v Praze.<\/span><\/p>\n<h4>Các động từ bất quy tắc hay gặp nhất<\/h4>\n<p><span class=\"cz\">jít → šel, šla<\/span> · <span class=\"cz\">jet → jel<\/span> · <span class=\"cz\">přijít → přišel<\/span> · <span class=\"cz\">najít → našel<\/span> · <span class=\"cz\">mít → měl<\/span> · <span class=\"cz\">chtít → chtěl<\/span> · <span class=\"cz\">moct → mohl<\/span> · <span class=\"cz\">říct → řekl<\/span> · <span class=\"cz\">vzít → vzal<\/span> · <span class=\"cz\">jíst → jedl<\/span> · <span class=\"cz\">pít → pil<\/span> · <span class=\"cz\">číst → četl<\/span> · <span class=\"cz\">začít → začal<\/span> · <span class=\"cz\">spát → spal<\/span> · <span class=\"cz\">zapomenout → zapomněl<\/span><\/p>\n<h4>Động từ phản thân: se / si ở vị trí thứ hai<\/h4>\n<p><span class=\"cz\">Muž se probudil.<\/span> · <span class=\"cz\">Žena si koupila boty.<\/span> · <span class=\"cz\">Ráno se oblékl a umyl.<\/span><\/p>\n<h4>Khung câu chuyện<\/h4>\n<div class=\"tblw\"><table class=\"tbl\">\n<tr><th>Phần<\/th><th>Từ nối<\/th><th>Ví dụ<\/th><\/tr>\n<tr><td>Mở đầu: khi nào, ai, ở đâu<\/td><td><span class=\"cz\">Včera ráno…<\/span> · <span class=\"cz\">Minulou sobotu…<\/span><\/td><td><span class=\"cz\">Včera ráno jel pan Novák do práce.<\/span><\/td><\/tr>\n<tr><td>Tranh 1<\/td><td><span class=\"cz\">Nejdřív…<\/span> · <span class=\"cz\">Na začátku…<\/span><\/td><td><span class=\"cz\">Nejdřív si koupil kávu.<\/span><\/td><\/tr>\n<tr><td>Tranh 2–3<\/td><td><span class=\"cz\">Potom…<\/span> · <span class=\"cz\">Pak…<\/span> · <span class=\"cz\">Když…<\/span> · <span class=\"cz\">Najednou…<\/span><\/td><td><span class=\"cz\">Najednou začalo pršet.<\/span><\/td><\/tr>\n<tr><td>Tranh 4, kết thúc<\/td><td><span class=\"cz\">Nakonec…<\/span> · <span class=\"cz\">Večer…<\/span><\/td><td><span class=\"cz\">Nakonec šel domů a byl unavený.<\/span><\/td><\/tr>\n<\/table><\/div>\n<p>Thêm cảm xúc: <span class=\"cz\">byl šťastný<\/span>, <span class=\"cz\">byla nervózní<\/span>, <span class=\"cz\">byli unavení<\/span>, và lý do: <span class=\"cz\">protože…<\/span><\/p>","tips":"\n<ul>\n<li><b>Đừng tả tranh ở thì hiện tại<\/b> («Na obrázku je muž…»). Hãy kể chuyện: <span class=\"cz\">Muž šel…<\/span><\/li>\n<li><b>Đặt tên cho nhân vật<\/b>: <span class=\"cz\">pan Novák, paní Nová<\/span>. Nói sẽ dễ hơn.<\/li>\n<li><b>Đừng bỏ tranh nào<\/b>: mỗi tranh bỏ qua đều bị mất điểm.<\/li>\n<li><b>Không biết từ?<\/b> Hãy diễn đạt khác: thay vì <span class=\"cz\">pokuta<\/span> nói <span class=\"cz\">musel zaplatit peníze policii<\/span>.<\/li>\n<li><b>Chú ý giống<\/b>: phụ nữ <span class=\"cz\">šla, byla, koupila<\/span>, đàn ông <span class=\"cz\">šel, byl, koupil<\/span>.<\/li>\n<li>Luyện với đồng hồ 1 phút: lúc đầu nhìn chữ, sau đó chỉ nhìn tranh.<\/li>\n<\/ul>"}},"u4":{"uk":{"how":"\n<p>Екзаменатор грає роль вашого <b>друга<\/b>, тому ви говорите на <b>«ти»<\/b>. Він описує ситуацію, наприклад <span class=\"cz\">Chceme spolu jet na výlet. Čím pojedeme?<\/span>, і показує картинку з <b>3 варіантами<\/b>. Ви маєте <b>домовитися про один<\/b> і пояснити чому. <b>7 балів.<\/b><\/p>\n<ul>\n<li>Екзаменатор зазвичай <b>відмовляє<\/b> перші пропозиції, тож ви пропонуєте далі.<\/li>\n<li>Вибирати можна <b>лише з того, що на картинці<\/b>.<\/li>\n<li>Оцінюють: пропозиції, реакцію на відмову, пояснення <span class=\"cz\">protože…<\/span> і підсумок, про що домовилися.<\/li>\n<\/ul>","grammar":"\n<h4>Запропонувати<\/h4>\n<p><span class=\"cz\">Můžeme jít do kina.<\/span> · <span class=\"cz\">Pojďme do kina.<\/span> · <span class=\"cz\">Co kdybychom šli do kina?<\/span> · <span class=\"cz\">Co třeba kino?<\/span> · <span class=\"cz\">Chceš jít do kina?<\/span><\/p>\n<h4>Відреагувати на відмову<\/h4>\n<p><span class=\"cz\">Dobře, tak…<\/span> · <span class=\"cz\">Aha, to nevadí. Tak co…?<\/span> · <span class=\"cz\">Škoda. A co třeba…?<\/span><\/p>\n<h4>Пояснити вибір<\/h4>\n<p><span class=\"cz\">Protože je to levné / blízko / zdravé.<\/span> · <span class=\"cz\">Protože tam ještě nebyli.<\/span> · <span class=\"cz\">Myslím, že je to nejlepší, protože…<\/span><\/p>\n<h4>Погодитися й підсумувати<\/h4>\n<p><span class=\"cz\">Dobře, domluveno.<\/span> · <span class=\"cz\">Platí.<\/span> · <span class=\"cz\">Super, tak v sobotu v deset.<\/span> · <span class=\"cz\">Souhlasím.<\/span><\/p>\n<h4>«Ти»-форми, потрібні тут<\/h4>\n<p><span class=\"cz\">máš<\/span> (у тебе є) · <span class=\"cz\">chceš<\/span> (хочеш) · <span class=\"cz\">můžeš<\/span> (можеш) · <span class=\"cz\">půjdeš<\/span> (підеш) · <span class=\"cz\">pojďme<\/span> (ходімо) · <span class=\"cz\">myslíš<\/span> (думаєш). Не <span class=\"cz\">máte, chcete<\/span>: це «Ви».<\/p>","tips":"\n<ul>\n<li><b>Не сперечайтеся<\/b> з відмовою, просто пропонуйте інший варіант.<\/li>\n<li><b>Обов'язково скажіть «protože…»<\/b>, навіть якщо екзаменатор не питає.<\/li>\n<li>Закінчіть домовленістю: що, коли, де. <span class=\"cz\">Dobře, tak pojedeme vlakem v sobotu ráno.<\/span><\/li>\n<li>Не знаєте назви на картинці? Покажіть словами: <span class=\"cz\">to první<\/span>, <span class=\"cz\">to vpravo<\/span>.<\/li>\n<li>Говоріть природно, коротко й привітно, як із другом.<\/li>\n<\/ul>"},"en":{"how":"\n<p>The examiner plays your <b>friend<\/b>, so you use the informal <b>“ty”<\/b>. They describe a situation, for example <span class=\"cz\">Chceme spolu jet na výlet. Čím pojedeme?<\/span>, and show a picture with <b>3 options<\/b>. You must <b>agree on one<\/b> and explain why. <b>7 points.<\/b><\/p>\n<ul>\n<li>The examiner usually <b>turns down<\/b> your first suggestions, so keep suggesting.<\/li>\n<li>You may choose <b>only from what is in the picture<\/b>.<\/li>\n<li>They assess: suggestions, reacting to a refusal, the reason <span class=\"cz\">protože…<\/span> and a summary of what you agreed.<\/li>\n<\/ul>","grammar":"\n<h4>Suggesting<\/h4>\n<p><span class=\"cz\">Můžeme jít do kina.<\/span> · <span class=\"cz\">Pojďme do kina.<\/span> · <span class=\"cz\">Co kdybychom šli do kina?<\/span> · <span class=\"cz\">Co třeba kino?<\/span> · <span class=\"cz\">Chceš jít do kina?<\/span><\/p>\n<h4>Reacting to a refusal<\/h4>\n<p><span class=\"cz\">Dobře, tak…<\/span> · <span class=\"cz\">Aha, to nevadí. Tak co…?<\/span> · <span class=\"cz\">Škoda. A co třeba…?<\/span><\/p>\n<h4>Explaining your choice<\/h4>\n<p><span class=\"cz\">Protože je to levné / blízko / zdravé.<\/span> · <span class=\"cz\">Protože tam ještě nebyli.<\/span> · <span class=\"cz\">Myslím, že je to nejlepší, protože…<\/span><\/p>\n<h4>Agreeing and summing up<\/h4>\n<p><span class=\"cz\">Dobře, domluveno.<\/span> · <span class=\"cz\">Platí.<\/span> · <span class=\"cz\">Super, tak v sobotu v deset.<\/span> · <span class=\"cz\">Souhlasím.<\/span><\/p>\n<h4>The “ty” forms you need here<\/h4>\n<p><span class=\"cz\">máš<\/span> (you have) · <span class=\"cz\">chceš<\/span> (you want) · <span class=\"cz\">můžeš<\/span> (you can) · <span class=\"cz\">půjdeš<\/span> (you will go) · <span class=\"cz\">pojďme<\/span> (let's go) · <span class=\"cz\">myslíš<\/span> (you think). Not <span class=\"cz\">máte, chcete<\/span>: that is the formal “Vy”.<\/p>","tips":"\n<ul>\n<li><b>Don't argue<\/b> with a refusal, just suggest another option.<\/li>\n<li><b>Always say “protože…”<\/b>, even if the examiner doesn't ask.<\/li>\n<li>Finish with an agreement: what, when, where. <span class=\"cz\">Dobře, tak pojedeme vlakem v sobotu ráno.<\/span><\/li>\n<li>Don't know the name of something in the picture? Point to it with words: <span class=\"cz\">to první<\/span>, <span class=\"cz\">to vpravo<\/span>.<\/li>\n<li>Speak naturally, briefly and kindly, as with a friend.<\/li>\n<\/ul>"},"ru":{"how":"\n<p>Экзаменатор играет роль вашего <b>друга<\/b>, поэтому вы говорите на <b>«ты»<\/b>. Он описывает ситуацию, например <span class=\"cz\">Chceme spolu jet na výlet. Čím pojedeme?<\/span>, и показывает картинку с <b>3 вариантами<\/b>. Нужно <b>договориться об одном<\/b> и объяснить почему. <b>7 баллов.<\/b><\/p>\n<ul>\n<li>Экзаменатор обычно <b>отказывается<\/b> от первых предложений, так что предлагайте дальше.<\/li>\n<li>Выбирать можно <b>только из того, что на картинке<\/b>.<\/li>\n<li>Оценивают: предложения, реакцию на отказ, объяснение <span class=\"cz\">protože…<\/span> и итог, о чём договорились.<\/li>\n<\/ul>","grammar":"\n<h4>Предложить<\/h4>\n<p><span class=\"cz\">Můžeme jít do kina.<\/span> · <span class=\"cz\">Pojďme do kina.<\/span> · <span class=\"cz\">Co kdybychom šli do kina?<\/span> · <span class=\"cz\">Co třeba kino?<\/span> · <span class=\"cz\">Chceš jít do kina?<\/span><\/p>\n<h4>Отреагировать на отказ<\/h4>\n<p><span class=\"cz\">Dobře, tak…<\/span> · <span class=\"cz\">Aha, to nevadí. Tak co…?<\/span> · <span class=\"cz\">Škoda. A co třeba…?<\/span><\/p>\n<h4>Объяснить выбор<\/h4>\n<p><span class=\"cz\">Protože je to levné / blízko / zdravé.<\/span> · <span class=\"cz\">Protože tam ještě nebyli.<\/span> · <span class=\"cz\">Myslím, že je to nejlepší, protože…<\/span><\/p>\n<h4>Согласиться и подвести итог<\/h4>\n<p><span class=\"cz\">Dobře, domluveno.<\/span> · <span class=\"cz\">Platí.<\/span> · <span class=\"cz\">Super, tak v sobotu v deset.<\/span> · <span class=\"cz\">Souhlasím.<\/span><\/p>\n<h4>Формы на «ты», которые нужны здесь<\/h4>\n<p><span class=\"cz\">máš<\/span> (у тебя есть) · <span class=\"cz\">chceš<\/span> (хочешь) · <span class=\"cz\">můžeš<\/span> (можешь) · <span class=\"cz\">půjdeš<\/span> (пойдёшь) · <span class=\"cz\">pojďme<\/span> (пойдём) · <span class=\"cz\">myslíš<\/span> (думаешь). Не <span class=\"cz\">máte, chcete<\/span>: это «Вы».<\/p>","tips":"\n<ul>\n<li><b>Не спорьте<\/b> с отказом, просто предлагайте другой вариант.<\/li>\n<li><b>Обязательно скажите «protože…»<\/b>, даже если экзаменатор не спрашивает.<\/li>\n<li>Закончите договорённостью: что, когда, где. <span class=\"cz\">Dobře, tak pojedeme vlakem v sobotu ráno.<\/span><\/li>\n<li>Не знаете названия на картинке? Покажите словами: <span class=\"cz\">to první<\/span>, <span class=\"cz\">to vpravo<\/span>.<\/li>\n<li>Говорите естественно, коротко и дружелюбно, как с другом.<\/li>\n<\/ul>"},"vi":{"how":"\n<p>Giám khảo đóng vai <b>bạn<\/b> của bạn, nên bạn dùng xưng hô thân mật <b>«ty»<\/b>. Giám khảo mô tả tình huống, ví dụ <span class=\"cz\">Chceme spolu jet na výlet. Čím pojedeme?<\/span>, và cho xem tranh có <b>3 lựa chọn<\/b>. Bạn phải <b>thống nhất một lựa chọn<\/b> và giải thích lý do. <b>7 điểm.<\/b><\/p>\n<ul>\n<li>Giám khảo thường <b>từ chối<\/b> những đề xuất đầu tiên, nên bạn tiếp tục đề xuất.<\/li>\n<li>Chỉ được chọn <b>những gì có trong tranh<\/b>.<\/li>\n<li>Giám khảo đánh giá: đề xuất, cách phản ứng khi bị từ chối, lý do <span class=\"cz\">protože…<\/span> và câu chốt điều đã thống nhất.<\/li>\n<\/ul>","grammar":"\n<h4>Đề xuất<\/h4>\n<p><span class=\"cz\">Můžeme jít do kina.<\/span> · <span class=\"cz\">Pojďme do kina.<\/span> · <span class=\"cz\">Co kdybychom šli do kina?<\/span> · <span class=\"cz\">Co třeba kino?<\/span> · <span class=\"cz\">Chceš jít do kina?<\/span><\/p>\n<h4>Phản ứng khi bị từ chối<\/h4>\n<p><span class=\"cz\">Dobře, tak…<\/span> · <span class=\"cz\">Aha, to nevadí. Tak co…?<\/span> · <span class=\"cz\">Škoda. A co třeba…?<\/span><\/p>\n<h4>Giải thích lựa chọn<\/h4>\n<p><span class=\"cz\">Protože je to levné / blízko / zdravé.<\/span> · <span class=\"cz\">Protože tam ještě nebyli.<\/span> · <span class=\"cz\">Myslím, že je to nejlepší, protože…<\/span><\/p>\n<h4>Đồng ý và chốt lại<\/h4>\n<p><span class=\"cz\">Dobře, domluveno.<\/span> · <span class=\"cz\">Platí.<\/span> · <span class=\"cz\">Super, tak v sobotu v deset.<\/span> · <span class=\"cz\">Souhlasím.<\/span><\/p>\n<h4>Các dạng «ty» cần dùng ở đây<\/h4>\n<p><span class=\"cz\">máš<\/span> (bạn có) · <span class=\"cz\">chceš<\/span> (bạn muốn) · <span class=\"cz\">můžeš<\/span> (bạn có thể) · <span class=\"cz\">půjdeš<\/span> (bạn sẽ đi) · <span class=\"cz\">pojďme<\/span> (chúng ta đi nào) · <span class=\"cz\">myslíš<\/span> (bạn nghĩ). Không dùng <span class=\"cz\">máte, chcete<\/span>: đó là «Vy».<\/p>","tips":"\n<ul>\n<li><b>Đừng tranh cãi<\/b> khi bị từ chối, chỉ cần đề xuất lựa chọn khác.<\/li>\n<li><b>Luôn nói «protože…»<\/b>, kể cả khi giám khảo không hỏi.<\/li>\n<li>Kết thúc bằng thỏa thuận: cái gì, khi nào, ở đâu. <span class=\"cz\">Dobře, tak pojedeme vlakem v sobotu ráno.<\/span><\/li>\n<li>Không biết tên vật trong tranh? Chỉ bằng lời: <span class=\"cz\">to první<\/span>, <span class=\"cz\">to vpravo<\/span>.<\/li>\n<li>Nói tự nhiên, ngắn gọn và thân thiện như với bạn bè.<\/li>\n<\/ul>"}},"w1":{"uk":{"how":"\n<p>Ви заповнюєте короткий <b>формуляр<\/b> (анкету, заявку) і відповідаєте на <b>3 питання<\/b>. На кожне — <b>цілим реченням, мінімум 10 слів<\/b>. Завдання дає <b>8 балів<\/b>, на весь Psaní є 25 хвилин.<\/p>\n<ul>\n<li>З квітня 2026 це не «ім'я, адреса, дата», а справжні питання: <span class=\"cz\">Proč se hlásíte do kurzu? Kde nejčastěji mluvíte česky?<\/span><\/li>\n<li>Оцінюють: чи ви відповіли саме на питання, чи є 10 слів, чи речення зрозуміле і граматично правильне.<\/li>\n<li>Відповідь менше 10 слів втрачає бали, навіть якщо вона правильна.<\/li>\n<\/ul>","grammar":"\n<h4>Формула: питання → відповідь<\/h4>\n<p class=\"formula\">Дієслово з питання <span>+<\/span> відповідь <span>+<\/span> деталь або <span class=\"cz\">protože…<\/span><\/p>\n<div class=\"tblw\"><table class=\"tbl\">\n<tr><th>Питання<\/th><th>Початок відповіді<\/th><\/tr>\n<tr><td><span class=\"cz\">Proč chcete…?<\/span><\/td><td><span class=\"cz\">Chci…, protože…<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Kdy máte čas?<\/span><\/td><td><span class=\"cz\">Čas mám v pondělí a ve středu od…<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Jak jste se učil/a česky?<\/span><\/td><td><span class=\"cz\">Česky jsem se učil/a v kurzu a…<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Kde nejčastěji…?<\/span><\/td><td><span class=\"cz\">Nejčastěji… v práci a v obchodě.<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">S kým…?<\/span><\/td><td><span class=\"cz\">…s manželem a se synem.<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Co byste chtěl/a…?<\/span><\/td><td><span class=\"cz\">Chtěl/a bych…<\/span><\/td><\/tr>\n<\/table><\/div>\n<h4>Як «дотягнути» до 10 слів<\/h4>\n<p>Коротко: <span class=\"cz\">Mám čas večer.<\/span> (3 слова) → Добре: <span class=\"cz\">Na cvičení mám čas hlavně večer po práci, od šesti hodin.<\/span> (10 слів)<\/p>\n<p>Додайте <b>коли<\/b> (<span class=\"cz\">v pondělí, ráno, od šesti<\/span>), <b>де<\/b> (<span class=\"cz\">v práci, doma, v parku<\/span>), <b>з ким<\/b> (<span class=\"cz\">s rodinou<\/span>) або <b>чому<\/b> (<span class=\"cz\">protože…<\/span>).<\/p>\n<h4>Корисні з'єднання<\/h4>\n<p><span class=\"cz\">a<\/span> · <span class=\"cz\">ale<\/span> · <span class=\"cz\">protože<\/span> · <span class=\"cz\">také<\/span> · <span class=\"cz\">hlavně<\/span> · <span class=\"cz\">nejčastěji<\/span> · <span class=\"cz\">většinou<\/span> · <span class=\"cz\">někdy<\/span><\/p>","tips":"\n<ul>\n<li><b>Рахуйте слова<\/b> одразу після кожної відповіді. Краще 12–15 слів, ніж рівно 10.<\/li>\n<li><b>Не повторюйте питання дослівно<\/b> замість відповіді: беріть з нього лише дієслово.<\/li>\n<li><b>Пишіть прості речення<\/b>, які точно знаєте. Довге речення з помилками гірше.<\/li>\n<li><b>Перевірте háčky й čárky<\/b> і велику літеру на початку речення.<\/li>\n<li>Відповідь не мусить бути правдою, головне — правильна й зрозуміла.<\/li>\n<\/ul>"},"en":{"how":"\n<p>You fill in a short <b>form<\/b> (questionnaire, application) and answer <b>3 questions<\/b>. Each answer must be a <b>full sentence of at least 10 words<\/b>. The task is worth <b>8 points<\/b>; the whole Psaní part has 25 minutes.<\/p>\n<ul>\n<li>Since April 2026 it is not “name, address, date” but real questions: <span class=\"cz\">Proč se hlásíte do kurzu? Kde nejčastěji mluvíte česky?<\/span><\/li>\n<li>They assess whether you answered the actual question, whether there are 10 words and whether the sentence is clear and correct.<\/li>\n<li>An answer with fewer than 10 words loses points even if it is correct.<\/li>\n<\/ul>","grammar":"\n<h4>The formula: question → answer<\/h4>\n<p class=\"formula\">The verb from the question <span>+<\/span> the answer <span>+<\/span> a detail or <span class=\"cz\">protože…<\/span><\/p>\n<div class=\"tblw\"><table class=\"tbl\">\n<tr><th>Question<\/th><th>The answer starts<\/th><\/tr>\n<tr><td><span class=\"cz\">Proč chcete…?<\/span><\/td><td><span class=\"cz\">Chci…, protože…<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Kdy máte čas?<\/span><\/td><td><span class=\"cz\">Čas mám v pondělí a ve středu od…<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Jak jste se učil/a česky?<\/span><\/td><td><span class=\"cz\">Česky jsem se učil/a v kurzu a…<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Kde nejčastěji…?<\/span><\/td><td><span class=\"cz\">Nejčastěji… v práci a v obchodě.<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">S kým…?<\/span><\/td><td><span class=\"cz\">…s manželem a se synem.<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Co byste chtěl/a…?<\/span><\/td><td><span class=\"cz\">Chtěl/a bych…<\/span><\/td><\/tr>\n<\/table><\/div>\n<h4>How to reach 10 words<\/h4>\n<p>Short: <span class=\"cz\">Mám čas večer.<\/span> (3 words) → Good: <span class=\"cz\">Na cvičení mám čas hlavně večer po práci, od šesti hodin.<\/span> (10 words)<\/p>\n<p>Add <b>when<\/b> (<span class=\"cz\">v pondělí, ráno, od šesti<\/span>), <b>where<\/b> (<span class=\"cz\">v práci, doma, v parku<\/span>), <b>with whom<\/b> (<span class=\"cz\">s rodinou<\/span>) or <b>why<\/b> (<span class=\"cz\">protože…<\/span>).<\/p>\n<h4>Useful linking words<\/h4>\n<p><span class=\"cz\">a<\/span> · <span class=\"cz\">ale<\/span> · <span class=\"cz\">protože<\/span> · <span class=\"cz\">také<\/span> · <span class=\"cz\">hlavně<\/span> · <span class=\"cz\">nejčastěji<\/span> · <span class=\"cz\">většinou<\/span> · <span class=\"cz\">někdy<\/span><\/p>","tips":"\n<ul>\n<li><b>Count the words<\/b> right after each answer. 12–15 words is safer than exactly 10.<\/li>\n<li><b>Don't copy the question<\/b> instead of answering: take only its verb.<\/li>\n<li><b>Write simple sentences<\/b> you are sure of. A long sentence with mistakes is worse.<\/li>\n<li><b>Check háčky and čárky<\/b> and the capital letter at the start.<\/li>\n<li>Your answer doesn't have to be true; it has to be correct and clear.<\/li>\n<\/ul>"},"ru":{"how":"\n<p>Вы заполняете короткий <b>формуляр<\/b> (анкету, заявку) и отвечаете на <b>3 вопроса<\/b>. На каждый — <b>полным предложением, минимум 10 слов<\/b>. Задание даёт <b>8 баллов<\/b>, на весь Psaní есть 25 минут.<\/p>\n<ul>\n<li>С апреля 2026 это не «имя, адрес, дата», а настоящие вопросы: <span class=\"cz\">Proč se hlásíte do kurzu? Kde nejčastěji mluvíte česky?<\/span><\/li>\n<li>Оценивают: ответили ли вы именно на вопрос, есть ли 10 слов, понятно ли и грамматически правильно ли предложение.<\/li>\n<li>Ответ меньше 10 слов теряет баллы, даже если он правильный.<\/li>\n<\/ul>","grammar":"\n<h4>Формула: вопрос → ответ<\/h4>\n<p class=\"formula\">Глагол из вопроса <span>+<\/span> ответ <span>+<\/span> деталь или <span class=\"cz\">protože…<\/span><\/p>\n<div class=\"tblw\"><table class=\"tbl\">\n<tr><th>Вопрос<\/th><th>Начало ответа<\/th><\/tr>\n<tr><td><span class=\"cz\">Proč chcete…?<\/span><\/td><td><span class=\"cz\">Chci…, protože…<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Kdy máte čas?<\/span><\/td><td><span class=\"cz\">Čas mám v pondělí a ve středu od…<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Jak jste se učil/a česky?<\/span><\/td><td><span class=\"cz\">Česky jsem se učil/a v kurzu a…<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Kde nejčastěji…?<\/span><\/td><td><span class=\"cz\">Nejčastěji… v práci a v obchodě.<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">S kým…?<\/span><\/td><td><span class=\"cz\">…s manželem a se synem.<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Co byste chtěl/a…?<\/span><\/td><td><span class=\"cz\">Chtěl/a bych…<\/span><\/td><\/tr>\n<\/table><\/div>\n<h4>Как «дотянуть» до 10 слов<\/h4>\n<p>Коротко: <span class=\"cz\">Mám čas večer.<\/span> (3 слова) → Хорошо: <span class=\"cz\">Na cvičení mám čas hlavně večer po práci, od šesti hodin.<\/span> (10 слов)<\/p>\n<p>Добавьте <b>когда<\/b> (<span class=\"cz\">v pondělí, ráno, od šesti<\/span>), <b>где<\/b> (<span class=\"cz\">v práci, doma, v parku<\/span>), <b>с кем<\/b> (<span class=\"cz\">s rodinou<\/span>) или <b>почему<\/b> (<span class=\"cz\">protože…<\/span>).<\/p>\n<h4>Полезные связки<\/h4>\n<p><span class=\"cz\">a<\/span> · <span class=\"cz\">ale<\/span> · <span class=\"cz\">protože<\/span> · <span class=\"cz\">také<\/span> · <span class=\"cz\">hlavně<\/span> · <span class=\"cz\">nejčastěji<\/span> · <span class=\"cz\">většinou<\/span> · <span class=\"cz\">někdy<\/span><\/p>","tips":"\n<ul>\n<li><b>Считайте слова<\/b> сразу после каждого ответа. Лучше 12–15 слов, чем ровно 10.<\/li>\n<li><b>Не повторяйте вопрос дословно<\/b> вместо ответа: берите из него только глагол.<\/li>\n<li><b>Пишите простые предложения<\/b>, в которых уверены. Длинное предложение с ошибками хуже.<\/li>\n<li><b>Проверьте háčky и čárky<\/b> и заглавную букву в начале предложения.<\/li>\n<li>Ответ не обязан быть правдой, главное — правильный и понятный.<\/li>\n<\/ul>"},"vi":{"how":"\n<p>Bạn điền một <b>mẫu đơn<\/b> ngắn (phiếu hỏi, đơn đăng ký) và trả lời <b>3 câu hỏi<\/b>. Mỗi câu trả lời phải là <b>câu đầy đủ, ít nhất 10 từ<\/b>. Bài này được <b>8 điểm<\/b>; cả phần Psaní có 25 phút.<\/p>\n<ul>\n<li>Từ tháng 4/2026 không còn là «tên, địa chỉ, ngày» mà là câu hỏi thật: <span class=\"cz\">Proč se hlásíte do kurzu? Kde nejčastěji mluvíte česky?<\/span><\/li>\n<li>Giám khảo đánh giá: bạn có trả lời đúng câu hỏi không, có đủ 10 từ không, câu có rõ ràng và đúng ngữ pháp không.<\/li>\n<li>Câu trả lời dưới 10 từ bị mất điểm dù nội dung đúng.<\/li>\n<\/ul>","grammar":"\n<h4>Công thức: câu hỏi → câu trả lời<\/h4>\n<p class=\"formula\">Động từ trong câu hỏi <span>+<\/span> câu trả lời <span>+<\/span> chi tiết hoặc <span class=\"cz\">protože…<\/span><\/p>\n<div class=\"tblw\"><table class=\"tbl\">\n<tr><th>Câu hỏi<\/th><th>Câu trả lời bắt đầu<\/th><\/tr>\n<tr><td><span class=\"cz\">Proč chcete…?<\/span><\/td><td><span class=\"cz\">Chci…, protože…<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Kdy máte čas?<\/span><\/td><td><span class=\"cz\">Čas mám v pondělí a ve středu od…<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Jak jste se učil/a česky?<\/span><\/td><td><span class=\"cz\">Česky jsem se učil/a v kurzu a…<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Kde nejčastěji…?<\/span><\/td><td><span class=\"cz\">Nejčastěji… v práci a v obchodě.<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">S kým…?<\/span><\/td><td><span class=\"cz\">…s manželem a se synem.<\/span><\/td><\/tr>\n<tr><td><span class=\"cz\">Co byste chtěl/a…?<\/span><\/td><td><span class=\"cz\">Chtěl/a bych…<\/span><\/td><\/tr>\n<\/table><\/div>\n<h4>Cách viết đủ 10 từ<\/h4>\n<p>Ngắn: <span class=\"cz\">Mám čas večer.<\/span> (3 từ) → Tốt: <span class=\"cz\">Na cvičení mám čas hla
