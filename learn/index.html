ачать с глагола из вопроса (см. образец).","Hãy thử bắt đầu bằng động từ trong câu hỏi (xem mẫu)."],"slow":["🐢 Повільніше","🐢 Slower","🐢 Медленнее","🐢 Chậm hơn"],"play":["▶","▶","▶","▶"],"practice":["Тренування: випадкові питання","Practice: random questions","Тренировка: случайные вопросы","Luyện tập: câu hỏi ngẫu nhiên"],"practiceD":["Як на іспиті: 2 теми по 4 питання. Сайт читає питання, ви відповідаєте вголос, потім дивитеся зразок.","Like the exam: 2 topics, 4 questions each. The site reads the question, you answer out loud, then check the sample.","Как на экзамене: 2 темы по 4 вопроса. Сайт читает вопрос, вы отвечаете вслух, потом смотрите образец.","Giống khi thi: 2 chủ đề, mỗi chủ đề 4 câu. Trang đọc câu hỏi, bạn trả lời thành tiếng rồi xem mẫu."],"start":["Почати тренування","Start practice","Начать тренировку","Bắt đầu luyện tập"],"next":["Наступне питання →","Next question →","Следующий вопрос →","Câu tiếp theo →"],"again":["Ще раз","Again","Ещё раз","Lần nữa"],"qOf":["Питання","Question","Вопрос","Câu"],"topic":["Тема","Topic","Тема","Chủ đề"],"done":["Готово! Спробуйте ще раз з іншими темами.","Done! Try again with other topics.","Готово! Попробуйте ещё раз с другими темами.","Xong! Hãy thử lại với chủ đề khác."],"toList":["← Усі теми","← All topics","← Все темы","← Tất cả chủ đề"],"toLesson":["← До уроку","← Back to the lesson","← К уроку","← Về bài học"],"home":["← Усі завдання","← All tasks","← Все задания","← Tất cả bài"],"voiceNote":["Озвучення робить голос вашого пристрою. Якщо чеського голосу немає, встановіть його в налаштуваннях мови телефона.","Audio uses your device’s voice. If there is no Czech voice, install it in your phone’s language settings.","Озвучку делает голос вашего устройства. Если чешского голоса нет, установите его в настройках языка телефона.","Âm thanh dùng giọng đọc của thiết bị. Nếu chưa có giọng tiếng Séc, hãy cài trong cài đặt ngôn ngữ của điện thoại."],"clickCz":["Порада: натисніть на будь-який чеський приклад у поясненні, щоб почути його.","Tip: click any Czech example in the explanation to hear it.","Совет: нажмите на любой чешский пример в объяснении, чтобы услышать его.","Mẹo: bấm vào bất kỳ ví dụ tiếng Séc nào trong phần giải thích để nghe."],"progress":["Вивчено тем","Topics learned","Изучено тем","Chủ đề đã học"],"themeD":["Увімкнути темну тему","Switch to dark theme","Включить тёмную тему","Bật giao diện tối"],"themeL":["Увімкнути світлу тему","Switch to light theme","Включить светлую тему","Bật giao diện sáng"],"langName":["Мова","Language","Язык","Ngôn ngữ"],"timeUp":["час вийшов","time is up","время вышло","hết giờ"],"fb3len":["бажано 60–90 слів","aim for 60–90 words","желательно 60–90 слов","nên 60–90 từ"],"fb3past":["Форм минулого часу","Past tense forms","Форм прошедшего времени","Dạng quá khứ"],"fb3pastMore":["бажано 6 і більше","aim for 6 or more","желательно 6 и больше","nên từ 6 trở lên"],"fb3conn":["Слова-зв’язки","Linking words","Слова-связки","Từ nối"],"say3":["🗣 Розповісти вголос","🗣 Tell the story out loud","🗣 Рассказать вслух","🗣 Kể thành tiếng"],"showModel":["Показати зразок","Show the sample","Показать образец","Xem bài mẫu"],"model3":["Зразок розповіді","Sample story","Образец рассказа","Bài kể mẫu"],"pastNote":["Виділено форми минулого часу. Натисніть ▶ біля речення, слухайте й повторюйте вголос.","Past tense forms are highlighted. Press ▶ next to a sentence, listen and repeat out loud.","Выделены формы прошедшего времени. Нажмите ▶ у предложения, слушайте и повторяйте вслух.","Các dạng quá khứ được tô sáng. Bấm ▶ cạnh câu, nghe và nhắc lại thành tiếng."],"story":["Історія","Story","История","Câu chuyện"],"stories":["Історії","Stories","Истории","Câu chuyện"],"storiesd":["40 історій з картинками й зразком розповіді в минулому часі.","40 picture stories with a sample told in the past tense.","40 историй с картинками и образцом рассказа в прошедшем времени.","40 câu chuyện theo tranh với bài kể mẫu ở thì quá khứ."],"practice3":["Розповідь на час","Timed story","Рассказ на время","Kể chuyện có giờ"],"practice3D":["Як на іспиті: випадкова історія, лише картинки, 1 хвилина. Потім порівняйте зі зразком.","Like the exam: a random story, pictures only, 1 minute. Then compare with the sample.","Как на экзамене: случайная история, только картинки, 1 минута. Потом сравните с образцом.","Giống khi thi: một câu chuyện ngẫu nhiên, chỉ có tranh, 1 phút. Sau đó so sánh với bài mẫu."],"another":["Інша історія","Another story","Другая история","Câu chuyện khác"]},"theory":{"u1":{"uk":{"how":"\n<p>Екзаменатор називає <b>тему<\/b> і ставить <b>4 питання<\/b>. Потім друга тема і ще 4 питання. Разом 8 питань, близько 3 хвилин, <b>8 балів<\/b>. Питань ви заздалегідь не бачите, лише чуєте.<\/p>\n<ul>\n<li>Питання прості, про ваше життя: де живете, що робите, що робили вчора, що будете робити.<\/li>\n<li>У кожній темі зазвичай є питання в <b>різних часах<\/b>: теперішньому, минулому, майбутньому, а часто й «що б ви хотіли».<\/li>\n<li>Оцінюють, чи ви зрозуміли питання, чи відповіли <b>цілим реченням<\/b>, чи правильний час і чи достатньо слів.<\/li>\n<\/ul>","grammar":"\n<h4>Формула доброї відповіді<\/h4>\n<p class=\"formula\">Відповідь цілим реченням <span>+<\/span> одна деталь <span>+<\/span> <span class=\"cz\">protože…<\/span> / <span class=\"cz\">a…<\/span> / <span class=\"cz\">ale…<\/span><\/p>\n<p>Не <span class=\"cz\">V Kralupech.<\/span>, а <span class=\"cz\">Bydlím v Kralupech, je to malé město blízko Prahy.<\/span><\/p>\n<h4>Головний секрет: беріть дієслово з питання<\/h4>\n<table class=\"tbl\">\n<tr><th>Питання<\/th><th>Відповідь починається так<\/th><th>Час<\/th><\/tr>\n<tr><td><span class=\"cz\">Kde bydlíte?<\/span><\/td><td><span class=\"cz\">Bydlím…<\/span><\/td><td>теперішній<\/td><\/tr>\n<tr><td><span class=\"cz\">Co děláte ve volném čase?<\/span><\/td><td><span class=\"cz\">Ve volném čase dělám / čtu / chodím…<\/span><\/td><td>теперішній<\/td><\/tr>\n<tr><td><span class=\"cz\">Co jste dělal/a včera?<\/span><\/td><td><span class=\"cz\">Včera jsem dělal/a…<\/span><\/td><td>минулий<\/td><\/tr>\n<tr><td><span class=\"cz\">Kde jste byl/a na dovolené?<\/span><\/td><td><span class=\"cz\">Na dovolené jsem byl/a…<\/span><\/td><td>минулий<\/td><\/tr>\n<tr><td><span class=\"cz\">Co budete dělat o víkendu?<\/span><\/td><td><span class=\"cz\">O víkendu budu…<\/span> / <span class=\"cz\">pojedu…<\/span> / <span class=\"cz\">půjdu…<\/span><\/td><td>майбутній<\/td><\/tr>\n<tr><td><span class=\"cz\">Co byste chtěl/a…?<\/span><\/td><td><span class=\"cz\">Chtěl/a bych…<\/span><\/td><td>«хотів би»<\/td><\/tr>\n<\/table>\n<h4>Теперішній час: закінчення «я»<\/h4>\n<p><span class=\"cz\">bydlet → bydlím<\/span> · <span class=\"cz\">dělat → dělám<\/span> · <span class=\"cz\">mít → mám<\/span> · <span class=\"cz\">být → jsem<\/span> · <span class=\"cz\">pracovat → pracuju<\/span> · <span class=\"cz\">jít → jdu<\/span> · <span class=\"cz\">jet → jedu<\/span><\/p>\n<h4>Минулий час: дієслово на -l + jsem<\/h4>\n<p><span class=\"cz\">dělat → dělal jsem<\/span> (чоловік) / <span class=\"cz\">dělala jsem<\/span> (жінка). У питанні «ви»: <span class=\"cz\">Co jste dělal/a?<\/span> Відповідь «я»: <span class=\"cz\">Dělal/a jsem…<\/span><\/p>\n<p>Часті неправильні: <span class=\"cz\">být → byl/a<\/span> · <span class=\"cz\">jít → šel / šla<\/span> · <span class=\"cz\">jet → jel/a<\/span> · <span class=\"cz\">mít → měl/a<\/span> · <span class=\"cz\">jíst → jedl/a<\/span> · <span class=\"cz\">vidět → viděl/a<\/span><\/p>\n<h4>Майбутній час<\/h4>\n<p><span class=\"cz\">budu + інфінітив<\/span>: <span class=\"cz\">budu pracovat, budu se učit<\/span>. Рух: <span class=\"cz\">pojedu<\/span> (поїду), <span class=\"cz\">půjdu<\/span> (піду). Коли: <span class=\"cz\">zítra, o víkendu, příští týden, příští rok<\/span>.<\/p>\n<h4>«Хотів би»<\/h4>\n<p><span class=\"cz\">Chtěl bych<\/span> (чоловік) / <span class=\"cz\">Chtěla bych<\/span> (жінка) + інфінітив: <span class=\"cz\">Chtěla bych mít větší byt.<\/span><\/p>","tips":"\n<ul>\n<li><b>Не зрозуміли питання?<\/b> Попросіть повторити: <span class=\"cz\">Promiňte, můžete to zopakovat?<\/span> Це нормально, балів за це не знімають.<\/li>\n<li><b>Не відповідайте одним словом.<\/b> «Ano» чи «V sobotu» майже нічого не дає. Додайте речення.<\/li>\n<li><b>Слухайте, в якому часі питання<\/b>: <span class=\"cz\">jste dělal/a<\/span> — минулий, <span class=\"cz\">budete<\/span> — майбутній.<\/li>\n<li><b>Не знаєте слова?<\/b> Скажіть простіше: замість <span class=\"cz\">účetní<\/span> — <span class=\"cz\">pracuju v kanceláři s čísly<\/span>.<\/li>\n<li><b>Підготуйте розповідь про себе<\/b> на 1 хвилину: ім'я, звідки ви, сім'я, робота, хобі. Її шматки підходять до багатьох тем.<\/li>\n<li>Відповідь не мусить бути правдою. Головне, щоб вона була правильна й зрозуміла.<\/li>\n<\/ul>"}},"u2":{},"u3":{"uk":{"how":"\n<p>Ви бачите <b>4 картинки<\/b> і питання, наприклад <span class=\"cz\">Co včera dělali muž a žena?<\/span> Ваше завдання — розповісти історію <b>в минулому часі<\/b>, використавши <b>всі 4 картинки<\/b>. На іспиті на це є <b>1 хвилина<\/b>, завдання дає <b>10 балів<\/b>.<\/p>\n<ul>\n<li>Оцінюють: чи є всі 4 картинки, чи правильний минулий час, чи розповідь зв'язна (слова «потім», «нарешті») і чи вистачає слів саме з цієї ситуації.<\/li>\n<li>Добра розповідь має 60–90 слів: по 2–3 речення на картинку.<\/li>\n<li>У новому форматі ситуації практичні: поліція, лікар, пошта, поломка, переїзд. Тому важливо знати конкретні слова.<\/li>\n<\/ul>","grammar":"\n<h4>Як утворити минулий час<\/h4>\n<p>Беремо інфінітив, відкидаємо <b>-t<\/b> і додаємо <b>-l<\/b>. Закінчення залежить від того, <b>хто<\/b> робив:<\/p>\n<div class=\"tblw\"><table class=\"tbl\">\n<tr><th>Хто<\/th><th>dělat<\/th><th>koupit<\/th><th>být<\/th><\/tr>\n<tr><td>він (muž, pan Novák)<\/td><td><span class=\"cz\">dělal<\/span><\/td><td><span class=\"cz\">koupil<\/span><\/td><td><span class=\"cz\">byl<\/span><\/td><\/tr>\n<tr><td>вона (žena, paní Nová)<\/td><td><span class=\"cz\">dělala<\/span><\/td><td><span class=\"cz\">koupila<\/span><\/td><td><span class=\"cz\">byla<\/span><\/td><\/tr>\n<tr><td>воно (dítě, auto)<\/td><td><span class=\"cz\">dělalo<\/span><\/td><td><span class=\"cz\">koupilo<\/span><\/td><td><span class=\"cz\">bylo<\/span><\/td><\/tr>\n<tr><td>вони (muž a žena, rodina → oni)<\/td><td><span class=\"cz\">dělali<\/span><\/td><td><span class=\"cz\">koupili<\/span><\/td><td><span class=\"cz\">byli<\/span><\/td><\/tr>\n<\/table><\/div>\n<p>У розповіді про <b>інших людей<\/b> слово <span class=\"cz\">jsem<\/span> не потрібне: <span class=\"cz\">Muž šel do obchodu.<\/span> Про <b>себе<\/b> додаємо <span class=\"cz\">jsem<\/span> або <span class=\"cz\">jsme<\/span>: <span class=\"cz\">Šel jsem do obchodu. Byli jsme v Praze.<\/span><\/p>\n<h4>Неправильні дієслова, які трапляються найчастіше<\/h4>\n<p><span class=\"cz\">jít → šel, šla<\/span> · <span class=\"cz\">jet → jel<\/span> · <span class=\"cz\">přijít → přišel<\/span> · <span class=\"cz\">najít → našel<\/span> · <span class=\"cz\">mít → měl<\/span> · <span class=\"cz\">chtít → chtěl<\/span> · <span class=\"cz\">moct → mohl<\/span> · <span class=\"cz\">říct → řekl<\/span> · <span class=\"cz\">vzít → vzal<\/span> · <span class=\"cz\">jíst → jedl<\/span> · <span class=\"cz\">pít → pil<\/span> · <span class=\"cz\">číst → četl<\/span> · <span class=\"cz\">začít → začal<\/span> · <span class=\"cz\">spát → spal<\/span> · <span class=\"cz\">zapomenout → zapomněl<\/span><\/p>\n<h4>Зворотні дієслова: se / si на другому місці<\/h4>\n<p><span class=\"cz\">Muž se probudil.<\/span> · <span class=\"cz\">Žena si koupila boty.<\/span> · <span class=\"cz\">Ráno se oblékl a umyl.<\/span><\/p>\n<h4>Каркас розповіді<\/h4>\n<div class=\"tblw\"><table class=\"tbl\">\n<tr><th>Частина<\/th><th>Слова-зв'язки<\/th><th>Приклад<\/th><\/tr>\n<tr><td>Початок: коли, хто, де<\/td><td><span class=\"cz\">Včera ráno…<\/span> · <span class=\"cz\">Minulou sobotu…<\/span><\/td><td><span class=\"cz\">Včera ráno jel pan Novák do práce.<\/span><\/td><\/tr>\n<tr><td>Картинка 1<\/td><td><span class=\"cz\">Nejdřív…<\/span> · <span class=\"cz\">Na začátku…<\/span><\/td><td><span class=\"cz\">Nejdřív si koupil kávu.<\/span><\/td><\/tr>\n<tr><td>Картинки 2–3<\/td><td><span class=\"cz\">Potom…<\/span> · <span class=\"cz\">Pak…<\/span> · <span class=\"cz\">Když…<\/span> · <span class=\"cz\">Najednou…<\/span><\/td><td><span class=\"cz\">Najednou začalo pršet.<\/span><\/td><\/tr>\n<tr><td>Картинка 4, кінець<\/td><td><span class=\"cz\">Nakonec…<\/span> · <span class=\"cz\">Večer…<\/span><\/td><td><span class=\"cz\">Nakonec šel domů a byl unavený.<\/span><\/td><\/tr>\n<\/table><\/div>\n<p>Додайте почуття: <span class=\"cz\">byl šťastný<\/span>, <span class=\"cz\">byla nervózní<\/span>, <span class=\"cz\">byli unavení<\/span>, і причину: <span class=\"cz\">protože…<\/span><\/p>","tips":"\n<ul>\n<li><b>Не описуйте картинку в теперішньому часі<\/b> («Na obrázku je muž…»). Розповідайте історію: <span class=\"cz\">Muž šel…<\/span><\/li>\n<li><b>Дайте людям імена<\/b>: <span class=\"cz\">pan Novák, paní Nová<\/span>. Так легше говорити й не плутатися.<\/li>\n<li><b>Не пропускайте жодної картинки<\/b>: за кожну пропущену втрачаються бали.<\/li>\n<li><b>Не знаєте слова?<\/b> Опишіть інакше: замість <span class=\"cz\">pokuta<\/span> — <span class=\"cz\">musel zaplatit peníze policii<\/span>.<\/li>\n<li><b>Слідкуйте за родом<\/b>: жінка — <span class=\"cz\">šla, byla, koupila<\/span>, чоловік — <span class=\"cz\">šel, byl, koupil<\/span>.<\/li>\n<li>Тренуйтеся з таймером на 1 хвилину: спочатку з текстом, потім лише з картинками.<\/li>\n<\/ul>"}},"u4":{}},"videos":{"home":[["NmmVbgWpIfo","Zkouška pro trvalý pobyt A2: Co se mění v dubnu 2026?"],["dZe4_xv6QkM","Zkouška pro trvalý pobyt A2: Mluvení – jak vypadá a jak se připravit"]],"u1":[["a8i-TWtrAwE","Mluvení – umíte odpovědět na otázky?"],["VJ_1cz6DowY","Czech Language Exam A2: Common Questions and Answers from the Examiner"],["3P7Bb-JSggo","Zkouška pro trvalý pobyt A2: Moje rodina (mluvení)"]],"u2":[["8h3rjTZHzr8","Mluvení, úloha 2 – další příklady"],["ojyeYcwEgM4","Czech A2 exam – speaking (roleplays)"],["yEhP3U98glw","Czech A2 Exam Speaking 2026 – BIG Overview with Examples"]],"u3":[["2ZiLJaTHIQ8","Learn Czech Past Tense for the A2 Exam"],["wM-i8G-a_aE","Mluvení – úlohy 3 a 4"],["kgWPlOsxKNs","Nová zkouška z češtiny A2 2026: Jak zvládnout mluvení bez stresu"]],"u4":[["evQzRMJIfYA","Mluvení, nová úloha 4 – další cvičení"],["m558l91RI54","Mluvení, nová úloha 4 – cvičení"]]},"u1":[{"cz":"O mně","t":["Про себе","About me","О себе","Về bản thân"],"qa":[["Jak se jmenujete?","Jmenuju se Olena Kovalenko. Přátelé mi říkají Lena."],["Odkud jste?","Jsem z Ukrajiny, z města Charkov. Je to velké město na východě."],["Kde teď bydlíte?","Teď bydlím v Kralupech nad Vltavou s rodinou."],["Jak dlouho jste v Česku?","V Česku jsem už pět let. Přijel/a jsem v roce 2021."],["Co děláte?","Pracuju ve skladu a ve volném čase se učím česky."],["Jaké jazyky umíte?","Umím ukrajinsky, rusky a trochu česky a anglicky."],["Jaký jste člověk?","Myslím, že jsem klidný/á a přátelský/á. Rád/a pomáhám lidem."],["Co jste dělal/a před příjezdem do Česka?","Na Ukrajině jsem pracoval/a jako prodavač/ka v obchodě."],["Proč jste přijel/a do Česka?","Přijel/a jsem kvůli práci a protože tady žijí moji příbuzní."],["Co byste chtěl/a dělat za pět let?","Za pět let bych chtěl/a mít lepší práci a mluvit dobře česky."]]},{"cz":"Rodina","t":["Родина","Family","Семья","Gia đình"],"qa":[["Kolik lidí má vaše rodina?","Moje rodina má čtyři lidi: manžela, dva syny a mě."],["Máte sourozence?","Ano, mám jednoho bratra. Je o tři roky starší a bydlí na Ukrajině."],["Kde bydlí vaši rodiče?","Moji rodiče bydlí na Ukrajině v malém městě u řeky."],["Co dělá váš manžel nebo vaše manželka?","Moje manželka pracuje v nemocnici jako zdravotní sestra."],["Kolik let mají vaše děti?","Syn má devět let a dcera má pět let. Syn chodí do třetí třídy."],["Co rádi děláte jako rodina?","Jako rodina rádi chodíme na procházky a o víkendu hrajeme hry."],["Jak často voláte rodičům?","Rodičům volám skoro každý den večer, když jsou doma."],["Kdy jste naposledy viděl/a rodiče?","Rodiče jsem naposledy viděl/a loni v létě, když přijeli na návštěvu."],["Jak jste slavili poslední narozeniny v rodině?","Synovi jsme minulý měsíc udělali oslavu doma s dortem a kamarády."],["Kam pojedete příště s rodinou?","Příští léto pojedeme s rodinou k moři do Chorvatska."]]},{"cz":"Kamarádi","t":["Друзі","Friends","Друзья","Bạn bè"],"qa":[["Máte v Česku kamarády?","Ano, mám tady několik kamarádů. Některé znám z práce."],["Jak často se scházíte s kamarády?","S kamarády se scházím asi jednou týdně, většinou v sobotu."],["Jak vypadá váš nejlepší kamarád?","Můj nejlepší kamarád je vysoký, má krátké černé vlasy a nosí brýle."],["Jaký je váš nejlepší kamarád?","Je veselý a vždycky pomůže, když mám problém."],["Co děláte s kamarády?","S kamarády chodíme do kavárny, hrajeme fotbal nebo grilujeme."],["Kde jste se seznámil/a s nejlepším kamarádem?","S nejlepším kamarádem jsem se seznámil/a v práci před třemi lety."],["Kdy jste naposledy navštívil/a kamaráda a proč?","Minulou neděli jsem navštívil/a kamaráda, protože měl narozeniny."],["Máte kamarády Čechy?","Mám jednu kamarádku Češku. Pomáhá mi s češtinou."],["Co budete dělat s kamarády o víkendu?","O víkendu půjdeme s kamarády na výlet do Prahy."],["Proč jsou kamarádi důležití?","Kamarádi jsou důležití, protože s nimi můžu mluvit o všem."]]},{"cz":"Bydlení","t":["Житло","Housing","Жильё","Nhà ở"],"qa":[["Bydlíte v bytě, nebo v domě?","Bydlím v bytě v paneláku ve třetím patře."],["Jak velký je váš byt?","Náš byt je dva plus jedna. Má dva pokoje a kuchyň."],["Kolik platíte za nájem?","Za nájem platíme dvanáct tisíc korun měsíčně i s energiemi."],["Co máte v obývacím pokoji?","V obývacím pokoji máme gauč, stůl, televizi a velkou skříň."],["Jaký nábytek potřebuje každý člověk a proč?","Každý člověk potřebuje postel, protože musí dobře spát."],["Líbí se vám váš byt?","Ano, byt se mi líbí, protože je světlý a blízko je park."],["Jak vypadal váš domov v dětství?","V dětství jsem bydlel/a s rodiči v malém domě se zahradou."],["Kdy jste se naposledy stěhoval/a?","Naposledy jsem se stěhoval/a před dvěma lety do většího bytu."],["Co byste chtěl/a v bytě změnit?","Chtěl/a bych novou kuchyň a větší koupelnu."],["Jaký domov byste chtěl/a za deset let?","Za deset let bych chtěl/a vlastní dům se zahradou."]]},{"cz":"Moje město","t":["Моє місто","My town","Мой город","Thành phố của tôi"],"qa":[["Ve kterém městě bydlíte?","Bydlím v Kralupech nad Vltavou. Je to malé město blízko Prahy."],["Je vaše město velké, nebo malé?","Moje město je malé, má asi osmnáct tisíc obyvatel."],["Co je ve vašem městě zajímavé?","Zajímavá je řeka Vltava a hezký park u nádraží."],["Kam chodíte ve městě nejraději?","Nejraději chodím do parku a na procházku k řece."],["Jak se ve městě dostanete do práce?","Do práce jezdím autobusem, cesta trvá patnáct minut."],["Co ve vašem městě chybí?","Chybí tady kino a víc hřišť pro děti."],["Jaké bylo vaše město, když jste přijel/a?","Když jsem přijel/a, bylo město tiché a nikoho jsem neznal/a."],["Co jste ve městě dělal/a minulou sobotu?","Minulou sobotu jsem byl/a na trhu na náměstí a koupil/a jsem zeleninu."],["Budete v tomto městě bydlet i v budoucnu?","Ano, myslím, že tady budu bydlet i v budoucnu, protože se mi tu líbí."],["Co byste doporučil/a turistovi ve vašem městě?","Doporučil/a bych procházku podél řeky a návštěvu kostela."]]},{"cz":"Práce","t":["Робота","Work","Работа","Công việc"],"qa":[["Kde pracujete?","Pracuju ve skladu v Kralupech."],["Co děláte v práci každý den?","Každý den nakládám a vykládám zboží a kontroluju krabice."],["Kdy začínáte a končíte v práci?","Začínám v šest ráno a končím ve dvě odpoledne."],["Jak jezdíte do práce?","Do práce jezdím autem, je to asi deset minut."],["Líbí se vám vaše práce?","Práce se mi líbí, protože mám dobré kolegy, ale je dost těžká."],["Mluvíte v práci česky?","Ano, s vedoucím mluvím česky, s kolegy někdy ukrajinsky."],["Jakou práci jste dělal/a dřív?","Dřív jsem pracoval/a jako řidič/ka v taxi."],["Jak jste našel/našla tuhle práci?","Tuhle práci jsem našel/našla na internetu přes agenturu."],["Kolik dní dovolené budete mít letos?","Letos budu mít dvacet dní dovolené."],["Jakou práci byste chtěl/a dělat za pět let?","Za pět let bych chtěl/a pracovat v kanceláři jako účetní."]]},{"cz":"Škola a vzdělávání","t":["Школа й освіта","School and education","Школа и образование","Trường học và giáo dục"],"qa":[["Jakou školu jste studoval/a?","Studoval/a jsem střední školu a potom ekonomii na univerzitě."],["Co jste studoval/a?","Studoval/a jsem ekonomii a účetnictví."],["Jaký předmět jste měl/a ve škole rád/a?","Ve škole jsem měl/a rád/a matematiku a zeměpis."],["Jak dlouho jste chodil/a do školy?","Do školy jsem chodil/a jedenáct let a na univerzitu pět let."],["Chodí vaše děti do školy?","Ano, syn chodí do základní školy, je ve třetí třídě."],["Jak daleko je škola od vašeho bytu?","Škola je blízko, asi deset minut pěšky."],["Co se teď učíte?","Teď se učím česky, chodím na kurz dvakrát týdně."],["Jak se vaše děti učí česky?","Děti se učí česky ve škole a mluví česky s kamarády."],["Budete ještě něco studovat?","Ano, příští rok budu studovat kurz účetnictví."],["Co byste chtěl/a studovat, kdybyste měl/a čas?","Kdybych měl/a čas, studoval/a bych počítače a programování."]]},{"cz":"Čeština","t":["Чеська мова","Learning Czech","Чешский язык","Tiếng Séc"],"qa":[["Jak dlouho se učíte česky?","Česky se učím asi dva roky."],["Jak jste se učil/a česky?","Učil/a jsem se v kurzu, z aplikace v telefonu a z televize."],["Kde nejčastěji mluvíte česky?","Nejčastěji mluvím česky v práci a v obchodě."],["Je pro vás čeština těžká?","Čeština je těžká, hlavně gramatika a výslovnost ř."],["Co je pro vás v češtině nejtěžší?","Nejtěžší jsou pro mě pády a dlouhé samohlásky."],["Čtete česky?","Ano, čtu zprávy na internetu a někdy krátké knihy pro děti."],["Díváte se na českou televizi?","Ano, večer se dívám na české zprávy a seriály."],["Proč se učíte česky?","Česky se učím, protože tady žiju a chci trvalý pobyt."],["Jak se budete učit dál?","Budu chodit na kurz a víc mluvit s českými kolegy."],["Co byste poradil/a člověku, který začíná s češtinou?","Poradil/a bych mu mluvit každý den, i když dělá chyby."]]},{"cz":"Denní režim","t":["Розпорядок дня","Daily routine","Распорядок дня","Sinh hoạt hằng ngày"],"qa":[["V kolik hodin vstáváte?","Ve všední dny vstávám v pět hodin ráno."],["Co děláte ráno?","Ráno se umyju, obléknu se, nasnídám se a jdu do práce."],["Co snídáte?","K snídani jím chleba se sýrem a piju kávu."],["Kde obědváte?","Obědvám v jídelně v práci, většinou polévku a hlavní jídlo."],["Co děláte odpoledne?","Odpoledne vyzvednu syna ze školy a nakupuju."],["Co děláte večer?","Večer vařím večeři, dívám se na televizi a učím se česky."],["V kolik hodin chodíte spát?","Spát chodím asi v deset hodin večer."],["Co jste dělal/a včera večer?","Včera večer jsem vařil/a polévku a potom jsem četl/a knihu."],["Co budete dělat zítra ráno?","Zítra ráno pojedu k lékaři a potom do práce."],["Jak byste chtěl/a změnit svůj den?","Chtěl/a bych mít víc času na sport a na rodinu."]]},{"cz":"Víkend","t":["Вихідні","Weekend","Выходные","Cuối tuần"],"qa":[["Co obvykle děláte o víkendu?","O víkendu odpočívám, uklízím a chodím s rodinou ven."],["Pracujete někdy o víkendu?","Někdy pracuju v sobotu, ale neděle mám volnou."],["Kdy v sobotu vstáváte?","V sobotu vstávám později, asi v osm hodin."],["Kam chodíte o víkendu?","O víkendu chodíme do parku, do bazénu nebo do obchodního centra."],["S kým trávíte víkend?","Víkend trávím hlavně s rodinou a někdy s kamarády."],["Co jste dělal/a minulý víkend?","Minulý víkend jsme byli na výletě na hradě Karlštejn."],["Jaký byl váš nejlepší víkend?","Nejlepší víkend byl loni v létě, když jsme byli u jezera."],["Co budete dělat tento víkend?","Tento víkend budu doma, protože musím uklízet a vařit."],["Kam pojedete příští víkend?","Příští víkend pojedeme ke kamarádům do Brna."],["Jak byste chtěl/a strávit ideální víkend?","Ideální víkend bych chtěl/a strávit na horách bez telefonu."]]},{"cz":"Volný čas a koníčky","t":["Вільний час і хобі","Free time and hobbies","Свободное время и хобби","Thời gian rảnh và sở thích"],"qa":[["Co děláte ve volném čase?","Ve volném čase čtu knihy, vařím a chodím na procházky."],["Máte nějaký koníček?","Ano, můj koníček je rybaření. Chodím k řece s kamarádem."],["Kolik máte volného času?","Volný čas mám hlavně večer a v neděli."],["Hrajete na nějaký hudební nástroj?","Ne, nehraju, ale rád/a poslouchám hudbu."],["Jakou hudbu posloucháte?","Poslouchám hlavně pop a ukrajinské písničky."],["Co jste dělal/a ve volném čase jako dítě?","Jako dítě jsem hrál/a fotbal a chodil/a jsem do tanečního kroužku."],["Co jste dělal/a minulý týden ve volném čase?","Minulý týden jsem byl/a v kině a viděl/a jsem nový film."],["Máte nějaký nový koníček?","Ano, teď jsem začal/a fotografovat přírodu telefonem."],["Co budete dělat dnes večer?","Dnes večer budu číst knihu a poslouchat hudbu."],["Jaký koníček byste chtěl/a vyzkoušet?","Chtěl/a bych vyzkoušet jógu, protože je dobrá pro záda."]]},{"cz":"Sport","t":["Спорт","Sport","Спорт","Thể thao"],"qa":[["Sportujete?","Ano, sportuju dvakrát týdně, chodím běhat a plavat."],["Jaký sport máte nejraději?","Nejraději mám fotbal, hraju ho i se synem."],["Kde sportujete?","Běhám v parku a plavu v městském bazénu."],["Díváte se na sport v televizi?","Ano, dívám se na fotbal a v zimě na hokej."],["Jaký sport je populární ve vaší zemi?","V mé zemi je nejpopulárnější fotbal a box."],["Jaký sport jste dělal/a ve škole?","Ve škole jsem hrál/a volejbal a běhal/a jsem."],["Kdy jste naposledy sportoval/a?","Naposledy jsem sportoval/a včera, plaval/a jsem půl hodiny."],["Proč je sport důležitý?","Sport je důležitý, protože jsme zdraví a máme dobrou náladu."],["Budete o víkendu sportovat?","Ano, v sobotu budu hrát fotbal s kolegy."],["Jaký sport byste chtěl/a zkusit?","Chtěl/a bych zkusit tenis, protože vypadá zábavně."]]},{"cz":"Jídlo a vaření","t":["Їжа й готування","Food and cooking","Еда и готовка","Ăn uống và nấu nướng"],"qa":[["Co rád/a jíte?","Rád/a jím těstoviny, kuře a zeleninu."],["Kdo u vás doma vaří?","Doma vařím hlavně já, o víkendu vaří manžel."],["Co obvykle vaříte?","Obvykle vařím polévku, maso s bramborami nebo rýži."],["Jaké jídlo nemáte rád/a?","Nemám rád/a ryby, protože mi nechutnají."],["Kde nakupujete jídlo?","Jídlo nakupuju v supermarketu a zeleninu na trhu."],["Jaké české jídlo znáte?","Znám svíčkovou, guláš a knedlíky. Svíčková mi chutná."],["Jaké typické jídlo je ve vaší zemi?","V mé zemi je typický boršč, to je polévka z červené řepy."],["Co jste vařil/a včera?","Včera jsem vařil/a kuře s rýží a salát."],["Co budete vařit na víkend?","Na víkend budu vařit guláš, protože přijdou hosté."],["Jaké jídlo byste se chtěl/a naučit vařit?","Chtěl/a bych se naučit vařit české knedlíky."]]},{"cz":"Restaurace a kavárna","t":["Ресторан і кав'ярня","Restaurant and café","Ресторан и кафе","Nhà hàng và quán cà phê"],"qa":[["Chodíte do restaurace?","Do restaurace chodím asi jednou za měsíc."],["S kým chodíte do restaurace?","Do restaurace chodím s rodinou nebo s kolegy z práce."],["Co si v restauraci obvykle objednáte?","Obvykle si objednám polévku a hlavní jídlo, třeba řízek."],["Co pijete v kavárně?","V kavárně piju cappuccino nebo čaj."],["Kolik stojí oběd v restauraci?","Polední menu stojí asi sto padesát až dvě stě korun."],["Dáváte v restauraci spropitné?","Ano, obvykle dám deset procent spropitné."],["Kdy jste byl/a naposledy v restauraci?","Naposledy jsem byl/a v restauraci minulou sobotu na narozeninách."],["Co jste tam jedl/a?","Jedl/a jsem pizzu a pil/a jsem limonádu."],["Kam půjdete příště na večeři?","Příště půjdeme do nové italské restaurace na náměstí."],["Jakou restauraci byste doporučil/a kamarádovi?","Doporučil/a bych malou restauraci u řeky, protože tam dobře vaří."]]},{"cz":"Nakupování","t":["Покупки","Shopping","Покупки","Mua sắm"],"qa":[["Kde nakupujete?","Nakupuju v supermarketu blízko domu."],["Jak často nakupujete?","Velký nákup dělám jednou týdně, v sobotu."],["Co kupujete nejčastěji?","Nejčastěji kupuju chleba, mléko, ovoce a zeleninu."],["Platíte kartou, nebo hotově?","Většinou platím kartou, je to rychlejší."],["Nakupujete na internetu?","Ano, na internetu kupuju oblečení a elektroniku."],["Kdo u vás doma nakupuje?","Nakupujeme spolu s manželem, on nosí tašky."],["Co jste naposledy koupil/a?","Naposledy jsem koupil/a nové boty na zimu."],["Kolik jste za to zaplatil/a?","Zaplatil/a jsem tisíc dvě stě korun, byly ve slevě."],["Co budete kupovat tento týden?","Tento týden budu kupovat dárek pro dceru."],["Co byste si koupil/a, kdybyste měl/a hodně peněz?","Koupil/a bych si nové auto a velký byt."]]},{"cz":"Oblečení","t":["Одяг","Clothes","Одежда","Quần áo"],"qa":[["Co máte dnes na sobě?","Dnes mám na sobě džíny, modrý svetr a sportovní boty."],["Jaké oblečení nosíte do práce?","Do práce nosím pracovní kalhoty a tričko."],["Jakou barvu máte nejraději?","Nejraději mám modrou a černou barvu."],["Kde kupujete oblečení?","Oblečení kupuju v obchodním centru nebo na internetu."],["Co nosíte v zimě?","V zimě nosím teplou bundu, čepici, šálu a rukavice."],["Nosíte rád/a elegantní oblečení?","Elegantní oblečení nosím jen na svatbu nebo do divadla."],["Co jste si naposledy koupil/a na sebe?","Naposledy jsem si koupil/a zimní bundu."],["Co jste měl/a na sobě na poslední oslavě?","Na poslední oslavě jsem měl/a černé šaty a nové boty."],["Co si koupíte na jaro?","Na jaro si koupím lehkou bundu a nové tenisky."],["Jaké oblečení byste nikdy nenosil/a?","Nikdy bych nenosil/a moc barevné oblečení, nelíbí se mi."]]},{"cz":"Počasí a roční období","t":["Погода й пори року","Weather and seasons","Погода и времена года","Thời tiết và các mùa"],"qa":[["Jaké je dnes počasí?","Dnes je zima a prší, je asi pět stupňů."],["Jaké roční období máte nejraději?","Nejraději mám léto, protože je teplo a dlouhé dny."],["Co děláte, když prší?","Když prší, jsem doma, čtu nebo se dívám na film."],["Jaké je počasí v Česku v zimě?","V zimě je v Česku zima, někdy sněží a mrzne."],["Jaké je počasí ve vaší zemi v létě?","V mé zemi je v létě velké horko, až třicet pět stupňů."],["Díváte se na předpověď počasí?","Ano, dívám se na předpověď v telefonu každé ráno."],["Jaké bylo počasí minulý víkend?","Minulý víkend bylo krásně, svítilo slunce."],["Co jste dělal/a minulou zimu?","Minulou zimu jsme jezdili na sáňkách a stavěli sněhuláka."],["Jaké bude počasí zítra?","Zítra bude podle předpovědi slunečno a teplo."],["Kde byste chtěl/a žít kvůli počasí?","Kvůli počasí bych chtěl/a žít u moře, kde je teplo."]]},{"cz":"Zdraví a lékař","t":["Здоров'я й лікар","Health and the doctor","Здоровье и врач","Sức khỏe và bác sĩ"],"qa":[["Jak se cítíte?","Dnes se cítím dobře, nic mě nebolí."],["Máte praktického lékaře?","Ano, mám praktického lékaře blízko domu."],["Jak často chodíte k lékaři?","K lékaři chodím jednou za rok na prohlídku."],["Co děláte, když jste nemocný/á?","Když jsem nemocný/á, zůstanu doma, piju čaj a beru léky."],["Máte zdravotní pojištění?","Ano, mám zdravotní pojištění u VZP."],["Kdy jste byl/a naposledy nemocný/á?","Naposledy jsem byl/a nemocný/á v zimě, měl/a jsem chřipku."],["Co vám lékař řekl?","Lékař mi řekl, že musím být týden doma a brát antibiotika."],["Byl/a jste někdy v nemocnici?","Ano, před rokem jsem byl/a v nemocnici, protože jsem měl/a zlomenou ruku."],["Kdy půjdete k zubaři?","K zubaři půjdu příští měsíc na kontrolu."],["Co byste udělal/a pro své zdraví?","Pro zdraví bych chtěl/a víc chodit pěšky a jíst méně sladkého."]]},{"cz":"Doprava ve městě","t":["Транспорт у місті","Getting around town","Транспорт в городе","Giao thông trong thành phố"],"qa":[["Jak jezdíte do práce?","Do práce jezdím autobusem, někdy na kole."],["Máte auto?","Ano, máme jedno auto, ale ve městě jezdím autobusem."],["Kolik stojí jízdenka na autobus?","Jízdenka stojí asi třicet korun, mám měsíční kupón."],["Kde si kupujete jízdenky?","Jízdenky si kupuju v aplikaci v telefonu."],["Jak dlouho trvá cesta do centra?","Cesta do centra trvá asi dvacet minut tramvají."],["Jezdíte rád/a metrem?","Ano, metro je rychlé, ale ráno je tam hodně lidí."],["Měl/a jste někdy problém v MHD?","Jednou jsem zapomněl/a jízdenku a musel/a jsem zaplatit pokutu."],["Jak jste dnes přijel/a sem?","Dnes jsem přijel/a vlakem a potom jsem šel/šla pěšky."],["Budete si kupovat auto?","Ano, příští rok si koupím malé auto."],["Co byste zlepšil/a v dopravě ve vašem městě?","Zlepšil/a bych autobusy večer, protože jezdí málo."]]},{"cz":"Cestování a dovolená","t":["Подорожі й відпустка","Travel and holidays","Путешествия и отпуск","Du lịch và kỳ nghỉ"],"qa":[["Rád/a cestujete?","Ano, cestuju rád/a, poznávám nová místa."],["Jak nejraději cestujete?","Nejraději cestuju autem, protože můžu zastavit, kde chci."],["Kam jezdíte na dovolenou?","Na dovolenou jezdíme k moři nebo na hory."],["Kolik dní trvá vaše dovolená?","Naše dovolená trvá obvykle deset dní."],["Co si berete na cestu?","Na cestu si beru pas, peníze, telefon a oblečení."],["Kde jste byl/a na poslední dovolené?","Na poslední dovolené jsem byl/a v Itálii u moře."],["Co jste tam dělal/a?","Koupal/a jsem se, jedl/a jsem pizzu a prohlížel/a jsem si město."],["Jaká byla vaše nejhorší cesta?","Nejhorší cesta byla, když se nám rozbilo auto na dálnici."],["Kam pojedete příští léto?","Příští léto pojedeme do Chorvatska na dva týdny."],["Kterou zemi byste chtěl/a navštívit a proč?","Chtěl/a bych navštívit Japonsko, protože má zajímavou kulturu."]]},{"cz":"Svátky a oslavy","t":["Свята й урочистості","Holidays and celebrations","Праздники и торжества","Ngày lễ và lễ kỷ niệm"],"qa":[["Jaký svátek máte nejraději?","Nejraději mám Vánoce, protože je celá rodina spolu."],["Jak slavíte Vánoce?","Na Vánoce zdobíme stromeček, vaříme a dáváme si dárky."],["Co jíte na Štědrý den?","Na Štědrý den jíme kapra s bramborovým salátem."],["Jaké české svátky znáte?","Znám Vánoce, Velikonoce a Den české státnosti."],["Jaký je typický svátek ve vaší zemi?","V mé zemi je důležitý svátek Velikonoce, pečeme velikonoční chleba."],["Jak jste slavil/a minulý Silvestr?","Minulý Silvestr jsme byli u kamarádů a o půlnoci jsme se dívali na ohňostroj."],["Kdy jste měl/a velkou oslavu?","Velkou oslavu jsme měli na svatbě mého bratra loni v létě."],["Dáváte dárky na Velikonoce?","Dětem dáváme čokoládová vajíčka a malé dárky."],["Jak budete slavit letošní Vánoce?","Letošní Vánoce budeme slavit doma, přijedou moji rodiče."],["Jaký svátek byste chtěl/a zažít v jiné zemi?","Chtěl/a bych zažít karneval v Itálii."]]},{"cz":"Narozeniny","t":["День народження","Birthdays","День рождения","Sinh nhật"],"qa":[["Kdy máte narozeniny?","Narozeniny mám čtrnáctého října."],["Jak slavíte narozeniny?","Narozeniny slavím doma s rodinou a kamarády."],["Co dostáváte k narozeninám?","K narozeninám dostávám knihy, oblečení nebo kosmetiku."],["Co dáváte kamarádům k narozeninám?","Kamarádům dávám víno, květiny nebo dárkový poukaz."],["Pečete na narozeniny dort?","Ano, na narozeniny peču čokoládový dort."],["Jak jste slavil/a poslední narozeniny?","Poslední narozeniny jsem slavil/a v restauraci s rodinou."],["Jaký byl váš nejlepší dárek?","Nejlepší dárek byl výlet do Paříže od manžela."],["Kdy jste byl/a naposledy na narozeninové oslavě?","Minulý týden jsem byl/a na oslavě kolegyně v práci."],["Jak oslavíte příští narozeniny?","Příští narozeniny oslavím na chatě s kamarády."],["Jaký dárek byste chtěl/a dostat?","Chtěl/a bych dostat nový telefon nebo kolo."]]},{"cz":"Kultura","t":["Культура","Culture","Культура","Văn hóa"],"qa":[["Chodíte do kina?","Do kina chodím asi jednou za dva měsíce."],["Jaké filmy máte rád/a?","Mám rád/a komedie a dobrodružné filmy."],["Byl/a jste někdy v divadle?","Ano, byl/a jsem v Národním divadle na opeře."],["Chodíte na koncerty?","Na koncerty chodím jen někdy, když hraje moje oblíbená skupina."],["Jaká je vaše oblíbená kniha?","Moje oblíbená kniha je Malý princ."],["Znáte nějakého českého umělce?","Znám spisovatele Karla Čapka a malíře Alfonse Muchu."],["Jaký film jste viděl/a naposledy?","Naposledy jsem viděl/a českou pohádku Tři oříšky pro Popelku."],["Jak se vám ten film líbil?","Film se mi moc líbil, byl hezký a vtipný."],["Kam půjdete příště za kulturou?","Příště půjdeme na výstavu do muzea v Praze."],["Na jaký koncert byste chtěl/a jít?","Chtěl/a bych jít na koncert vážné hudby do Rudolfina."]]},{"cz":"Televize a internet","t":["Телебачення й інтернет","TV and the internet","Телевидение и интернет","Truyền hình và internet"],"qa":[["Díváte se na televizi?","Na televizi se dívám večer asi hodinu."],["Jaké pořady sledujete?","Sleduju zprávy, sport a kuchařské pořady."],["Jak často používáte internet?","Internet používám každý den v telefonu."],["Na co používáte internet?","Na internetu čtu zprávy, píšu zprávy rodině a nakupuju."],["Používáte sociální sítě?","Ano, používám Facebook a Viber, abych mluvil/a s rodinou."],["Kolik času trávíte na telefonu?","Na telefonu trávím asi dvě hodiny denně, je to moc."],["Co jste naposledy hledal/a na internetu?","Naposledy jsem hledal/a informace o zkoušce z češtiny."],["Jaký seriál jste viděl/a naposledy?","Naposledy jsem viděl/a český seriál o nemocnici."],["Budete se dívat dnes na televizi?","Dnes večer se budu dívat na fotbal."],["Mohl/a byste žít bez internetu?","Bez internetu bych mohl/a žít, ale bylo by to těžké."]]},{"cz":"Telefon a technika","t":["Телефон і техніка","Phone and gadgets","Телефон и техника","Điện thoại và thiết bị"],"qa":[["Jaký máte telefon?","Mám telefon Samsung, je dva roky starý."],["K čemu používáte telefon?","Telefon používám na volání, zprávy, fotky a mapy."],["Máte doma počítač?","Ano, máme doma notebook, používají ho hlavně děti."],["Jaké aplikace používáte nejčastěji?","Nejčastěji používám Viber, mapy a aplikaci banky."],["Umíte opravit počítač?","Ne, neumím, když se něco rozbije, volám servis."],["Kolik stojí dobrý telefon?","Dobrý telefon stojí asi deset tisíc korun."],["Kdy jste koupil/a svůj telefon?","Telefon jsem koupil/a před dvěma lety v obchodě s elektronikou."],["Rozbil se vám někdy telefon?","Ano, minulý rok mi spadl a rozbil se displej."],["Koupíte si brzy nový telefon?","Ano, na Vánoce si koupím nový telefon."],["Jakou techniku byste chtěl/a mít doma?","Chtěl/a bych mít myčku nádobí, ušetřila by mi čas."]]},{"cz":"Úřady","t":["Установи й документи","Offices and paperwork","Учреждения и документы","Cơ quan và giấy tờ"],"qa":[["Na jakém úřadě jste byl/a v Česku?","Byl/a jsem na odboru azylové a migrační politiky a na městském úřadě."],["Proč chodíte na úřad?","Na úřad chodím kvůli pobytu, dokladům nebo změně adresy."],["Je pro vás těžké mluvit na úřadě česky?","Je to těžké, protože úředníci mluví rychle a používají těžká slova."],["Jak se objednáváte na úřad?","Na úřad se objednávám přes internet nebo telefonem."],["Jaké doklady máte?","Mám pas, povolení k pobytu a řidičský průkaz."],["Kdy jste byl/a naposledy na úřadě?","Naposledy jsem byl/a na úřadě minulý měsíc kvůli prodloužení pobytu."],["Jak dlouho jste tam čekal/a?","Čekal/a jsem asi hodinu, bylo tam hodně lidí."],["Kdo vám pomáhá s formuláři?","S formuláři mi pomáhá kolegyně Češka nebo integrační centrum."],["Kdy budete žádat o trvalý pobyt?","O trvalý pobyt budu žádat příští rok, až udělám zkoušku."],["Co byste na úřadech změnil/a?","Chtěl/a bych, aby bylo víc informací v jiných jazycích."]]},{"cz":"Banka a peníze","t":["Банк і гроші","Banking and money","Банк и деньги","Ngân hàng và tiền bạc"],"qa":[["Máte účet v české bance?","Ano, mám účet v bance, kterou mám blízko domu."],["Jak platíte v obchodě?","V obchodě platím kartou nebo telefonem."],["Používáte internetové bankovnictví?","Ano, platby dělám v aplikaci v telefonu."],["Spoříte peníze?","Ano, každý měsíc spořím trochu peněz na dovolenou."],["Na co nejvíc utrácíte?","Nejvíc utrácím za nájem a za jídlo."],["Posíláte peníze domů?","Někdy posílám peníze rodičům na Ukrajinu."],["Kdy jste si založil/a účet?","Účet jsem si založil/a hned první měsíc v Česku."],["Ztratil/a jste někdy kartu?","Ano, jednou jsem ji ztratil/a a hned jsem ji zablokoval/a."],["Na co budete šetřit?","Budu šetřit na auto a na studium dětí."],["Co byste udělal/a, kdybyste vyhrál/a milion?","Koupil/a bych byt a část peněz bych dal/a rodině."]]},{"cz":"Pošta a služby","t":["Пошта й послуги","Post office and services","Почта и услуги","Bưu điện và dịch vụ"],"qa":[["Chodíte na poštu?","Na poštu chodím jen někdy, když posílám balík."],["Co posíláte poštou?","Poštou posílám balíky rodině a dopisy na úřad."],["Kde si vyzvedáváte balíky?","Balíky si vyzvedávám ve výdejním boxu u obchodu."],["Chodíte ke kadeřníkovi?","Ke kadeřníkovi chodím jednou za dva měsíce."],["Kolik stojí střih u kadeřníka?","Pánský střih stojí asi tři sta korun."],["Kdo vám opravuje auto?","Auto mi opravuje autoservis v našem městě."],["Kdy jste naposledy posílal/a balík?","Minulý týden jsem posílal/a balík babičce na Ukrajinu."],["Měl/a jste někdy problém se službou?","Ano, jednou mi čistírna zničila košili a musel/a jsem reklamovat."],["Kdy půjdete ke kadeřníkovi?","Ke kadeřníkovi půjdu v pátek odpoledne."],["Jakou službu byste chtěl/a mít blízko domu?","Chtěl/a bych mít blízko domu poštu, protože je daleko."]]},{"cz":"Příroda a výlety","t":["Природа й прогулянки","Nature and trips","Природа и прогулки","Thiên nhiên và dã ngoại"],"qa":[["Máte rád/a přírodu?","Ano, přírodu mám moc rád/a, uklidňuje mě."],["Kam chodíte do přírody?","Chodím do lesa za městem a k řece."],["Jezdíte na výlety?","Na výlety jezdíme skoro každý měsíc."],["Co si berete na výlet?","Na výlet si beru vodu, svačinu, mapu a deštník."],["Jaké místo v Česku se vám líbí?","Líbí se mi Český ráj, jsou tam krásné skály."],["Kde jste byl/a na posledním výletě?","Na posledním výletě jsme byli na Šumavě."],["Co jste tam viděl/a?","Viděl/a jsem jezero, velké lesy a jelena."],["Sbíráte houby?","Ano, na podzim sbíráme houby, loni jsme jich našli hodně."],["Kam pojedete na příští výlet?","Na příští výlet pojedeme do Krkonoš."],["Kde byste chtěl/a strávit týden v přírodě?","Týden bych chtěl/a strávit na horách ve stanu."]]},{"cz":"Zvířata","t":["Тварини","Animals","Животные","Động vật"],"qa":[["Máte doma zvíře?","Ano, máme psa, jmenuje se Bobík."],["Jaké zvíře máte nejraději?","Nejraději mám psy, protože jsou věrní."],["Kdo se stará o vašeho psa?","O psa se stará hlavně syn, chodí s ním ven."],["Kolikrát denně chodíte se psem ven?","Se psem chodíme ven třikrát denně."],["Co jí vaše zvíře?","Náš pes jí granule a někdy maso."],["Měl/a jste zvíře jako dítě?","Jako dítě jsem měl/a kočku a králíka."],["Kdy jste byl/a naposledy v zoo?","V zoo jsme byli loni na jaře v Praze."],["Jaké zvíře se vám v zoo líbilo?","V zoo se mi nejvíc líbili sloni a žirafy."],["Budete si pořizovat další zvíře?","Ne, další zvíře si pořizovat nebudeme, byt je malý."],["Jaké zvíře byste chtěl/a mít?","Chtěl/a bych mít koně, ale potřebuju velkou zahradu."]]},{"cz":"Česko","t":["Чехія","The Czech Republic","Чехия","Cộng hòa Séc"],"qa":[["Jak se vám líbí v Česku?","V Česku se mi líbí, je tady klid a pořádek."],["Co se vám v Česku líbí nejvíc?","Nejvíc se mi líbí příroda a staré hrady."],["Co se vám v Česku nelíbí?","Nelíbí se mi, že je tady často zima a prší."],["Jaká česká města znáte?","Znám Prahu, Brno, Plzeň a Český Krumlov."],["Jací jsou Češi?","Češi jsou podle mě klidní, pracovití a mají rádi pivo."],["Co bylo pro vás v Česku nové?","Nové pro mě bylo, že obchody mají v neděli často zavřeno."],["Které místo v Česku jste navštívil/a jako první?","Jako první jsem navštívil/a Prahu a Karlův most."],["Co jste se v Česku naučil/a?","Naučil/a jsem se česky a třídit odpad."],["Zůstanete v Česku?","Ano, chci tady zůstat a dostat trvalý pobyt."],["Kam byste v Česku chtěl/a ještě jet?","Chtěl/a bych ještě jet na Moravu na víno."]]},{"cz":"Moje země","t":["Моя країна","My country","Моя страна","Đất nước tôi"],"qa":[["Odkud jste?","Jsem z Ukrajiny, z města Záporoží."],["Jaká je vaše země?","Moje země je velká, má moře, hory a velké řeky."],["Co je typické pro vaši zemi?","Typický je boršč, vyšívané košile a lidové písně."],["Jaké je hlavní město vaší země?","Hlavní město je Kyjev, je velké a krásné."],["Jaký je rozdíl mezi Českem a vaší zemí?","Česko je menší a lidé tady mluví tišeji."],["Co vám z vaší země chybí?","Chybí mi rodina, kamarádi a jídlo od maminky."],["Kdy jste byl/a naposledy doma?","Doma jsem byl/a naposledy před dvěma lety."],["Co jste dělal/a ve své zemi o víkendech?","O víkendech jsme jezdili na chatu a k řece."],["Pojedete brzy do své země?","Ano, v létě pojedu navštívit rodiče."],["Co byste ukázal/a Čechovi ve své zemi?","Ukázal/a bych mu moře a staré centrum Oděsy."]]},{"cz":"Plány do budoucna","t":["Плани на майбутнє","Plans for the future","Планы на будущее","Kế hoạch tương lai"],"qa":[["Jaké máte plány na příští rok?","Příští rok chci udělat zkoušku a najít lepší práci."],["Co budete dělat o prázdninách?","O prázdninách pojedeme k moři a potom na chatu."],["Kde budete bydlet za pět let?","Za pět let budu bydlet v Česku, možná v Praze."],["Jakou práci budete dělat v budoucnu?","V budoucnu chci pracovat v kanceláři."],["Chcete se dál učit česky?","Ano, po zkoušce se budu učit dál, chci úroveň B1."],["Co pro to musíte udělat?","Musím víc mluvit, číst a chodit na kurz."],["Co jste plánoval/a minulý rok a povedlo se to?","Minulý rok jsem plánoval/a koupit auto a povedlo se to."],["Co jste už pro své plány udělal/a?","Už jsem si našel/našla kurz a přihlásil/a jsem se na zkoušku."],["Co uděláte hned po zkoušce?","Po zkoušce si odpočinu a oslavím to s rodinou."],["Co byste chtěl/a změnit ve svém životě?","Chtěl/a bych mít víc času na rodinu a sport."]]},{"cz":"Děti a výchova","t":["Діти й виховання","Children","Дети и воспитание","Con cái và nuôi dạy"],"qa":[["Máte děti?","Ano, mám syna, je mu devět let."],["Kam chodí vaše děti do školy?","Syn chodí do základní školy v našem městě."],["Co dělají vaše děti ve volném čase?","Syn hraje fotbal a hraje hry na počítači."],["Chodí vaše dítě na nějaký kroužek?","Ano, chodí na fotbal dvakrát týdně a na angličtinu."],["Kdo vozí děti do školy?","Do školy syna vozí manžel, odpoledne ho vyzvedávám já."],["Jak se vaše dítě učí?","Syn se učí dobře, nejvíc ho baví matematika."],["Co jste dělali s dětmi minulý víkend?","Minulý víkend jsme byli s dětmi v zoo a na zmrzlině."],["Jak jste omluvil/a dítě ze školy, když bylo nemocné?","Napsal/a jsem učitelce zprávu přes aplikaci školy."],["Co budou dělat děti o prázdninách?","O prázdninách pojede syn na tábor a potom k babičce."],["Jakou práci byste chtěl/a pro své dítě?","Chtěl/a bych, aby syn měl zajímavou práci, třeba jako lékař."]]},{"cz":"Sousedé a dům","t":["Сусіди й будинок","Neighbours and the building","Соседи и дом","Hàng xóm và tòa nhà"],"qa":[["Znáte své sousedy?","Znám některé sousedy, zdravíme se na chodbě."],["Jací jsou vaši sousedé?","Moji sousedé jsou milí a tiší, jen jeden má hlučného psa."],["Pomáháte si se sousedy?","Ano, když jsme na dovolené, sousedka nám zalévá květiny."],["Kolik pater má váš dům?","Náš dům má osm pater a výtah."],["Kdo uklízí ve vašem domě?","Chodbu uklízí paní z úklidové firmy jednou týdně."],["Máte nějaký problém v domě?","Někdy nefunguje výtah a musíme chodit pěšky."],["Měl/a jste někdy problém se sousedem?","Jednou sousedé dělali v noci párty a bylo hodně hlučno."],["Co jste udělal/a?","Šel/šla jsem k nim a slušně jsem je poprosil/a, aby byli tišeji."],["Pozvete sousedy na návštěvu?","Ano, na Vánoce pozveme sousedy na cukroví."],["Jaké sousedy byste chtěl/a mít?","Chtěl/a bych sousedy, kteří jsou přátelští a tiší."]]},{"cz":"Auto a řízení","t":["Авто й водіння","Cars and driving","Авто и вождение","Ô tô và lái xe"],"qa":[["Máte řidičský průkaz?","Ano, mám řidičský průkaz už patnáct let."],["Jaké máte auto?","Mám starší Škodu Octavii, je modrá."],["Jak často jezdíte autem?","Autem jezdím každý den do práce a o víkendu na nákup."],["Kolik stojí benzín?","Benzín stojí asi třicet osm korun za litr."],["Kde parkujete?","Parkuju před domem, kde je parkoviště pro obyvatele."],["Kdy jste dělal/a řidičák?","Řidičák jsem dělal/a na Ukrajině, když mi bylo dvacet."],["Měl/a jste někdy nehodu?","Ano, jednou jsem měl/a malou nehodu na parkovišti, nikomu se nic nestalo."],["Zastavila vás někdy policie?","Jednou mě zastavila policie a chtěla vidět doklady."],["Kdy pojedete do servisu?","Do servisu pojedu příští týden přezout pneumatiky na zimu."],["Jaké auto byste si chtěl/a koupit?","Chtěl/a bych si koupit velké rodinné auto."]]},{"cz":"Domácí práce","t":["Домашні справи","Housework","Домашние дела","Việc nhà"],"qa":[["Kdo u vás doma uklízí?","Doma uklízíme všichni, každý má svou práci."],["Co děláte doma nejraději?","Nejraději vařím, nerad/a žehlím."],["Jak často uklízíte?","Velký úklid děláme jednou týdně, v sobotu."],["Co dělají děti doma?","Syn si uklízí pokoj a vynáší odpadky."],["Kdo u vás pere prádlo?","Prádlo pere manželka, já ho věším."],["Třídíte odpad?","Ano, třídíme papír, plast a sklo."],["Co jste dělal/a doma včera?","Včera jsem umyl/a okna a vyluxoval/a jsem."],["Co jste opravoval/a doma naposledy?","Naposledy jsem opravoval/a kapající kohoutek v kuchyni."],["Co musíte doma udělat zítra?","Zítra musím vyžehlit košile a nakoupit."],["Jakou domácí práci byste nechtěl/a dělat?","Nechtěl/a bych mýt nádobí, proto chci myčku."]]},{"cz":"Zdravý životní styl","t":["Здоровий спосіб життя","A healthy lifestyle","Здоровый образ жизни","Lối sống lành mạnh"],"qa":[["Žijete zdravě?","Snažím se žít zdravě, ale ne vždycky to jde."],["Co jíte zdravého?","Jím hodně zeleniny, ovoce a piju vodu."],["Kolik hodin spíte?","Spím asi sedm hodin, ale chtěl/a bych víc."],["Kouříte?","Ne, nekouřím, přestal/a jsem před třemi lety."],["Jak odpočíváte po práci?","Po práci si lehnu, poslouchám hudbu nebo jdu na procházku."],["Kolik chodíte denně pěšky?","Denně chodím asi pět kilometrů, mám to v telefonu."],["Co jste změnil/a, abyste byl/a zdravější?","Přestal/a jsem pít sladké limonády a začal/a jsem plavat."],["Kdy jste naposledy byl/a na preventivní prohlídce?","Na prohlídce jsem byl/a letos v březnu."],["Co pro své zdraví uděláte tento týden?","Tento týden budu chodit spát dřív a nebudu jíst sladké."],["Co je podle vás nejdůležitější pro zdraví?","Podle mě je nejdůležitější dobrý spánek a pohyb."]]},{"cz":"Problémy a pomoc","t":["Проблеми й допомога","Problems and getting help","Проблемы и помощь","Sự cố và nhờ giúp đỡ"],"qa":[["Jaké je číslo na záchrannou službu?","Číslo na záchrannou službu je 155, na policii 158 a evropské číslo 112."],["Komu voláte, když máte problém v bytě?","Když mám problém v bytě, volám majiteli bytu."],["Co děláte, když se ztratíte?","Když se ztratím, podívám se do mapy v telefonu nebo se zeptám lidí."],["Kdo vám pomáhá, když něčemu nerozumíte?","Pomáhá mi kolegyně Češka nebo překladač v telefonu."],["Co děláte, když ztratíte doklady?","Když ztratím doklady, jdu na policii a nahlásím to."],["Volal/a jste někdy záchranku?","Ano, jednou jsem volal/a záchranku, když se babičce udělalo špatně."],["Ztratil/a jste někdy něco důležitého?","Ano, ztratil/a jsem peněženku v autobuse, ale řidič ji našel."],["Kdo vám pomohl, když jste přijel/a do Česka?","Když jsem přijel/a, pomohli mi příbuzní a integrační centrum."],["Co uděláte, když se vám rozbije auto?","Zavolám asistenční službu a odvezou auto do servisu."],["Jak byste pomohl/a člověku, který nemluví česky?","Pomohl/a bych mu přeložit a ukázal/a bych mu cestu."]]},{"cz":"Knihy a čtení","t":["Книжки й читання","Books and reading","Книги и чтение","Sách và đọc"],"qa":[["Čtete rád/a?","Ano, čtu rád/a, hlavně večer před spaním."],["Jaké knihy čtete?","Čtu detektivky a knihy o historii."],["Čtete papírové knihy, nebo v telefonu?","Čtu hlavně v telefonu, ale papírové knihy mám radši."],["Kde si půjčujete knihy?","Knihy si půjčuju v městské knihovně."],["Kolik knih přečtete za rok?","Za rok přečtu asi deset knih."],["Posloucháte audioknihy?","Ano, audioknihy poslouchám v autě cestou do práce."],["Jakou knihu jste četl/a naposledy?","Naposledy jsem četl/a detektivku od Agathy Christie."],["Jakou knihu jste měl/a rád/a jako dítě?","Jako dítě jsem měl/a rád/a pohádky bratří Grimmů."],["Co budete číst příště?","Příště budu číst českou knihu pro začátečníky."],["Jakou knihu byste doporučil/a kamarádovi?","Doporučil/a bych Malého prince, je krátký a moudrý."]]}],"u2":[],"u3":[{"title":"Stěhování","q":"Co včera dělala rodina Novákových?","pictures":["📦 Rodina balí věci do krabic v bytě.","🚚 Muži nosí krabice do velkého auta.","🛋️ V novém bytě dávají gauč a stůl na místo.","🍕 Rodina večer jí pizzu na zemi mezi krabicemi."],"model":"Včera se rodina Novákových stěhovala do nového bytu. Ráno balili všechny věci do krabic. Maminka balila nádobí a děti balily hračky. Potom přijelo velké auto. Dva silní muži nosili krabice a nábytek do auta. Bylo to těžké, ale šlo to rychle. V novém bytě dávali gauč a stůl na místo. Tatínek skládal postele a maminka uklízela kuchyň. Večer byli všichni moc unavení. Neměli čas vařit, tak si objednali pizzu. Jedli ji na zemi mezi krabicemi a smáli se.","om":[["1F4E6"],["1F69A"],["1F6CB"],["1F355"]],"t":["Переїзд","Moving house","Переезд","Chuyển nhà"],"cz":"Stěhování"},{"title":"Výlet na hory","q":"Co dělali v sobotu Petr a Jana?","pictures":["🚆 Ráno sedí ve vlaku a dívají se z okna.","🥾⛰️ Jdou po cestě nahoru na kopec.","🌧️ Začne pršet, nemají deštník.","🏠☕ Sedí v chatě a pijí horký čaj."],"model":"V sobotu jeli Petr a Jana na výlet na hory. Ráno seděli ve vlaku a dívali se z okna. Venku bylo hezky a svítilo slunce. Potom šli pěšky po cestě nahoru na kopec. Cesta byla dlouhá, ale příroda byla krásná. Najednou začalo pršet. Petr a Jana neměli deštník, a proto byli úplně mokří. Nakonec našli malou chatu. Sedli si ke stolu a pili horký čaj. Odpočívali a čekali, až přestane pršet.","om":[["1F686"],["1F97E","26F0"],["1F327"],["1F3E0","2615"]],"t":["Поїздка в гори","A trip to the mountains","Поездка в горы","Chuyến đi lên núi"],"cz":"Výlet na hory"},{"title":"Nehoda na kole","q":"Co se stalo včera panu Tichému?","pictures":["🚲 Muž jede ráno na kole do práce.","🐕💥 Na cestu vyběhne pes a muž spadne z kola.","🚑 Sanitka veze muže do nemocnice.","👨‍⚕️🦴 Lékař dává muži sádru na ruku."],"model":"Včera ráno jel pan Tichý na kole do práce. Bylo hezké počasí a on jel docela rychle. Najednou na cestu vyběhl velký pes. Pan Tichý chtěl zastavit, ale spadl z kola. Bolela ho ruka a nemohl vstát. Lidé na ulici zavolali sanitku. Sanitka přijela za deset minut a odvezla ho do nemocnice. V nemocnici ho vyšetřil lékař. Řekl mu, že má zlomenou ruku, a dal mu sádru. Pan Tichý musel zůstat šest týdnů doma.","om":[["1F6B2"],["1F415","1F4A5"],["1F691"],["1F468-200D-2695-FE0F","1F9B4"]],"t":["Аварія на велосипеді","A bike accident","Авария на велосипеде","Tai nạn xe đạp"],"cz":"Nehoda na kole"},{"title":"Ztracená peněženka","q":"Co se stalo včera panu Dvořákovi?","pictures":["🚌 Pan Dvořák jede ráno autobusem do práce.","👛❌ V práci zjistí, že nemá peněženku.","🏦💳 Volá do banky a blokuje platební kartu.","👮📄 Odpoledne je na policii a hlásí ztrátu dokladů."],"om":[["1F68C"],["1F45B","274C"],["1F3E6","1F4B3"],["1F46E","1F4C4"]],"model":"Včera ráno jel pan Dvořák autobusem do práce. V autobuse bylo hodně lidí. Když přišel do práce, chtěl si koupit kávu, ale zjistil, že nemá peněženku. Byl nervózní, protože v peněžence měl platební kartu, řidičský průkaz a povolení k pobytu. Nejdřív zavolal do banky a kartu zablokoval. Odpoledne šel na policii a nahlásil ztrátu dokladů. Policista napsal protokol. Večer mu zavolali z dopravního podniku, že peněženku někdo našel v autobuse.","t":["Загублений гаманець","A lost wallet","Потерянный кошелёк","Chiếc ví bị mất"],"cz":"Ztracená peněženka"},{"title":"Narozeniny","q":"Co dělala včera Marie?","pictures":["🎂 Marie ráno peče dort v kuchyni.","🎈 Odpoledne zdobí byt balonky.","🎁 Večer přijdou kamarádi s dárky.","🎶 Všichni zpívají a tancují."],"model":"Včera měla Marie narozeniny. Ráno vstala brzy a v kuchyni pekla čokoládový dort. Dort byl velký a moc voněl. Na dort dala jahody a šlehačku. Odpoledne zdobila byt. Dala do obýváku barevné balonky. Potom připravila jídlo a pití. Večer přišli kamarádi. Přinesli Marii dárky a květiny. Marie byla moc ráda. Potom všichni jedli dort, zpívali a tancovali. Oslava skončila až o půlnoci a všichni se měli dobře.","om":[["1F382"],["1F388"],["1F381"],["1F3B6"]],"t":["День народження","A birthday","День рождения","Sinh nhật"],"cz":"Narozeniny"},{"title":"Ztracený klíč","q":"Co se stalo včera panu Vlkovi?","pictures":["🚶 Muž jde večer z práce domů.","🔑❓ Před dveřmi hledá klíč v kapse a nemá ho.","📞 Volá zámečníkovi.","🔧🚪 Zámečník otvírá dveře a muž platí."],"model":"Včera večer šel pan Vlk z práce domů. Byl unavený a těšil se na večeři. Když přišel ke dveřím, hledal klíč. Hledal ho v kapse i v tašce, ale neměl ho. Asi ho zapomněl v práci. Pan Vlk nevěděl, co má dělat. Nakonec zavolal zámečníkovi. Zámečník přijel za půl hodiny. Otevřel dveře za pět minut. Pan Vlk mu musel zaplatit osm set korun a byl smutný.","om":[["1F6B6"],["1F511","2753"],["1F4DE"],["1F527","1F6AA"]],"t":["Загублений ключ","A lost key","Потерянный ключ","Chiếc chìa khóa bị mất"],"cz":"Ztracený klíč"},{"title":"U lékaře","q":"Co se stalo včera Olze?","pictures":["🤒 Olga ráno leží v posteli, je jí špatně.","📞 Volá do ordinace.","👩‍⚕️ Lékařka ji vyšetřuje.","💊 V lékárně kupuje léky."],"model":"Včera ráno se Olga necítila dobře. Ležela v posteli, bolela ji hlava a měla horečku. Do práce nemohla jít. Zavolala do ordinace a objednala se k lékařce. Sestra jí řekla, ať přijde v deset hodin. Lékařka Olgu vyšetřila. Řekla jí, že má chřipku, a napsala jí recept. Potom šla Olga do lékárny. Koupila si léky a čaj. Doma si lehla a celý den odpočívala.","om":[["1F912"],["1F4DE"],["1F469-200D-2695-FE0F"],["1F48A"]],"t":["У лікаря","At the doctor's","У врача","Ở chỗ bác sĩ"],"cz":"U lékaře"},{"title":"Pracovní den","q":"Co dělal včera Ivan?","pictures":["⏰ Ivan vstává ve čtyři ráno.","🏭 Ve skladu nakládá krabice.","🍽️ V poledne obědvá s kolegy.","🛋️ Večer odpočívá doma a dívá se na televizi."],"model":"Včera vstal Ivan už ve čtyři hodiny ráno. Rychle se oblékl, vypil kávu a jel do práce. Pracuje ve velkém skladu. Celé dopoledne nakládal těžké krabice do kamionu. Práce byla náročná, ale šla dobře. V poledne obědval s kolegy v jídelně. Dal si polévku a guláš. Povídali si o fotbale. Večer byl Ivan moc unavený. Odpočíval doma na gauči a díval se na televizi.","om":[["23F0"],["1F3ED"],["1F37D"],["1F6CB"]],"t":["Робочий день","A working day","Рабочий день","Một ngày làm việc"],"cz":"Pracovní den"},{"title":"Na úřadě","q":"Co dělal včera pan Kovač?","pictures":["🏛️ Pan Kovač čeká ve frontě na úřadě.","📝 Vyplňuje formulář.","📷 Fotí se na nový doklad.","🪪 Úřednice mu dává potvrzení."],"model":"Včera šel pan Kovač na úřad, protože potřeboval nový doklad. Na úřadě bylo hodně lidí. Musel dlouho čekat ve frontě, skoro hodinu. Potom vyplnil formulář. Napsal tam svoje jméno, adresu a datum narození. Některé věci nevěděl, tak se zeptal úřednice. Potom se musel vyfotit na nový doklad. Fotka byla hotová hned. Nakonec mu úřednice dala potvrzení. Řekla mu, že si doklad může vyzvednout za měsíc.","om":[["1F3DB"],["1F4DD"],["1F4F7"],["1FAAA"]],"t":["В установі","At the office","В учреждении","Ở cơ quan"],"cz":"Na úřadě"},{"title":"Vánoce","q":"Co dělala rodina Petrenkových na Štědrý den?","pictures":["🎄 Ráno zdobí stromeček.","🍪 Odpoledne pečou cukroví.","🐟🥔 Večer jedí kapra s bramborovým salátem.","🎁 Pod stromečkem rozbalují dárky."],"model":"Na Štědrý den byla rodina Petrenkových celý den doma. Ráno zdobili vánoční stromeček. Děti dávaly na stromeček koule a světýlka. Odpoledne pekli cukroví. Maminka dělala těsto a děti vykrajovaly hvězdičky. Celý byt krásně voněl. Večer jedli kapra s bramborovým salátem. Byla to tradiční česká večeře. Potom šli ke stromečku a rozbalovali dárky. Děti dostaly nové hračky a knihy. Všichni byli moc šťastní a večer zpívali koledy.","om":[["1F384"],["1F36A"],["1F41F","1F954"],["1F381"]],"t":["Різдво","Christmas","Рождество","Giáng sinh"],"cz":"Vánoce"},{"title":"Nehoda na parkovišti","q":"Co se stalo včera paní Novotné?","pictures":["🚗🛒 Paní Novotná přijede autem na parkoviště u supermarketu.","💥🚙 Když couvá, narazí do jiného auta.","📞👮 Volá policii.","📝🪪 S majitelem druhého auta vyplňují formulář pro pojišťovnu."],"om":[["1F697","1F6D2"],["1F4A5","1F698"],["1F4DE","1F46E"],["1F4DD","1FAAA"]],"model":"Včera odpoledne jela paní Novotná autem na nákup. Přijela na parkoviště u supermarketu. Když potom couvala, neviděla jiné auto a narazila do něj. Auto mělo rozbité světlo. Paní Novotná byla vyděšená, ale nikomu se nic nestalo. Majitel druhého auta byl naštvaný. Paní Novotná zavolala policii. Policie přijela za dvacet minut a zkontrolovala doklady. Nakonec paní Novotná a majitel druhého auta vyplnili formulář pro pojišťovnu a odjeli domů.","t":["ДТП на парковці","An accident in a car park","ДТП на парковке","Va chạm ở bãi đỗ xe"],"cz":"Nehoda na parkovišti"},{"title":"Záchranka","q":"Co se stalo včera babičce?","pictures":["👵🏠 Babička je doma a v kuchyni upadne.","📱 Vnuk volá na číslo 155.","🚑 Za deset minut přijede sanitka.","🏥🧑‍⚕️ V nemocnici lékař babičku vyšetří."],"om":[["1F475","1F3E0"],["1F4F1"],["1F691"],["1F3E5","1F468-200D-2695-FE0F"]],"model":"Včera dopoledne byla babička doma a vařila oběd. V kuchyni byla mokrá podlaha a babička upadla. Bolela ji noha a nemohla vstát. Naštěstí byl doma vnuk. Hned zavolal na číslo 155 a řekl, co se stalo a kde bydlí. Za deset minut přijela sanitka. Záchranáři babičku odvezli do nemocnice. V nemocnici ji lékař vyšetřil a udělal rentgen. Noha nebyla zlomená, jen naražená. Večer mohla babička jet domů.","t":["Швидка допомога","The ambulance","Скорая помощь","Xe cấp cứu"],"cz":"Záchranka"},{"title":"Nový byt","q":"Co dělali minulý týden Ivan a Olena?","pictures":["💻 Hledají byt na internetu.","🏢 Prohlížejí byt s majitelem.","✍️ Podepisují nájemní smlouvu.","🔑😊 Dostávají klíče a jsou šťastní."],"model":"Minulý týden hledali Ivan a Olena nový byt. Večer seděli u počítače a hledali byt na internetu. Našli hezký byt blízko centra. Potom šli na prohlídku. Majitel jim ukázal kuchyň, ložnici a balkon. Byt se jim moc líbil, protože byl světlý a čistý. Druhý den podepsali nájemní smlouvu. Zaplatili kauci a první nájem. Nakonec od majitele dostali klíče. Byli moc šťastní, protože konečně měli vlastní bydlení.","om":[["1F4BB"],["1F3E2"],["270D"],["1F511","1F60A"]],"t":["Нова квартира","A new flat","Новая квартира","Căn hộ mới"],"cz":"Nový byt"},{"title":"Zkouška z češtiny","q":"Co dělala minulý měsíc Oksana?","pictures":["📖 Oksana se večer učí česky.","🏫 Jde na zkoušku do jazykové školy.","✍️ Píše test.","🎉📜 Dostane certifikát a slaví s rodinou."],"model":"Minulý měsíc dělala Oksana zkoušku z češtiny. Každý večer se učila česky. Četla texty, poslouchala nahrávky a psala e-maily. V sobotu ráno šla na zkoušku do jazykové školy. Byla trochu nervózní. Nejdřív psala test, čtení, psaní a poslech. Test byl těžký, ale zvládla ho. Za měsíc dostala certifikát, že zkoušku udělala. Byla moc ráda a hned zavolala manželovi. Večer to oslavila s rodinou v restauraci.","om":[["1F4D6"],["1F3EB"],["270D"],["1F389","1F4DC"]],"t":["Іспит з чеської","The Czech exam","Экзамен по чешскому","Kỳ thi tiếng Séc"],"cz":"Zkouška z češtiny"},{"title":"Oprava kola","q":"Co dělal v sobotu Matvij s tátou?","pictures":["🚲💨 Kolo má prázdnou pneumatiku.","🛒 Táta a syn kupují v obchodě novou duši.","🔧 Spolu opravují kolo před domem.","🚴‍♂️😄 Syn jede na kole a je šťastný."],"model":"V sobotu chtěl Matvij jet na kole, ale kolo mělo prázdnou pneumatiku. Byl smutný, protože nemohl jet. Řekl to tátovi. Táta a Matvij šli do obchodu se sportovními potřebami. Koupili tam novou duši a pumpičku. Potom spolu opravovali kolo před domem. Táta vyměnil duši a Matvij pumpoval pneumatiku. Nakonec bylo kolo v pořádku. Matvij jel na kole po ulici. Byl moc šťastný a poděkoval tátovi.","om":[["1F6B2","1F4A8"],["1F6D2"],["1F527"],["1F6B4-200D-2642-FE0F","1F604"]],"t":["Ремонт велосипеда","Fixing a bike","Ремонт велосипеда","Sửa xe đạp"],"cz":"Oprava kola"},{"title":"Voda v koupelně","q":"Co se stalo včera paní Horákové?","pictures":["🚿 Paní Horáková se ráno chce osprchovat.","⚠️🛁 Z trubky v koupelně teče voda na zem.","📞🏠 Volá majiteli bytu.","🔧👷 Odpoledne přijde instalatér a trubku opraví."],"om":[["1F6BF"],["26A0","1F6C1"],["1F4DE","1F3E0"],["1F527","1F477"]],"model":"Včera ráno se paní Horáková chtěla osprchovat. Když přišla do koupelny, viděla, že z trubky teče voda na zem. Rychle zavřela vodu a ručníkem utírala podlahu. Bála se, že voda poteče k sousedům dolů. Potom zavolala majiteli bytu a všechno mu vysvětlila. Majitel slíbil, že pošle instalatéra. Odpoledne instalatér přišel a trubku opravil. Paní Horáková musela jít do práce později, ale byla ráda, že je všechno v pořádku.","t":["Вода у ванній","Water in the bathroom","Вода в ванной","Nước trong phòng tắm"],"cz":"Voda v koupelně"},{"title":"Návštěva babičky","q":"Co dělali v neděli Lukáš a jeho máma?","pictures":["🚌 Jedou autobusem na vesnici.","👵🤗 Babička je vítá u domu.","🥧 Spolu jedí koláč na zahradě.","🍎🧺 Sbírají jablka ze stromu."],"model":"V neděli jeli Lukáš a jeho máma za babičkou. Jeli autobusem na vesnici, cesta trvala hodinu. Lukáš se díval z okna na pole a lesy. Babička je čekala před domem. Když je viděla, objala je a byla moc ráda. Potom šli na zahradu. Babička upekla jablečný koláč. Všichni ho jedli a pili čaj. Odpoledne sbírali jablka ze stromu. Lukáš si odvezl domů plnou tašku jablek.","om":[["1F68C"],["1F475","1F917"],["1F967"],["1F34E","1F9FA"]],"t":["У гостях у бабусі","Visiting grandma","В гостях у бабушки","Thăm bà"],"cz":"Návštěva babičky"},{"title":"Stěhování do Česka","q":"Jak se rodina Kovalenkových stěhovala do Česka?","pictures":["🧳 Balí kufry na Ukrajině.","🚌 Jedou dlouho autobusem.","🏢 Přijedou do Kralup a vidí nový byt.","🏫 Syn jde první den do české školy."],"model":"Rodina Kovalenkových se stěhovala z Ukrajiny do Česka. Doma balili kufry. Vzali si oblečení, doklady a pár hraček pro syna. Potom jeli autobusem do Česka. Cesta byla dlouhá, trvala skoro dva dny. Všichni byli unavení. Nakonec přijeli do Kralup. Uviděli svůj nový byt, byl malý, ale hezký. Za týden šel syn poprvé do české školy. Byl nervózní, ale učitelka byla milá a den byl dobrý.","om":[["1F9F3"],["1F68C"],["1F3E2"],["1F3EB"]],"t":["Переїзд до Чехії","Moving to Czechia","Переезд в Чехию","Chuyển đến Séc"],"cz":"Stěhování do Česka"},{"title":"Policejní kontrola","q":"Co se stalo včera večer panu Novákovi?","pictures":["🚗🌙 Pan Novák jede večer autem z práce domů.","🚓👮 Policie ho zastaví na silnici.","🪪📄 Policista chce vidět řidičský průkaz a doklady od auta.","💶 Pan Novák jel moc rychle a platí pokutu."],"om":[["1F697","1F319"],["1F693","1F46E"],["1FAAA","1F4C4"],["1F4B6"]],"model":"Včera večer jel pan Novák autem z práce domů. Byl unavený a spěchal, protože chtěl vidět fotbal. Na silnici za městem ho zastavila policie. Policista řekl dobrý večer a chtěl vidět řidičský průkaz, technický průkaz a pojištění. Pan Novák mu všechno ukázal. Potom mu policista řekl, že jel moc rychle, místo padesáti jel sedmdesát. Pan Novák musel zaplatit pokutu tisíc korun. Domů už jel pomalu a fotbal viděl jen v televizi.","t":["Поліцейська перевірка","A police check","Полицейская проверка","Cảnh sát kiểm tra"],"cz":"Policejní kontrola"},{"title":"Den zkoušky","q":"Co dělal Andrij v den zkoušky?","pictures":["⏰☕ Ráno vstává a pije kávu.","🚆 Jede vlakem do školy.","📝 Píše test ve třídě.","🗣️👩‍🏫 Mluví s examinátorkou a usmívá se."],"model":"V den zkoušky vstal Andrij brzy ráno. Vypil kávu a ještě jednou si zopakoval slovíčka. Byl trochu nervózní, ale věřil si, protože se dlouho učil. Potom jel vlakem do jazyk <script>
(function(){

$('#backLink').textContent = t('back'); $('#backLink').href = '/zkouska-a2/' + (lang === 'uk' ? '' : lang + '/');

function isDark(){ const a = document.documentElement.getAttribute('data-theme'); return a ? a === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); }
function themeUI(){ const b = $('#themeBtn'), d = isDark(); b.textContent = d ? '☀️' : '🌙'; b.title = d ? t('themeL') : t('themeD'); b.setAttribute('aria-label', b.title); }
$('#themeBtn').addEventListener('click', () => { const v = isDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', v); try{ localStorage.setItem('a2-theme', v); }catch(e){} themeUI(); });
themeUI();

/* progress */
