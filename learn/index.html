"Ресторан и кафе","Nhà hàng và quán cà phê"],"qa":[["Chodíte do restaurace?","Do restaurace chodím asi jednou za měsíc."],["S kým chodíte do restaurace?","Do restaurace chodím s rodinou nebo s kolegy z práce."],["Co si v restauraci obvykle objednáte?","Obvykle si objednám polévku a hlavní jídlo, třeba řízek."],["Co pijete v kavárně?","V kavárně piju cappuccino nebo čaj."],["Kolik stojí oběd v restauraci?","Polední menu stojí asi sto padesát až dvě stě korun."],["Dáváte v restauraci spropitné?","Ano, obvykle dám deset procent spropitné."],["Kdy jste byl/a naposledy v restauraci?","Naposledy jsem byl/a v restauraci minulou sobotu na narozeninách."],["Co jste tam jedl/a?","Jedl/a jsem pizzu a pil/a jsem limonádu."],["Kam půjdete příště na večeři?","Příště půjdeme do nové italské restaurace na náměstí."],["Jakou restauraci byste doporučil/a kamarádovi?","Doporučil/a bych malou restauraci u řeky, protože tam dobře vaří."]]},{"cz":"Nakupování","t":["Покупки","Shopping","Покупки","Mua sắm"],"qa":[["Kde nakupujete?","Nakupuju v supermarketu blízko domu."],["Jak často nakupujete?","Velký nákup dělám jednou týdně, v sobotu."],["Co kupujete nejčastěji?","Nejčastěji kupuju chleba, mléko, ovoce a zeleninu."],["Platíte kartou, nebo hotově?","Většinou platím kartou, je to rychlejší."],["Nakupujete na internetu?","Ano, na internetu kupuju oblečení a elektroniku."],["Kdo u vás doma nakupuje?","Nakupujeme spolu s manželem, on nosí tašky."],["Co jste naposledy koupil/a?","Naposledy jsem koupil/a nové boty na zimu."],["Kolik jste za to zaplatil/a?","Zaplatil/a jsem tisíc dvě stě korun, byly ve slevě."],["Co budete kupovat tento týden?","Tento týden budu kupovat dárek pro dceru."],["Co byste si koupil/a, kdybyste měl/a hodně peněz?","Koupil/a bych si nové auto a velký byt."]]},{"cz":"Oblečení","t":["Одяг","Clothes","Одежда","Quần áo"],"qa":[["Co máte dnes na sobě?","Dnes mám na sobě džíny, modrý svetr a sportovní boty."],["Jaké oblečení nosíte do práce?","Do práce nosím pracovní kalhoty a tričko."],["Jakou barvu máte nejraději?","Nejraději mám modrou a černou barvu."],["Kde kupujete oblečení?","Oblečení kupuju v obchodním centru nebo na internetu."],["Co nosíte v zimě?","V zimě nosím teplou bundu, čepici, šálu a rukavice."],["Nosíte rád/a elegantní oblečení?","Elegantní oblečení nosím jen na svatbu nebo do divadla."],["Co jste si naposledy koupil/a na sebe?","Naposledy jsem si koupil/a zimní bundu."],["Co jste měl/a na sobě na poslední oslavě?","Na poslední oslavě jsem měl/a černé šaty a nové boty."],["Co si koupíte na jaro?","Na jaro si koupím lehkou bundu a nové tenisky."],["Jaké oblečení byste nikdy nenosil/a?","Nikdy bych nenosil/a moc barevné oblečení, nelíbí se mi."]]},{"cz":"Počasí a roční období","t":["Погода й пори року","Weather and seasons","Погода и времена года","Thời tiết và các mùa"],"qa":[["Jaké je dnes počasí?","Dnes je zima a prší, je asi pět stupňů."],["Jaké roční období máte nejraději?","Nejraději mám léto, protože je teplo a dlouhé dny."],["Co děláte, když prší?","Když prší, jsem doma, čtu nebo se dívám na film."],["Jaké je počasí v Česku v zimě?","V zimě je v Česku zima, někdy sněží a mrzne."],["Jaké je počasí ve vaší zemi v létě?","V mé zemi je v létě velké horko, až třicet pět stupňů."],["Díváte se na předpověď počasí?","Ano, dívám se na předpověď v telefonu každé ráno."],["Jaké bylo počasí minulý víkend?","Minulý víkend bylo krásně, svítilo slunce."],["Co jste dělal/a minulou zimu?","Minulou zimu jsme jezdili na sáňkách a stavěli sněhuláka."],["Jaké bude počasí zítra?","Zítra bude podle předpovědi slunečno a teplo."],["Kde byste chtěl/a žít kvůli počasí?","Kvůli počasí bych chtěl/a žít u moře, kde je teplo."]]},{"cz":"Zdraví a lékař","t":["Здоров'я й лікар","Health and the doctor","Здоровье и врач","Sức khỏe và bác sĩ"],"qa":[["Jak se cítíte?","Dnes se cítím dobře, nic mě nebolí."],["Máte praktického lékaře?","Ano, mám praktického lékaře blízko domu."],["Jak často chodíte k lékaři?","K lékaři chodím jednou za rok na prohlídku."],["Co děláte, když jste nemocný/á?","Když jsem nemocný/á, zůstanu doma, piju čaj a beru léky."],["Máte zdravotní pojištění?","Ano, mám zdravotní pojištění u VZP."],["Kdy jste byl/a naposledy nemocný/á?","Naposledy jsem byl/a nemocný/á v zimě, měl/a jsem chřipku."],["Co vám lékař řekl?","Lékař mi řekl, že musím být týden doma a brát antibiotika."],["Byl/a jste někdy v nemocnici?","Ano, před rokem jsem byl/a v nemocnici, protože jsem měl/a zlomenou ruku."],["Kdy půjdete k zubaři?","K zubaři půjdu příští měsíc na kontrolu."],["Co byste udělal/a pro své zdraví?","Pro zdraví bych chtěl/a víc chodit pěšky a jíst méně sladkého."]]},{"cz":"Doprava ve městě","t":["Транспорт у місті","Getting around town","Транспорт в городе","Giao thông trong thành phố"],"qa":[["Jak jezdíte do práce?","Do práce jezdím autobusem, někdy na kole."],["Máte auto?","Ano, máme jedno auto, ale ve městě jezdím autobusem."],["Kolik stojí jízdenka na autobus?","Jízdenka stojí asi třicet korun, mám měsíční kupón."],["Kde si kupujete jízdenky?","Jízdenky si kupuju v aplikaci v telefonu."],["Jak dlouho trvá cesta do centra?","Cesta do centra trvá asi dvacet minut tramvají."],["Jezdíte rád/a metrem?","Ano, metro je rychlé, ale ráno je tam hodně lidí."],["Měl/a jste někdy problém v MHD?","Jednou jsem zapomněl/a jízdenku a musel/a jsem zaplatit pokutu."],["Jak jste dnes přijel/a sem?","Dnes jsem přijel/a vlakem a potom jsem šel/šla pěšky."],["Budete si kupovat auto?","Ano, příští rok si koupím malé auto."],["Co byste zlepšil/a v dopravě ve vašem městě?","Zlepšil/a bych autobusy večer, protože jezdí málo."]]},{"cz":"Cestování a dovolená","t":["Подорожі й відпустка","Travel and holidays","Путешествия и отпуск","Du lịch và kỳ nghỉ"],"qa":[["Rád/a cestujete?","Ano, cestuju rád/a, poznávám nová místa."],["Jak nejraději cestujete?","Nejraději cestuju autem, protože můžu zastavit, kde chci."],["Kam jezdíte na dovolenou?","Na dovolenou jezdíme k moři nebo na hory."],["Kolik dní trvá vaše dovolená?","Naše dovolená trvá obvykle deset dní."],["Co si berete na cestu?","Na cestu si beru pas, peníze, telefon a oblečení."],["Kde jste byl/a na poslední dovolené?","Na poslední dovolené jsem byl/a v Itálii u moře."],["Co jste tam dělal/a?","Koupal/a jsem se, jedl/a jsem pizzu a prohlížel/a jsem si město."],["Jaká byla vaše nejhorší cesta?","Nejhorší cesta byla, když se nám rozbilo auto na dálnici."],["Kam pojedete příští léto?","Příští léto pojedeme do Chorvatska na dva týdny."],["Kterou zemi byste chtěl/a navštívit a proč?","Chtěl/a bych navštívit Japonsko, protože má zajímavou kulturu."]]},{"cz":"Svátky a oslavy","t":["Свята й урочистості","Holidays and celebrations","Праздники и торжества","Ngày lễ và lễ kỷ niệm"],"qa":[["Jaký svátek máte nejraději?","Nejraději mám Vánoce, protože je celá rodina spolu."],["Jak slavíte Vánoce?","Na Vánoce zdobíme stromeček, vaříme a dáváme si dárky."],["Co jíte na Štědrý den?","Na Štědrý den jíme kapra s bramborovým salátem."],["Jaké české svátky znáte?","Znám Vánoce, Velikonoce a Den české státnosti."],["Jaký je typický svátek ve vaší zemi?","V mé zemi je důležitý svátek Velikonoce, pečeme velikonoční chleba."],["Jak jste slavil/a minulý Silvestr?","Minulý Silvestr jsme byli u kamarádů a o půlnoci jsme se dívali na ohňostroj."],["Kdy jste měl/a velkou oslavu?","Velkou oslavu jsme měli na svatbě mého bratra loni v létě."],["Dáváte dárky na Velikonoce?","Dětem dáváme čokoládová vajíčka a malé dárky."],["Jak budete slavit letošní Vánoce?","Letošní Vánoce budeme slavit doma, přijedou moji rodiče."],["Jaký svátek byste chtěl/a zažít v jiné zemi?","Chtěl/a bych zažít karneval v Itálii."]]},{"cz":"Narozeniny","t":["День народження","Birthdays","День рождения","Sinh nhật"],"qa":[["Kdy máte narozeniny?","Narozeniny mám čtrnáctého října."],["Jak slavíte narozeniny?","Narozeniny slavím doma s rodinou a kamarády."],["Co dostáváte k narozeninám?","K narozeninám dostávám knihy, oblečení nebo kosmetiku."],["Co dáváte kamarádům k narozeninám?","Kamarádům dávám víno, květiny nebo dárkový poukaz."],["Pečete na narozeniny dort?","Ano, na narozeniny peču čokoládový dort."],["Jak jste slavil/a poslední narozeniny?","Poslední narozeniny jsem slavil/a v restauraci s rodinou."],["Jaký byl váš nejlepší dárek?","Nejlepší dárek byl výlet do Paříže od manžela."],["Kdy jste byl/a naposledy na narozeninové oslavě?","Minulý týden jsem byl/a na oslavě kolegyně v práci."],["Jak oslavíte příští narozeniny?","Příští narozeniny oslavím na chatě s kamarády."],["Jaký dárek byste chtěl/a dostat?","Chtěl/a bych dostat nový telefon nebo kolo."]]},{"cz":"Kultura","t":["Культура","Culture","Культура","Văn hóa"],"qa":[["Chodíte do kina?","Do kina chodím asi jednou za dva měsíce."],["Jaké filmy máte rád/a?","Mám rád/a komedie a dobrodružné filmy."],["Byl/a jste někdy v divadle?","Ano, byl/a jsem v Národním divadle na opeře."],["Chodíte na koncerty?","Na koncerty chodím jen někdy, když hraje moje oblíbená skupina."],["Jaká je vaše oblíbená kniha?","Moje oblíbená kniha je Malý princ."],["Znáte nějakého českého umělce?","Znám spisovatele Karla Čapka a malíře Alfonse Muchu."],["Jaký film jste viděl/a naposledy?","Naposledy jsem viděl/a českou pohádku Tři oříšky pro Popelku."],["Jak se vám ten film líbil?","Film se mi moc líbil, byl hezký a vtipný."],["Kam půjdete příště za kulturou?","Příště půjdeme na výstavu do muzea v Praze."],["Na jaký koncert byste chtěl/a jít?","Chtěl/a bych jít na koncert vážné hudby do Rudolfina."]]},{"cz":"Televize a internet","t":["Телебачення й інтернет","TV and the internet","Телевидение и интернет","Truyền hình và internet"],"qa":[["Díváte se na televizi?","Na televizi se dívám večer asi hodinu."],["Jaké pořady sledujete?","Sleduju zprávy, sport a kuchařské pořady."],["Jak často používáte internet?","Internet používám každý den v telefonu."],["Na co používáte internet?","Na internetu čtu zprávy, píšu zprávy rodině a nakupuju."],["Používáte sociální sítě?","Ano, používám Facebook a Viber, abych mluvil/a s rodinou."],["Kolik času trávíte na telefonu?","Na telefonu trávím asi dvě hodiny denně, je to moc."],["Co jste naposledy hledal/a na internetu?","Naposledy jsem hledal/a informace o zkoušce z češtiny."],["Jaký seriál jste viděl/a naposledy?","Naposledy jsem viděl/a český seriál o nemocnici."],["Budete se dívat dnes na televizi?","Dnes večer se budu dívat na fotbal."],["Mohl/a byste žít bez internetu?","Bez internetu bych mohl/a žít, ale bylo by to těžké."]]},{"cz":"Telefon a technika","t":["Телефон і техніка","Phone and gadgets","Телефон и техника","Điện thoại và thiết bị"],"qa":[["Jaký máte telefon?","Mám telefon Samsung, je dva roky starý."],["K čemu používáte telefon?","Telefon používám na volání, zprávy, fotky a mapy."],["Máte doma počítač?","Ano, máme doma notebook, používají ho hlavně děti."],["Jaké aplikace používáte nejčastěji?","Nejčastěji používám Viber, mapy a aplikaci banky."],["Umíte opravit počítač?","Ne, neumím, když se něco rozbije, volám servis."],["Kolik stojí dobrý telefon?","Dobrý telefon stojí asi deset tisíc korun."],["Kdy jste koupil/a svůj telefon?","Telefon jsem koupil/a před dvěma lety v obchodě s elektronikou."],["Rozbil se vám někdy telefon?","Ano, minulý rok mi spadl a rozbil se displej."],["Koupíte si brzy nový telefon?","Ano, na Vánoce si koupím nový telefon."],["Jakou techniku byste chtěl/a mít doma?","Chtěl/a bych mít myčku nádobí, ušetřila by mi čas."]]},{"cz":"Úřady","t":["Установи й документи","Offices and paperwork","Учреждения и документы","Cơ quan và giấy tờ"],"qa":[["Na jakém úřadě jste byl/a v Česku?","Byl/a jsem na odboru azylové a migrační politiky a na městském úřadě."],["Proč chodíte na úřad?","Na úřad chodím kvůli pobytu, dokladům nebo změně adresy."],["Je pro vás těžké mluvit na úřadě česky?","Je to těžké, protože úředníci mluví rychle a používají těžká slova."],["Jak se objednáváte na úřad?","Na úřad se objednávám přes internet nebo telefonem."],["Jaké doklady máte?","Mám pas, povolení k pobytu a řidičský průkaz."],["Kdy jste byl/a naposledy na úřadě?","Naposledy jsem byl/a na úřadě minulý měsíc kvůli prodloužení pobytu."],["Jak dlouho jste tam čekal/a?","Čekal/a jsem asi hodinu, bylo tam hodně lidí."],["Kdo vám pomáhá s formuláři?","S formuláři mi pomáhá kolegyně Češka nebo integrační centrum."],["Kdy budete žádat o trvalý pobyt?","O trvalý pobyt budu žádat příští rok, až udělám zkoušku."],["Co byste na úřadech změnil/a?","Chtěl/a bych, aby bylo víc informací v jiných jazycích."]]},{"cz":"Banka a peníze","t":["Банк і гроші","Banking and money","Банк и деньги","Ngân hàng và tiền bạc"],"qa":[["Máte účet v české bance?","Ano, mám účet v bance, kterou mám blízko domu."],["Jak platíte v obchodě?","V obchodě platím kartou nebo telefonem."],["Používáte internetové bankovnictví?","Ano, platby dělám v aplikaci v telefonu."],["Spoříte peníze?","Ano, každý měsíc spořím trochu peněz na dovolenou."],["Na co nejvíc utrácíte?","Nejvíc utrácím za nájem a za jídlo."],["Posíláte peníze domů?","Někdy posílám peníze rodičům na Ukrajinu."],["Kdy jste si založil/a účet?","Účet jsem si založil/a hned první měsíc v Česku."],["Ztratil/a jste někdy kartu?","Ano, jednou jsem ji ztratil/a a hned jsem ji zablokoval/a."],["Na co budete šetřit?","Budu šetřit na auto a na studium dětí."],["Co byste udělal/a, kdybyste vyhrál/a milion?","Koupil/a bych byt a část peněz bych dal/a rodině."]]},{"cz":"Pošta a služby","t":["Пошта й послуги","Post office and services","Почта и услуги","Bưu điện và dịch vụ"],"qa":[["Chodíte na poštu?","Na poštu chodím jen někdy, když posílám balík."],["Co posíláte poštou?","Poštou posílám balíky rodině a dopisy na úřad."],["Kde si vyzvedáváte balíky?","Balíky si vyzvedávám ve výdejním boxu u obchodu."],["Chodíte ke kadeřníkovi?","Ke kadeřníkovi chodím jednou za dva měsíce."],["Kolik stojí střih u kadeřníka?","Pánský střih stojí asi tři sta korun."],["Kdo vám opravuje auto?","Auto mi opravuje autoservis v našem městě."],["Kdy jste naposledy posílal/a balík?","Minulý týden jsem posílal/a balík babičce na Ukrajinu."],["Měl/a jste někdy problém se službou?","Ano, jednou mi čistírna zničila košili a musel/a jsem reklamovat."],["Kdy půjdete ke kadeřníkovi?","Ke kadeřníkovi půjdu v pátek odpoledne."],["Jakou službu byste chtěl/a mít blízko domu?","Chtěl/a bych mít blízko domu poštu, protože je daleko."]]},{"cz":"Příroda a výlety","t":["Природа й прогулянки","Nature and trips","Природа и прогулки","Thiên nhiên và dã ngoại"],"qa":[["Máte rád/a přírodu?","Ano, přírodu mám moc rád/a, uklidňuje mě."],["Kam chodíte do přírody?","Chodím do lesa za městem a k řece."],["Jezdíte na výlety?","Na výlety jezdíme skoro každý měsíc."],["Co si berete na výlet?","Na výlet si beru vodu, svačinu, mapu a deštník."],["Jaké místo v Česku se vám líbí?","Líbí se mi Český ráj, jsou tam krásné skály."],["Kde jste byl/a na posledním výletě?","Na posledním výletě jsme byli na Šumavě."],["Co jste tam viděl/a?","Viděl/a jsem jezero, velké lesy a jelena."],["Sbíráte houby?","Ano, na podzim sbíráme houby, loni jsme jich našli hodně."],["Kam pojedete na příští výlet?","Na příští výlet pojedeme do Krkonoš."],["Kde byste chtěl/a strávit týden v přírodě?","Týden bych chtěl/a strávit na horách ve stanu."]]},{"cz":"Zvířata","t":["Тварини","Animals","Животные","Động vật"],"qa":[["Máte doma zvíře?","Ano, máme psa, jmenuje se Bobík."],["Jaké zvíře máte nejraději?","Nejraději mám psy, protože jsou věrní."],["Kdo se stará o vašeho psa?","O psa se stará hlavně syn, chodí s ním ven."],["Kolikrát denně chodíte se psem ven?","Se psem chodíme ven třikrát denně."],["Co jí vaše zvíře?","Náš pes jí granule a někdy maso."],["Měl/a jste zvíře jako dítě?","Jako dítě jsem měl/a kočku a králíka."],["Kdy jste byl/a naposledy v zoo?","V zoo jsme byli loni na jaře v Praze."],["Jaké zvíře se vám v zoo líbilo?","V zoo se mi nejvíc líbili sloni a žirafy."],["Budete si pořizovat další zvíře?","Ne, další zvíře si pořizovat nebudeme, byt je malý."],["Jaké zvíře byste chtěl/a mít?","Chtěl/a bych mít koně, ale potřebuju velkou zahradu."]]},{"cz":"Česko","t":["Чехія","The Czech Republic","Чехия","Cộng hòa Séc"],"qa":[["Jak se vám líbí v Česku?","V Česku se mi líbí, je tady klid a pořádek."],["Co se vám v Česku líbí nejvíc?","Nejvíc se mi líbí příroda a staré hrady."],["Co se vám v Česku nelíbí?","Nelíbí se mi, že je tady často zima a prší."],["Jaká česká města znáte?","Znám Prahu, Brno, Plzeň a Český Krumlov."],["Jací jsou Češi?","Češi jsou podle mě klidní, pracovití a mají rádi pivo."],["Co bylo pro vás v Česku nové?","Nové pro mě bylo, že obchody mají v neděli často zavřeno."],["Které místo v Česku jste navštívil/a jako první?","Jako první jsem navštívil/a Prahu a Karlův most."],["Co jste se v Česku naučil/a?","Naučil/a jsem se česky a třídit odpad."],["Zůstanete v Česku?","Ano, chci tady zůstat a dostat trvalý pobyt."],["Kam byste v Česku chtěl/a ještě jet?","Chtěl/a bych ještě jet na Moravu na víno."]]},{"cz":"Moje země","t":["Моя країна","My country","Моя страна","Đất nước tôi"],"qa":[["Odkud jste?","Jsem z Ukrajiny, z města Záporoží."],["Jaká je vaše země?","Moje země je velká, má moře, hory a velké řeky."],["Co je typické pro vaši zemi?","Typický je boršč, vyšívané košile a lidové písně."],["Jaké je hlavní město vaší země?","Hlavní město je Kyjev, je velké a krásné."],["Jaký je rozdíl mezi Českem a vaší zemí?","Česko je menší a lidé tady mluví tišeji."],["Co vám z vaší země chybí?","Chybí mi rodina, kamarádi a jídlo od maminky."],["Kdy jste byl/a naposledy doma?","Doma jsem byl/a naposledy před dvěma lety."],["Co jste dělal/a ve své zemi o víkendech?","O víkendech jsme jezdili na chatu a k řece."],["Pojedete brzy do své země?","Ano, v létě pojedu navštívit rodiče."],["Co byste ukázal/a Čechovi ve své zemi?","Ukázal/a bych mu moře a staré centrum Oděsy."]]},{"cz":"Plány do budoucna","t":["Плани на майбутнє","Plans for the future","Планы на будущее","Kế hoạch tương lai"],"qa":[["Jaké máte plány na příští rok?","Příští rok chci udělat zkoušku a najít lepší práci."],["Co budete dělat o prázdninách?","O prázdninách pojedeme k moři a potom na chatu."],["Kde budete bydlet za pět let?","Za pět let budu bydlet v Česku, možná v Praze."],["Jakou práci budete dělat v budoucnu?","V budoucnu chci pracovat v kanceláři."],["Chcete se dál učit česky?","Ano, po zkoušce se budu učit dál, chci úroveň B1."],["Co pro to musíte udělat?","Musím víc mluvit, číst a chodit na kurz."],["Co jste plánoval/a minulý rok a povedlo se to?","Minulý rok jsem plánoval/a koupit auto a povedlo se to."],["Co jste už pro své plány udělal/a?","Už jsem si našel/našla kurz a přihlásil/a jsem se na zkoušku."],["Co uděláte hned po zkoušce?","Po zkoušce si odpočinu a oslavím to s rodinou."],["Co byste chtěl/a změnit ve svém životě?","Chtěl/a bych mít víc času na rodinu a sport."]]},{"cz":"Děti a výchova","t":["Діти й виховання","Children","Дети и воспитание","Con cái và nuôi dạy"],"qa":[["Máte děti?","Ano, mám syna, je mu devět let."],["Kam chodí vaše děti do školy?","Syn chodí do základní školy v našem městě."],["Co dělají vaše děti ve volném čase?","Syn hraje fotbal a hraje hry na počítači."],["Chodí vaše dítě na nějaký kroužek?","Ano, chodí na fotbal dvakrát týdně a na angličtinu."],["Kdo vozí děti do školy?","Do školy syna vozí manžel, odpoledne ho vyzvedávám já."],["Jak se vaše dítě učí?","Syn se učí dobře, nejvíc ho baví matematika."],["Co jste dělali s dětmi minulý víkend?","Minulý víkend jsme byli s dětmi v zoo a na zmrzlině."],["Jak jste omluvil/a dítě ze školy, když bylo nemocné?","Napsal/a jsem učitelce zprávu přes aplikaci školy."],["Co budou dělat děti o prázdninách?","O prázdninách pojede syn na tábor a potom k babičce."],["Jakou práci byste chtěl/a pro své dítě?","Chtěl/a bych, aby syn měl zajímavou práci, třeba jako lékař."]]},{"cz":"Sousedé a dům","t":["Сусіди й будинок","Neighbours and the building","Соседи и дом","Hàng xóm và tòa nhà"],"qa":[["Znáte své sousedy?","Znám některé sousedy, zdravíme se na chodbě."],["Jací jsou vaši sousedé?","Moji sousedé jsou milí a tiší, jen jeden má hlučného psa."],["Pomáháte si se sousedy?","Ano, když jsme na dovolené, sousedka nám zalévá květiny."],["Kolik pater má váš dům?","Náš dům má osm pater a výtah."],["Kdo uklízí ve vašem domě?","Chodbu uklízí paní z úklidové firmy jednou týdně."],["Máte nějaký problém v domě?","Někdy nefunguje výtah a musíme chodit pěšky."],["Měl/a jste někdy problém se sousedem?","Jednou sousedé dělali v noci párty a bylo hodně hlučno."],["Co jste udělal/a?","Šel/šla jsem k nim a slušně jsem je poprosil/a, aby byli tišeji."],["Pozvete sousedy na návštěvu?","Ano, na Vánoce pozveme sousedy na cukroví."],["Jaké sousedy byste chtěl/a mít?","Chtěl/a bych sousedy, kteří jsou přátelští a tiší."]]},{"cz":"Auto a řízení","t":["Авто й водіння","Cars and driving","Авто и вождение","Ô tô và lái xe"],"qa":[["Máte řidičský průkaz?","Ano, mám řidičský průkaz už patnáct let."],["Jaké máte auto?","Mám starší Škodu Octavii, je modrá."],["Jak často jezdíte autem?","Autem jezdím každý den do práce a o víkendu na nákup."],["Kolik stojí benzín?","Benzín stojí asi třicet osm korun za litr."],["Kde parkujete?","Parkuju před domem, kde je parkoviště pro obyvatele."],["Kdy jste dělal/a řidičák?","Řidičák jsem dělal/a na Ukrajině, když mi bylo dvacet."],["Měl/a jste někdy nehodu?","Ano, jednou jsem měl/a malou nehodu na parkovišti, nikomu se nic nestalo."],["Zastavila vás někdy policie?","Jednou mě zastavila policie a chtěla vidět doklady."],["Kdy pojedete do servisu?","Do servisu pojedu příští týden přezout pneumatiky na zimu."],["Jaké auto byste si chtěl/a koupit?","Chtěl/a bych si koupit velké rodinné auto."]]},{"cz":"Domácí práce","t":["Домашні справи","Housework","Домашние дела","Việc nhà"],"qa":[["Kdo u vás doma uklízí?","Doma uklízíme všichni, každý má svou práci."],["Co děláte doma nejraději?","Nejraději vařím, nerad/a žehlím."],["Jak často uklízíte?","Velký úklid děláme jednou týdně, v sobotu."],["Co dělají děti doma?","Syn si uklízí pokoj a vynáší odpadky."],["Kdo u vás pere prádlo?","Prádlo pere manželka, já ho věším."],["Třídíte odpad?","Ano, třídíme papír, plast a sklo."],["Co jste dělal/a doma včera?","Včera jsem umyl/a okna a vyluxoval/a jsem."],["Co jste opravoval/a doma naposledy?","Naposledy jsem opravoval/a kapající kohoutek v kuchyni."],["Co musíte doma udělat zítra?","Zítra musím vyžehlit košile a nakoupit."],["Jakou domácí práci byste nechtěl/a dělat?","Nechtěl/a bych mýt nádobí, proto chci myčku."]]},{"cz":"Zdravý životní styl","t":["Здоровий спосіб життя","A healthy lifestyle","Здоровый образ жизни","Lối sống lành mạnh"],"qa":[["Žijete zdravě?","Snažím se žít zdravě, ale ne vždycky to jde."],["Co jíte zdravého?","Jím hodně zeleniny, ovoce a piju vodu."],["Kolik hodin spíte?","Spím asi sedm hodin, ale chtěl/a bych víc."],["Kouříte?","Ne, nekouřím, přestal/a jsem před třemi lety."],["Jak odpočíváte po práci?","Po práci si lehnu, poslouchám hudbu nebo jdu na procházku."],["Kolik chodíte denně pěšky?","Denně chodím asi pět kilometrů, mám to v telefonu."],["Co jste změnil/a, abyste byl/a zdravější?","Přestal/a jsem pít sladké limonády a začal/a jsem plavat."],["Kdy jste naposledy byl/a na preventivní prohlídce?","Na prohlídce jsem byl/a letos v březnu."],["Co pro své zdraví uděláte tento týden?","Tento týden budu chodit spát dřív a nebudu jíst sladké."],["Co je podle vás nejdůležitější pro zdraví?","Podle mě je nejdůležitější dobrý spánek a pohyb."]]},{"cz":"Problémy a pomoc","t":["Проблеми й допомога","Problems and getting help","Проблемы и помощь","Sự cố và nhờ giúp đỡ"],"qa":[["Jaké je číslo na záchrannou službu?","Číslo na záchrannou službu je 155, na policii 158 a evropské číslo 112."],["Komu voláte, když máte problém v bytě?","Když mám problém v bytě, volám majiteli bytu."],["Co děláte, když se ztratíte?","Když se ztratím, podívám se do mapy v telefonu nebo se zeptám lidí."],["Kdo vám pomáhá, když něčemu nerozumíte?","Pomáhá mi kolegyně Češka nebo překladač v telefonu."],["Co děláte, když ztratíte doklady?","Když ztratím doklady, jdu na policii seděli ve vlaku a dívali se z okna. Venku bylo hezky a svítilo slunce. Potom šli pěšky po cestě nahoru na kopec. Cesta byla dlouhá, ale příroda byla krásná. Najednou začalo pršet. Petr a Jana neměli deštník, a proto byli úplně mokří. Nakonec našli malou chatu. Sedli si ke stolu a pili horký čaj. Odpočívali a čekali, až přestane pršet.","om":[["1F686"],["1F97E","26F0"],["1F327"],["1F3E0","2615"]],"t":["Поїздка в гори","A trip to the mountains","Поездка в горы","Chuyến đi lên núi"],"cz":"Výlet na hory"},{"title":"Nehoda na kole","q":"Co se stalo včera panu Tichému?","pictures":["🚲 Muž jede ráno na kole do práce.","🐕💥 Na cestu vyběhne pes a muž spadne z kola.","🚑 Sanitka veze muže do nemocnice.","👨‍⚕️🦴 Lékař dává muži sádru na ruku."],"model":"Včera ráno jel pan Tichý na kole do práce. Bylo hezké počasí a on jel docela rychle. Najednou na cestu vyběhl velký pes. Pan Tichý chtěl zastavit, ale spadl z kola. Bolela ho ruka a nemohl vstát. Lidé na ulici zavolali sanitku. Sanitka přijela za deset minut a odvezla ho do nemocnice. V nemocnici ho vyšetřil lékař. Řekl mu, že má zlomenou ruku, a dal mu sádru. Pan Tichý musel zůstat šest týdnů doma.","om":[["1F6B2"],["1F415","1F4A5"],["1F691"],["1F468-200D-2695-FE0F","1F9B4"]],"t":["Аварія на велосипеді","A bike accident","Авария на велосипеде","Tai nạn xe đạp"],"cz":"Nehoda na kole"},{"title":"Ztracená peněženka","q":"Co se stalo včera panu Dvořákovi?","pictures":["🚌 Pan Dvořák jede ráno autobusem do práce.","👛❌ V práci zjistí, že nemá peněženku.","🏦💳 Volá do banky a blokuje platební kartu.","👮📄 Odpoledne je na policii a hlásí ztrátu dokladů."],"om":[["1F68C"],["1F45B","274C"],["1F3E6","1F4B3"],["1F46E","1F4C4"]],"model":"Včera ráno jel pan Dvořák autobusem do práce. V autobuse bylo hodně lidí. Když přišel do práce, chtěl si koupit kávu, ale zjistil, že nemá peněženku. Byl nervózní, protože v peněžence měl platební kartu, řidičský průkaz a povolení k pobytu. Nejdřív zavolal do banky a kartu zablokoval. Odpoledne šel na policii a nahlásil ztrátu dokladů. Policista napsal protokol. Večer mu zavolali z dopravního podniku, že peněženku někdo našel v autobuse.","t":["Загублений гаманець","A lost wallet","Потерянный кошелёк","Chiếc ví bị mất"],"cz":"Ztracená peněženka"},{"title":"Narozeniny","q":"Co dělala včera Marie?","pictures":["🎂 Marie ráno peče dort v kuchyni.","🎈 Odpoledne zdobí byt balonky.","🎁 Večer přijdou kamarádi s dárky.","🎶 Všichni zpívají a tancují."],"model":"Včera měla Marie narozeniny. Ráno vstala brzy a v kuchyni pekla čokoládový dort. Dort byl velký a moc voněl. Na dort dala jahody a šlehačku. Odpoledne zdobila byt. Dala do obýváku barevné balonky. Potom připravila jídlo a pití. Večer přišli kamarádi. Přinesli Marii dárky a květiny. Marie byla moc ráda. Potom všichni jedli dort, zpívali a tancovali. Oslava skončila až o půlnoci a všichni se měli dobře.","om":[["1F382"],["1F388"],["1F381"],["1F3B6"]],"t":["День народження","A birthday","День рождения","Sinh nhật"],"cz":"Narozeniny"},{"title":"Ztracený klíč","q":"Co se stalo včera panu Vlkovi?","pictures":["🚶 Muž jde večer z práce domů.","🔑❓ Před dveřmi hledá klíč v kapse a nemá ho.","📞 Volá zámečníkovi.","🔧🚪 Zámečník otvírá dveře a muž platí."],"model":"Včera večer šel pan Vlk z práce domů. Byl unavený a těšil se na večeři. Když přišel ke dveřím, hledal klíč. Hledal ho v kapse i v tašce, ale neměl ho. Asi ho zapomněl v práci. Pan Vlk nevěděl, co má dělat. Nakonec zavolal zámečníkovi. Zámečník přijel za půl hodiny. Otevřel dveře za pět minut. Pan Vlk mu musel zaplatit osm set korun a byl smutný.","om":[["1F6B6"],["1F511","2753"],["1F4DE"],["1F527","1F6AA"]],"t":["Загублений ключ","A lost key","Потерянный ключ","Chiếc chìa khóa bị mất"],"cz":"Ztracený klíč"},{"title":"U lékaře","q":"Co se stalo včera Olze?","pictures":["🤒 Olga ráno leží v posteli, je jí špatně.","📞 Volá do ordinace.","👩‍⚕️ Lékařka ji vyšetřuje.","💊 V lékárně kupuje léky."],"model":"Včera ráno se Olga necítila dobře. Ležela v posteli, bolela ji hlava a měla horečku. Do práce nemohla jít. Zavolala do ordinace a objednala se k lékařce. Sestra jí řekla, ať přijde v deset hodin. Lékařka Olgu vyšetřila. Řekla jí, že má chřipku, a napsala jí recept. Potom šla Olga do lékárny. Koupila si léky a čaj. Doma si lehla a celý den odpočívala.","om":[["1F912"],["1F4DE"],["1F469-200D-2695-FE0F"],["1F48A"]],"t":["У лікаря","At the doctor's","У врача","Ở chỗ bác sĩ"],"cz":"U lékaře"},{"title":"Pracovní den","q":"Co dělal včera Ivan?","pictures":["⏰ Ivan vstává ve čtyři ráno.","🏭 Ve skladu nakládá krabice.","🍽️ V poledne obědvá s kolegy.","🛋️ Večer odpočívá doma a dívá se na televizi."],"model":"Včera vstal Ivan už ve čtyři hodiny ráno. Rychle se oblékl, vypil kávu a jel do práce. Pracuje ve velkém skladu. Celé dopoledne nakládal těžké krabice do kamionu. Práce byla náročná, ale šla dobře. V poledne obědval s kolegy v jídelně. Dal si polévku a guláš. Povídali si o fotbale. Večer byl Ivan moc unavený. Odpočíval doma na gauči a díval se na televizi.","om":[["23F0"],["1F3ED"],["1F37D"],["1F6CB"]],"t":["Робочий день","A working day","Рабочий день","Một ngày làm việc"],"cz":"Pracovní den"},{"title":"Na úřadě","q":"Co dělal včera pan Kovač?","pictures":["🏛️ Pan Kovač čeká ve frontě na úřadě.","📝 Vyplňuje formulář.","📷 Fotí se na nový doklad.","🪪 Úřednice mu dává potvrzení."],"model":"Včera šel pan Kovač na úřad, protože potřeboval nový doklad. Na úřadě bylo hodně lidí. Musel dlouho čekat ve frontě, skoro hodinu. Potom vyplnil formulář. Napsal tam svoje jméno, adresu a datum narození. Některé věci nevěděl, tak se zeptal úřednice. Potom se musel vyfotit na nový doklad. Fotka byla hotová hned. Nakonec mu úřednice dala potvrzení. Řekla mu, že si doklad může vyzvednout za měsíc.","om":[["1F3DB"],["1F4DD"],["1F4F7"],["1FAAA"]],"t":["В установі","At the office","В учреждении","Ở cơ quan"],"cz":"Na úřadě"},{"title":"Vánoce","q":"Co dělala rodina Petrenkových na Štědrý den?","pictures":["🎄 Ráno zdobí stromeček.","🍪 Odpoledne pečou cukroví.","🐟🥔 Večer jedí kapra s bramborovým salátem.","🎁 Pod stromečkem rozbalují dárky."],"model":"Na Štědrý den byla rodina Petrenkových celý den doma. Ráno zdobili vánoční stromeček. Děti dávaly na stromeček koule a světýlka. Odpoledne pekli cukroví. Maminka dělala těsto a děti vykrajovaly hvězdičky. Celý byt krásně voněl. Večer jedli kapra s bramborovým salátem. Byla to tradiční česká večeře. Potom šli ke stromečku a rozbalovali dárky. Děti dostaly nové hračky a knihy. Všichni byli moc šťastní a večer zpívali koledy.","om":[["1F384"],["1F36A"],["1F41F","1F954"],["1F381"]],"t":["Різдво","Christmas","Рождество","Giáng sinh"],"cz":"Vánoce"},{"title":"Nehoda na parkovišti","q":"Co se stalo včera paní Novotné?","pictures":["🚗🛒 Paní Novotná přijede autem na parkoviště u supermarketu.","💥🚙 Když couvá, narazí do jiného auta.","📞👮 Volá policii.","📝🪪 S majitelem druhého auta vyplňují formulář pro pojišťovnu."],"om":[["1F697","1F6D2"],["1F4A5","1F698"],["1F4DE","1F46E"],["1F4DD","1FAAA"]],"model":"Včera odpoledne jela paní Novotná autem na nákup. Přijela na parkoviště u supermarketu. Když potom couvala, neviděla jiné auto a narazila do něj. Auto mělo rozbité světlo. Paní Novotná byla vyděšená, ale nikomu se nic nestalo. Majitel druhého auta byl naštvaný. Paní Novotná zavolala policii. Policie přijela za dvacet minut a zkontrolovala doklady. Nakonec paní Novotná a majitel druhého auta vyplnili formulář pro pojišťovnu a odjeli domů.","t":["ДТП на парковці","An accident in a car park","ДТП на парковке","Va chạm ở bãi đỗ xe"],"cz":"Nehoda na parkovišti"},{"title":"Záchranka","q":"Co se stalo včera babičce?","pictures":["👵🏠 Babička je doma a v kuchyni upadne.","📱 Vnuk volá na číslo 155.","🚑 Za deset minut přijede sanitka.","🏥🧑‍⚕️ V nemocnici lékař babičku vyšetří."],"om":[["1F475","1F3E0"],["1F4F1"],["1F691"],["1F3E5","1F468-200D-2695-FE0F"]],"model":"Včera dopoledne byla babička doma a vařila oběd. V kuchyni byla mokrá podlaha a babička upadla. Bolela ji noha a nemohla vstát. Naštěstí byl doma vnuk. Hned zavolal na číslo 155 a řekl, co se stalo a kde bydlí. Za deset minut přijela sanitka. Záchranáři babičku odvezli do nemocnice. V nemocnici ji lékař vyšetřil a udělal rentgen. Noha nebyla zlomená, jen naražená. Večer mohla babička jet domů.","t":["Швидка допомога","The ambulance","Скорая помощь","Xe cấp cứu"],"cz":"Záchranka"},{"title":"Nový byt","q":"Co dělali minulý týden Ivan a Olena?","pictures":["💻 Hledají byt na internetu.","🏢 Prohlížejí byt s majitelem.","✍️ Podepisují nájemní smlouvu.","🔑😊 Dostávají klíče a jsou šťastní."],"model":"Minulý týden hledali Ivan a Olena nový byt. Večer seděli u počítače a hledali byt na internetu. Našli hezký byt blízko centra. Potom šli na prohlídku. Majitel jim ukázal kuchyň, ložnici a balkon. Byt se jim moc líbil, protože byl světlý a čistý. Druhý den podepsali nájemní smlouvu. Zaplatili kauci a první nájem. Nakonec od majitele dostali klíče. Byli moc šťastní, protože konečně měli vlastní bydlení.","om":[["1F4BB"],["1F3E2"],["270D"],["1F511","1F60A"]],"t":["Нова квартира","A new flat","Новая квартира","Căn hộ mới"],"cz":"Nový byt"},{"title":"Zkouška z češtiny","q":"Co dělala minulý měsíc Oksana?","pictures":["📖 Oksana se večer učí česky.","🏫 Jde na zkoušku do jazykové školy.","✍️ Píše test.","🎉📜 Dostane certifikát a slaví s rodinou."],"model":"Minulý měsíc dělala Oksana zkoušku z češtiny. Každý večer se učila česky. Četla texty, poslouchala nahrávky a psala e-maily. V sobotu ráno šla na zkoušku do jazykové školy. Byla trochu nervózní. Nejdřív psala test, čtení, psaní a poslech. Test byl těžký, ale zvládla ho. Za měsíc dostala certifikát, že zkoušku udělala. Byla moc ráda a hned zavolala manželovi. Večer to oslavila s rodinou v restauraci.","om":[["1F4D6"],["1F3EB"],["270D"],["1F389","1F4DC"]],"t":["Іспит з чеської","The Czech exam","Экзамен по чешскому","Kỳ thi tiếng Séc"],"cz":"Zkouška z češtiny"},{"title":"Oprava kola","q":"Co dělal v sobotu Matvij s tátou?","pictures":["🚲💨 Kolo má prázdnou pneumatiku.","🛒 Táta a syn kupují v obchodě novou duši.","🔧 Spolu opravují kolo před domem.","🚴‍♂️😄 Syn jede na kole a je šťastný."],"model":"V sobotu chtěl Matvij jet na kole, ale kolo mělo prázdnou pneumatiku. Byl smutný, protože nemohl jet. Řekl to tátovi. Táta a Matvij šli do obchodu se sportovními potřebami. Koupili tam novou duši a pumpičku. Potom spolu opravovali kolo před domem. Táta vyměnil duši a Matvij pumpoval pneumatiku. Nakonec bylo kolo v pořádku. Matvij jel na kole po ulici. Byl moc šťastný a poděkoval tátovi.","om":[["1F6B2","1F4A8"],["1F6D2"],["1F527"],["1F6B4-200D-2642-FE0F","1F604"]],"t":["Ремонт велосипеда","Fixing a bike","Ремонт велосипеда","Sửa xe đạp"],"cz":"Oprava kola"},{"title":"Voda v koupelně","q":"Co se stalo včera paní Horákové?","pictures":["🚿 Paní Horáková se ráno chce osprchovat.","⚠️🛁 Z trubky v koupelně teče voda na zem.","📞🏠 Volá majiteli bytu.","🔧👷 Odpoledne přijde instalatér a trubku opraví."],"om":[["1F6BF"],["26A0","1F6C1"],["1F4DE","1F3E0"],["1F527","1F477"]],"model":"Včera ráno se paní Horáková chtěla osprchovat. Když přišla do koupelny, viděla, že z trubky teče voda na zem. Rychle zavřela vodu a ručníkem utírala podlahu. Bála se, že voda poteče k sousedům dolů. Potom zavolala majiteli bytu a všechno mu vysvětlila. Majitel slíbil, že pošle instalatéra. Odpoledne instalatér přišel a trubku opravil. Paní Horáková musela jít do práce později, ale byla ráda, že je všechno v pořádku.","t":["Вода у ванній","Water in the bathroom","Вода в ванной","Nước trong phòng tắm"],"cz":"Voda v koupelně"},{"title":"Návštěva babičky","q":"Co dělali v neděli Lukáš a jeho máma?","pictures":["🚌 Jedou autobusem na vesnici.","👵🤗 Babička je vítá u domu.","🥧 Spolu jedí koláč na zahradě.","🍎🧺 Sbírají jablka ze stromu."],"model":"V neděli jeli Lukáš a jeho máma za babičkou. Jeli autobusem na vesnici, cesta trvala hodinu. Lukáš se díval z okna na pole a lesy. Babička je čekala před domem. Když je viděla, objala je a byla moc ráda. Potom šli na zahradu. Babička upekla jablečný koláč. Všichni ho jedli a pili čaj. Odpoledne sbírali jablka ze stromu. Lukáš si odvezl domů plnou tašku jablek.","om":[["1F68C"],["1F475","1F917"],["1F967"],["1F34E","1F9FA"]],"t":["У гостях у бабусі","Visiting grandma","В гостях у бабушки","Thăm bà"],"cz":"Návštěva babičky"},{"title":"Stěhování do Česka","q":"Jak se rodina Kovalenkových stěhovala do Česka?","pictures":["🧳 Balí kufry na Ukrajině.","🚌 Jedou dlouho autobusem.","🏢 Přijedou do Kralup a vidí nový byt.","🏫 Syn jde první den do české školy."],"model":"Rodina Kovalenkových se stěhovala z Ukrajiny do Česka. Doma balili kufry. Vzali si oblečení, doklady a pár hraček pro syna. Potom jeli autobusem do Česka. Cesta byla dlouhá, trvala skoro dva dny. Všichni byli unavení. Nakonec přijeli do Kralup. Uviděli svůj nový byt, byl malý, ale hezký. Za týden šel syn poprvé do české školy. Byl nervózní, ale učitelka byla milá a den byl dobrý.","om":[["1F9F3"],["1F68C"],["1F3E2"],["1F3EB"]],"t":["Переїзд до Чехії","Moving to Czechia","Переезд в Чехию","Chuyển đến Séc"],"cz":"Stěhování do Česka"},{"title":"Policejní kontrola","q":"Co se stalo včera večer panu Novákovi?","pictures":["🚗🌙 Pan Novák jede večer autem z práce domů.","🚓👮 Policie ho zastaví na silnici.","🪪📄 Policista chce vidět řidičský průkaz a doklady od auta.","💶 Pan Novák jel moc rychle a platí pokutu."],"om":[["1F697","1F319"],["1F693","1F46E"],["1FAAA","1F4C4"],["1F4B6"]],"model":"Včera večer jel pan Novák autem z práce domů. Byl unavený a spěchal, protože chtěl vidět fotbal. Na silnici za městem ho zastavila policie. Policista řekl dobrý večer a chtěl vidět řidičský průkaz, technický průkaz a pojištění. Pan Novák mu všechno ukázal. Potom mu policista řekl, že jel moc rychle, místo padesáti jel sedmdesát. Pan Novák musel zaplatit pokutu tisíc korun. Domů už jel pomalu a fotbal viděl jen v televizi.","t":["Поліцейська перевірка","A police check","Полицейская проверка","Cảnh sát kiểm tra"],"cz":"Policejní kontrola"},{"title":"Den zkoušky","q":"Co dělal Andrij v den emné, ale netrvalo to dlouho. Doma si vzal lék proti bolesti a šel spát.","cz":"U zubaře"},{"title":"Reklamace bot","t":["Повернення взуття","Returning shoes","Возврат обуви","Đổi trả giày"],"q":"Co se stalo paní Malé s novými botami?","pictures":["👟 Paní Malá si v obchodě kupuje nové boty.","🌧️ Venku prší a boty jsou mokré a rozbité.","🧾📄 Doma hledá účtenku.","🛍️ V obchodě boty vrací a dostává nové."],"om":[["1F45F","1F6CD"],["1F327","1F45F"],["1F4C4"],["1F6CD","1F60A"]],"model":"Minulý týden si paní Malá koupila v obchodě nové sportovní boty. Stály tisíc dvě stě korun. Ve středu pršelo a když šla do práce, boty se rozbily a byly úplně mokré. Paní Malá byla naštvaná. Doma našla účtenku a druhý den šla do obchodu. Prodavačce vysvětlila, co se stalo. Prodavačka se omluvila a dala jí nové boty. Nakonec byla paní Malá spokojená.","cz":"Reklamace bot"},{"title":"Zpožděný vlak","t":["Потяг запізнюється","A delayed train","Опоздание поезда","Tàu bị trễ"],"q":"Jak včera cestoval pan Kříž do Brna?","pictures":["🚉 Pan Kříž čeká na nádraží na vlak do Brna.","⏳ Vlak má zpoždění jednu hodinu.","☕ Pan Kříž pije kávu a čte noviny.","🚆 Do Brna přijíždí pozdě večer."],"om":[["1F689"],["23F3"],["2615","1F4D6"],["1F686","1F319"]],"model":"Včera odpoledne jel pan Kříž na služební cestu do Brna. Přišel na nádraží a koupil si jízdenku. Potom slyšel hlášení, že vlak má zpoždění jednu hodinu. Pan Kříž zavolal kolegovi, že přijede později. Mezitím si v kavárně dal kávu a četl noviny. Nakonec vlak přijel a pan Kříž nastoupil. Do Brna přijel až pozdě večer a byl hodně unavený.","cz":"Zpožděný vlak"},{"title":"Ztracený pes","t":["Загублений пес","The lost dog","Потерявшаяся собака","Chú chó bị lạc"],"q":"Co se stalo včera rodině Novákových?","pictures":["🐕🌳 Rodina je se psem v parku.","❓ Pes uteče a rodina ho nemůže najít.","📱 Syn píše na internet a volá sousedům.","🏠🐕 Večer pes čeká před domem."],"om":[["1F415","1F333"],["2753"],["1F4F1"],["1F3E0","1F415"]],"model":"Včera odpoledne šla rodina Novákových se psem Bobem do parku. Bob běhal a hrál si s míčem. Najednou uviděl kočku a utekl. Rodina ho hledala celou hodinu, ale nenašla ho. Všichni byli smutní. Syn napsal zprávu na internet a táta volal sousedům. Večer, když se vrátili domů, Bob seděl před domem a čekal na ně. Všichni byli moc šťastní.","cz":"Ztracený pes"},{"title":"Piknik","t":["Пікнік","The picnic","Пикник","Buổi dã ngoại"],"q":"Jak dopadl piknik rodiny Horákových?","pictures":["🧺 Rodina připravuje jídlo na piknik.","🌳 V parku sedí na dece a jí.","🌧️ Začne pršet.","☂️🏠 Rodina utíká domů a jí doma."],"om":[["1F9FA","1F956"],["1F333","1F9FA"],["1F327"],["2614","1F3E0"]],"model":"V sobotu ráno chtěla rodina Horákových jít na piknik. Maminka připravila chlebíčky, ovoce a limonádu a dala všechno do košíku. V poledne šli do parku a sedli si na deku pod strom. Jedli a povídali si. Najednou začalo pršet. Rychle všechno zabalili a utíkali domů. Doma byli mokří, ale smáli se. Nakonec měli piknik v obýváku na koberci.","cz":"Piknik"},{"title":"Ranní spěch","t":["Ранковий поспіх","A morning rush","Утренняя спешка","Buổi sáng vội vàng"],"q":"Co se stalo včera ráno panu Veselému?","pictures":["⏰😴 Budík zvoní, ale pan Veselý spí.","🏃 V osm hodin se probudí a rychle se obléká.","🚌 Běží na autobus, ale autobus odjíždí.","🏢 Do práce přijde pozdě."],"om":[["23F0","1F634"],["1F3C3"],["1F68C","1F68F"],["1F3E2","1F552"]],"model":"Včera ráno pan Veselý zaspal. Budík zvonil v šest, ale on ho neslyšel, protože byl unavený. Probudil se až v osm hodin. Rychle se oblékl, nesnídal a běžel na zastávku. Když tam přišel, autobus právě odjížděl. Musel čekat dvacet minut na další. Do práce přišel o hodinu později. Šéf nebyl spokojený, ale pan Veselý se omluvil a slíbil, že si koupí nový budík.","cz":"Ranní spěch"},{"title":"Pečení dortu","t":["Випікання торта","Baking a cake","Выпечка торта","Nướng bánh"],"q":"Co dělala včera Lenka?","pictures":["🥚 Lenka kupuje vajíčka, mouku a čokoládu.","🍰 Doma peče dort podle receptu."," <script>
(function(){
const D = JSON.parse(document.getElementById('learn-data').textContent);
const LANGS = ['uk','en','ru','vi'], LI = {uk:0,en:1,ru:2,vi:3};
let lang = (new URLSearchParams(location.search).get('lang') || '').toLowerCase();
if(!(lang in LI)){ try{ lang = localStorage.getItem('a2-learn-lang') || ''; }catch(e){} }
if(!(lang in LI)) lang = 'uk';
try{ localStorage.setItem('a2-learn-lang', lang); }catch(e){}
document.documentElement.lang = lang;
const t = k => (D.ui[k] || [k])[LI[lang]] || (D.ui[k] || [k])[0];
const th = (u, part) => ((D.theory[u] || {})[lang] || (D.theory[u] || {}).uk || {})[part] || '';
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const track = (n, p) => { try{ if(typeof gtag === 'function') gtag('event', n, p || {}); }catch(e){} };
const fold = x => String(x).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

/* header */
$('#backLink').textContent = t('back'); $('#backLink').href = '/zkouska-a2/' + (lang === 'uk' ? '' : lang + '/');
$('#langs').innerHTML = LANGS.map(l => `<a href="?lang=${l}${location.hash}" ${l === lang ? 'aria-current="page"' : ''}>${{uk:'UA',en:'EN',ru:'RU',vi:'VI'}[l]}</a>`).join('');
function isDark(){ const a = document.documentElement.getAttribute('data-theme'); return a ? a === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); }
function themeUI(){ const b = $('#themeBtn'), d = isDark(); b.textContent = d ? '☀️' : '🌙'; b.title = d ? t('themeL') : t('themeD'); b.setAttribute('aria-label', b.title); }
$('#themeBtn').addEventListener('click', () => { const v = isDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', v); try{ localStorage.setItem('a2-theme', v); }catch(e){} themeUI(); });
themeUI();

/* progress */
let DONE = {}; try{ DONE = JSON.parse(localStorage.getItem('a2-learn-done') || '{}') || {}; }catch(e){ DONE = {}; }
const saveDone = () => { try{ localStorage.setItem('a2-learn-done', JSON.stringify(DONE)); }catch(e){} };

/* speech synthesis */
const hasTTS = 'speechSynthesis' in window; let VOICE = null;
function pickVoice(){ if(!hasTTS) return; const v = speechSynthesis.getVoices().filter(x => /^cs/i.test(x.lang)); VOICE = v.find(x => /google|natural|online/i.test(x.name)) || v[0] || null; }
if(hasTTS){ pickVoice(); try{ speechSynthesis.addEventListener('voiceschanged', pickVoice); }catch(e){} }
function speak(text, slow){ if(!hasTTS) return; try{ speechSynthesis.cancel(); }catch(e){}
  const u = new SpeechSynthesisUtterance(text); u.lang = 'cs-CZ'; if(VOICE) u.voice = VOICE; u.rate = slow ? 0.7 : 0.92;
  setTimeout(() => { try{ speechSynthesis.speak(u); }catch(e){} }, 60); }

/* speech recognition */
const SRC = window.SpeechRecognition || window.webkitSpeechRecognition; let SR = null;
const srNorm = x => fold(x).replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
function srMerge(list){ const out = []; for(const tx of list){ const n = srNorm(tx); if(!n) continue; const p = out.length ? srNorm(out[out.length-1]) : null;
  if(p !== null && n.startsWith(p)) out[out.length-1] = tx; else if(p !== null && (p.startsWith(n) || p.endsWith(n))) continue; else out.push(tx); } return out; }
const STOP = new Set('a i v ve na se je jsem jsi jsme jste to ten ta do z ze k ke s so o u po za pro ale protoze kdyz jak co kde kdy uz jen tak taky take moc velmi mi me mu ji jim nas vas'.split(' '));
function feedback(said, model, q){
  const W = srNorm(said).split(' ').filter(Boolean), M = new Set(srNorm(model).split(' ').filter(w => w.length > 2 && !STOP.has(w)));
  const common = [...new Set(W)].filter(w => M.has(w));
  const qv = srNorm(q).split(' ').filter(w => w.length > 3 && !STOP.has(w)).map(w => w.slice(0, 4));
  const verbHit = qv.some(st => W.some(w => w.startsWith(st)));
  const items = [`<li class="${W.length >= 6 ? 'ok' : 'no'}">${W.length} ${t('fbWords')}. ${W.length >= 6 ? t('fbOk') : t('fbShort')}</li>`,
    `<li class="${verbHit ? 'ok' : 'no'}">${verbHit ? t('fbVerb') : t('fbNoVerb')}</li>`];
  if(common.length) items.push(`<li class="ok">✓ ${esc(common.slice(0, 6).join(', '))}</li>`);
  return `<ul class="fb">${items.join('')}</ul>`; }
const PAST_X = new Set('fotbal fotbalu kostel hotel mobil michal pavel karel pavla karla anil kolo kola kole kolem skola skolu skoly skole skolka stul stolu stole sul mel? dal? hotel hotelu ale jedli? mala malo male mali maly cela celo cely celi dila dilo vila sila pila? zela'.split(' ').filter(w => !w.endsWith('?')));
const isPast = w => w.length > 2 && /(l|la|lo|li|ly)$/.test(w) && !PAST_X.has(w) && !/(ell|all|ill)$/.test(w);
function pastMark(text){ return esc(text).replace(/[A-Za-zÀ-ž]+/g, w => isPast(fold(w)) ? `<mark>${w}</mark>` : w); }
function feedback3(said){
  const W = srNorm(said).split(' ').filter(Boolean), past = W.filter(isPast).length;
  const conn = [...new Set(W.filter(w => /^(nejdriv|nejprve|potom|pak|nakonec|najednou|kdyz|vecer|rano|odpoledne|vcera)$/.test(w)))];
  return `<ul class="fb"><li class="${W.length >= 60 ? 'ok' : 'no'}">${W.length} ${t('fbWords')} ${W.length >= 60 ? '✓' : '· ' + t('fb3len')}</li>
  <li class="${past >= 6 ? 'ok' : 'no'}">${t('fb3past')}: ${past} ${past >= 6 ? '✓' : '· ' + t('fb3pastMore')}</li>
  <li class="${conn.length >= 2 ? 'ok' : 'no'}">${t('fb3conn')}: ${conn.length ? esc(conn.join(', ')) : '–'} ${conn.length >= 2 ? '✓' : '· Nejdřív… Potom… Nakonec…'}</li></ul>`; }
function srToggle(btn, out, model, q, kind){
  if(SR){ const same = SR.btn === btn; SR.user = true; try{ SR.rec.stop(); }catch(e){} if(same) return; }
  if(!SRC){ out.innerHTML = `<p class="note">${t('noSR')}</p>`; return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  const st = {btn, finals: [], user: false, t0: Date.now()}; const label = btn.textContent;
  const start = () => { const rec = new SRC(); rec.lang = 'cs-CZ'; rec.continuous = true; rec.interimResults = true; st.rec = rec; const base = st.finals.slice();
    rec.onresult = e => { let fin = [], it = ''; for(let i = 0; i < e.results.length; i++){ const r = e.results[i], tx = (r[0].transcript || '').trim(); if(!tx) continue; if(r.isFinal) fin.push(tx); else if(i >= e.resultIndex) it += ' ' + tx; }
      st.finals = srMerge(base.concat(fin)); out.innerHTML = `<p class="heard">${esc(st.finals.join(' · '))} <i>${esc(it)}</i></p>`; };
    rec.onerror = e => { if(e.error === 'no-speech' || e.error === 'aborted') return; st.user = true; out.innerHTML = `<p class="note">${t('noSR')}</p>`; };
    rec.onend = () => { if(!st.user && Date.now() - st.t0 < 120000){ try{ start(); return; }catch(err){} }
      if(SR === st) SR = null; btn.classList.remove('on'); btn.textContent = label;
      if(st.tm){ clearInterval(st.tm); st.tm = null; }
      const said = st.finals.join('. ');
      out.innerHTML = said ? `<p class="heard"><b>${t('heard')}:</b> ${esc(said)}</p>${kind === 'u3' ? feedback3(said) : kind === 'u2' ? feedback2(said) : kind === 'u4' ? feedback4(said) : feedback(said, model, q)}` : `<p class="note">${t('nothing')}</p>`; };
    rec.start(); };
  try{ start(); }catch(err){ out.innerHTML = `<p class="note">${t('noSR')}</p>`; return; }
  SR = st; btn.classList.add('on'); btn.textContent = t('stop'); out.innerHTML = `<p class="note">${t('listening')}</p>`; track('learn_speak', {kind: kind || 'u1'});
  const tmEl = btn.closest('.sheet') && btn.closest('.sheet').querySelector('.tmr');
  if(kind === 'u3' && tmEl){ const t0 = Date.now(); tmEl.classList.remove('over'); st.tm = setInterval(() => { const left = 60 - Math.floor((Date.now() - t0) / 1000);
    tmEl.textContent = left > 0 ? '⏱ 0:' + String(left).padStart(2, '0') : '⏱ 0:00 · ' + t('timeUp'); if(left <= 0){ tmEl.classList.add('over'); clearInterval(st.tm); st.tm = null; } }, 250); }
}

/* videos */
function vidHTML(list){ if(!list || !list.length) return '';
  return `<details class="sec"><summary>🎬 ${t('videos')}</summary><div class="body"><div class="vids">${list.map(v => `<div class="vid"><div class="ph"><button class="btn primary" type="button" data-vid="${esc(v[0])}">${t('vplay')}</button></div><div class="meta"><b>${esc(v[1])}</b><a class="small" href="https://www.youtube.com/watch?v=${esc(v[0])}" target="_blank" rel="noopener">${t('vyt')} ↗</a></div></div>`).join('')}</div><p class="note">${t('vnote')}</p></div></details>`; }

/* views */
const U = ['u1','u2','u3','u4'];
const ready = u => (D[u] || []).length > 0;
function home(){
  return `<section class="sheet"><div class="hero"><h1>📚 ${t('title')}</h1><p>${t('lead')}</p></div>
  <div class="cards">${U.map(u => { const n = (D[u] || []).length, d = (D[u] || []).filter((_, i) => DONE[u + '-' + i]).length;
    return `<a class="ucard ${u} ${ready(u) ? '' : 'off'}" href="#${u}"><b>${t(u)}</b><span class="small muted">${t(u + 'd')}</span>${ready(u) ? `<span class="small">${t('progress')}: ${d} / ${n}</span><div class="prog"><i style="width:${n ? d / n * 100 : 0}%"></i></div>` : `<span class="soon">${t('soon')}</span>`}</a>`; }).join('')}</div>
  <p class="note">${t('voiceNote')}</p>${vidHTML(D.videos.home)}</section>`; }
function lesson(u){
  const items = D[u] || [];
  return `<section class="sheet u ${u}"><a href="#" class="small">${t('home')}</a><h2>${t(u)}</h2>
  <details class="sec" open><summary>📋 ${t('how')}</summary><div class="body">${th(u, 'how')}</div></details>
  <details class="sec"><summary>🧩 ${t('grammar')}</summary><div class="body">${th(u, 'grammar')}<p class="note">${t('clickCz')}</p></div></details>
  <details class="sec"><summary>💡 ${t('tips')}</summary><div class="body">${th(u, 'tips')}</div></details>
  ${vidHTML(D.videos[u])}
  ${u === 'u1' ? `<div class="trainbox"><b>🎯 ${t('practice')}</b><p class="small">${t('practiceD')}</p><a class="btn primary" href="#${u}-train">${t('start')}</a></div>` : ''}
  ${u === 'u3' ? `<div class="trainbox"><b>🎯 ${t('practice3')}</b><p class="small">${t('practice3D')}</p><a class="btn primary" href="#${u}-train">${t('start')}</a></div>` : ''}
  <h3>${u === 'u3' ? t('stories') : u === 'u2' ? t('cards') : u === 'u4' ? t('situations') : t('topics')}</h3><p class="small muted">${u === 'u3' ? t('storiesd') : u === 'u2' ? t('cardsd') : u === 'u4' ? t('situationsd') : t('topicsd')}</p>
  <div class="tgrid">${items.map((it, i) => `<a class="tbtn ${DONE[u + '-' + i] ? 'done' : ''}" href="#${u}-${i}"><span>${esc(it.cz)}<span class="tr">${esc(it.t[LI[lang]] || it.t[0])}</span></span>${DONE[u + '-' + i] ? '<span class="ck">✓</span>' : ''}</a>`).join('')}</div></section>`; }
function qaHTML(q, a, n){
  return `<div class="qa"><div class="qrow"><span class="num">${n}.</span><button class="btn sm" type="button" data-say="${esc(q)}" aria-label="▶">▶</button><span class="qtext">${esc(q)}</span></div>
  <div class="acts"><button class="btn sm" type="button" data-show>${t('showA')}</button><button class="btn sm" type="button" data-sr data-model="${esc(a)}" data-q="${esc(q)}">${t('say')}</button></div>
  <div class="ans" hidden><button class="btn sm" type="button" data-say="${esc(a)}" aria-label="▶">▶</button><button class="btn sm" type="button" data-say="${esc(a)}" data-slow="1">${t('slow')}</button><p>${esc(a)}</p></div>
  <div class="srout"></div></div>`; }
function topic(u, i){
  const it = (D[u] || [])[i]; if(!it) return lesson(u);
  const k = u + '-' + i;
  return `<section class="sheet u ${u}"><a href="#${u}" class="small">${t('toList')}</a>
  <div><span class="small muted">${t(u)} · ${t('topic')} ${i + 1} / ${D[u].length}</span><h2>${esc(it.cz)}</h2><p class="muted">${esc(it.t[LI[lang]] || it.t[0])}</p></div>
  <div>${it.qa.map((p, n) => qaHTML(p[0], p[1], n + 1)).join('')}</div>
  <div class="acts"><button class="btn ${DONE[k] ? '' : 'primary'}" type="button" data-done="${k}">${DONE[k] ? t('unmarkL') : t('markL')}</button>${i + 1 < D[u].length ? `<a class="btn" href="#${u}-${i + 1}">${esc(D[u][i + 1].cz)} →</a>` : ''}</div></section>`; }
function storyHTML(it, exam){
  const sents = it.model.match(/[^.!?]+[.!?]+/g) || [it.model];
  return `<div class="story"><p class="q-text"><b>${esc(it.q)}</b> <button class="btn sm" type="button" data-say="${esc(it.q)}">▶</button></p>
  <div class="frames">${it.pictures.map((p, i) => { const m = p.match(/^(\S+)\s+(.*)$/), txt = m ? m[2] : p; const ic = (it.om && it.om[i]) || [];
    return `<figure class="frame"><span class="fn">${i + 1}</span><div class="scene">${ic.map((c, k) => `<img src="../img/om/${c}.svg" alt="" class="${k ? 'sub' : 'main'}">`).join('')}</div>${exam ? '' : `<figcaption><button class="btn sm" type="button" data-say="${esc(txt)}">▶</button><span>${esc(txt)}</span></figcaption>`}</figure>`; }).join('')}</div>
  <div class="acts"><button class="btn sm primary" type="button" data-sr data-kind="u3">${t('say3')}</button><span class="tmr mono">⏱ 1:00</span>${exam ? `<button class="btn sm" type="button" data-show>${t('showModel')}</button>` : ''}</div>
  <div class="srout"></div>
  <div class="ans model" ${exam ? 'hidden' : ''}><div class="acts"><b>${t('model3')}</b><button class="btn sm" type="button" data-say="${esc(it.model)}">▶</button><button class="btn sm" type="button" data-say="${esc(it.model)}" data-slow="1">${t('slow')}</button></div>
  <ol class="sents">${sents.map(x => `<li><button class="btn sm" type="button" data-say="${esc(x.trim())}" data-slow="1">▶</button> <span>${pastMark(x.trim())}</span></li>`).join('')}</ol>
  <p class="note">${t('pastNote')}</p></div></div>`; }
function story(u, i){
  const it = (D[u] || [])[i]; if(!it) return lesson(u); const k = u + '-' + i;
  return `<section class="sheet u ${u}"><a href="#${u}" class="small">${t('toList')}</a>
  <div><span class="small muted">${t(u)} · ${t('story')} ${i + 1} / ${D[u].length}</span><h2>${esc(it.cz)}</h2><p class="muted">${esc(it.t[LI[lang]] || it.t[0])}</p></div>
  ${storyHTML(it, false)}
  <div class="acts"><button class="btn ${DONE[k] ? '' : 'primary'}" type="button" data-done="${k}">${DONE[k] ? t('unmarkL') : t('markL')}</button>${i + 1 < D[u].length ? `<a class="btn" href="#${u}-${i + 1}">${esc(D[u][i + 1].cz)} →</a>` : ''}</div></section>`; }
function train3(u){ const i = Math.floor(Math.random() * D[u].length), it = D[u][i]; track('learn_train', {u});
  return `<section class="sheet u ${u}"><a href="#${u}" class="small">${t('toLesson')}</a><div class="trainbox"><b>🎯 ${t('practice3')}</b><p class="small">${t('practice3D')}</p></div><h2>${esc(it.cz)}</h2>${storyHTML(it, true)}<a class="btn primary" href="#${u}-train" data-retrain>${t('another')}</a></section>`; }
function feedback2(said){
  const W = srNorm(said).split(' ').filter(Boolean), T = W.join(' ');
  const qw = (T.match(/\b(kolik|kdy|kde|jak|muzu|mohu|muzete|mate|musim|je mozne|proc|ktery|ktera|ktere|od kolika|je tam|jsou tam|potrebuju)\b/g) || []).length;
  const ty = /\b(mas|muzes|chces|jsi|vis|budes|ahoj)\b/.test(T);
  return `<ul class="fb"><li class="${qw ? 'ok' : 'no'}">${qw ? t('fb2q') : t('fb2noq')}</li><li class="${ty ? 'no' : 'ok'}">${ty ? t('fb2ty') : t('fb2vy')}</li></ul>`; }
function card(u, i){
  const it = (D[u] || [])[i]; if(!it) return lesson(u); const k = u + '-' + i;
  return `<section class="sheet u ${u}"><a href="#${u}" class="small">${t('toList')}</a>
  <div><span class="small muted">${t(u)} · ${t('card')} ${i + 1} / ${D[u].length}</span><h2>${esc(it.situation)}</h2><p>${esc(it.goal)} <button class="btn sm" type="button" data-say="${esc(it.situation + ' ' + it.goal)}">▶</button></p></div>
  <div class="story"><b>${t('card2a')}</b>
  ${it.pairs.map((p, n) => `<div class="qa"><div class="qrow"><span class="num">${n + 1}.</span><span class="qtext">${esc(p[0])}</span></div>
    <div class="acts"><button class="btn sm" type="button" data-sr data-kind="u2" data-model="${esc(p[1])}">${t('say2')}</button><button class="btn sm" type="button" data-show>${t('showA')}</button></div>
    <div class="ans" hidden><button class="btn sm" type="button" data-say="${esc(p[1])}">▶</button><button class="btn sm" type="button" data-say="${esc(p[1])}" data-slow="1">${t('slow')}</button><p>${esc(p[1])}</p></div><div class="srout"></div></div>`).join('')}</div>
  <details class="sec"><summary>💬 ${t('dialog')}</summary><div class="body"><p class="note">${t('dialogD')}</p>
  ${it.dialog.map(x => `<div class="dl ${x[0] === 'T' ? 'ex' : 'me'}"><span class="who">${x[0] === 'T' ? t('examiner') : t('you')}</span><button class="btn sm" type="button" data-say="${esc(x[1])}">▶</button><span>${esc(x[1])}</span></div>`).join('')}</div></details>
  <div class="acts"><button class="btn ${DONE[k] ? '' : 'primary'}" type="button" data-done="${k}">${DONE[k] ? t('unmarkL') : t('markL')}</button>${i + 1 < D[u].length ? `<a class="btn" href="#${u}-${i + 1}">${esc(D[u][i + 1].cz)} →</a>` : ''}</div></section>`; }
function feedback4(said){
  const T = srNorm(said);
  const sug = (T.match(/\b(muzeme|pojdme|co kdybychom|co treba|chces|pujdeme|pojedeme|koupime|udelame|budeme)\b/g) || []).length;
  const why = /\bprotoze\b/.test(T), vy = /\b(mate|muzete|chcete|jste|vite|budete)\b/.test(T);
  return `<ul class="fb"><li class="${sug ? 'ok' : 'no'}">${sug ? t('fb4sug') : t('fb4nosug')}</li><li class="${why ? 'ok' : 'no'}">${why ? '✓ protože' : t('fb4why')}</li><li class="${vy ? 'no' : 'ok'}">${vy ? t('fb4vy') : t('fb4ty')}</li></ul>`; }
function sit(u, i){
  const it = (D[u] || [])[i]; if(!it) return lesson(u); const k = u + '-' + i; let n = 0;
  return `<section class="sheet u ${u}"><a href="#${u}" class="small">${t('toList')}</a>
  <div><span class="small muted">${t(u)} · ${t('situation')} ${i + 1} / ${D[u].length}</span><h2>${esc(it.cz)}</h2></div>
  <p class="q-text"><b>${esc(it.situation)}</b> <button class="btn sm" type="button" data-say="${esc(it.situation)}">▶</button></p>
  <div class="frames opts">${it.options.map((o, j) => `<figure class="frame"><span class="fn">${j + 1}</span><div class="scene">${o.om.map((c, q) => `<img src="../img/om/${c}.svg" alt="" class="${q ? 'sub' : 'main'}">`).join('')}</div><figcaption><button class="btn sm" type="button" data-say="${esc(o.label)}">▶</button><span>${esc(o.label)}</span></figcaption></figure>`).join('')}</div>
  <div class="story"><b>${t('dialog4')}</b><p class="note">${t('dialog4D')}</p>
  ${it.dialog.map(x => x[0] === 'T' ? `<div class="dl ex"><span class="who">${t('friend')}</span><button class="btn sm" type="button" data-say="${esc(x[1])}">▶</button><span>${esc(x[1])}</span></div>`
    : `<div class="qa me4"><div class="acts"><span class="who small muted">${t('you')} · ${++n}</span><button class="btn sm" type="button" data-sr data-kind="u4" data-model="${esc(x[1])}">${t('say')}</button><button class="btn sm" type="button" data-show>${t('showA')}</button></div><div class="ans" hidden><button class="btn sm" type="button" data-say="${esc(x[1])}">▶</button><p>${esc(x[1])}</p></div><div class="srout"></div></div>`).join('')}</div>
  <div class="acts"><button class="btn ${DONE[k] ? '' : 'primary'}" type="button" data-done="${k}">${DONE[k] ? t('unmarkL') : t('markL')}</button>${i + 1 < D[u].length ? `<a class="btn" href="#${u}-${i + 1}">${esc(D[u][i + 1].cz)} →</a>` : ''}</div></section>`; }
let TR = null;
function train(u){
  const items = D[u]; const pick = []; const idx = items.map((_, i) => i).sort(() => Math.random() - 0.5).slice(0, 2);
  idx.forEach(ti => { items[ti].qa.map((p, qi) => qi).sort(() => Math.random() - 0.5).slice(0, 4).sort((a, b) => a - b).forEach(qi => pick.push([ti, qi])); });
  TR = {u, pick, n: 0}; track('learn_train', {u}); return trainView(); }
function trainView(){
  const {u, pick, n} = TR; const items = D[u];
  if(n >= pick.length) return `<section class="sheet u ${u}"><a href="#${u}" class="small">${t('toLesson')}</a><div class="trainbox"><p class="big">🎉 ${t('done')}</p><a class="btn primary" href="#${u}-train" data-retrain>${t('again')}</a></div></section>`;
  const [ti, qi] = pick[n], it = items[ti], [q, a] = it.qa[qi];
  return `<section class="sheet u ${u}"><a href="#${u}" class="small">${t('toLesson')}</a>
  <div class="trainbox"><span class="small muted">${t('topic')}: <b>${esc(it.cz)}</b> · ${t('qOf')} ${n + 1} / ${pick.length}</span>
  <div class="qrow"><button class="btn sm" type="button" data-say="${esc(q)}">▶</button><span class="big">${esc(q)}</span></div>
  <div class="acts"><button class="btn sm" type="button" data-sr data-model="${esc(a)}" data-q="${esc(q)}">${t('say')}</button><button class="btn sm" type="button" data-show>${t('showA')}</button></div>
  <div class="ans" hidden><button class="btn sm" type="button" data-say="${esc(a)}">▶</button><p>${esc(a)}</p></div><div class="srout"></div>
  <button class="btn primary" type="button" data-next>${t('next')}</button></div></section>`; }

function route(){
  if(SR){ SR.user = true; try{ SR.rec.stop(); }catch(e){} SR = null; }
  try{ speechSynthesis.cancel(); }catch(e){}
  const h = location.hash.replace('#', ''); let html;
  let m;
  if(!h) html = home();
  else if((m = h.match(/^(u[1-4])-train$/)) && ready(m[1])){ if(m[1] === 'u3') html = train3(m[1]); else { html = train(m[1]); setTimeout(() => { const b = $('.trainbox [data-say]'); if(b) speak(b.dataset.say); }, 300); } }
  else if((m = h.match(/^(u[1-4])-(\d+)$/)) && ready(m[1])){ html = m[1] === 'u3' ? story(m[1], +m[2]) : m[1] === 'u2' ? card(m[1], +m[2]) : m[1] === 'u4' ? sit(m[1], +m[2]) : topic(m[1], +m[2]); track('learn_topic', {u: m[1], i: +m[2]}); }
  else if((m = h.match(/^(u[1-4])$/)) && ready(m[1])){ html = lesson(m[1]); track('learn_lesson', {u: m[1]}); }
  else html = home();
  $('#app').innerHTML = html; window.scrollTo({top: 0});
}
window.addEventListener('hashchange', route);
document.addEventListener('click', e => {
  const cz = e.target.closest('.cz'); if(cz){ speak(cz.textContent.replace(/[/]/g, ' ')); return; }
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.say){ speak(b.dataset.say, !!b.dataset.slow); return; }
  if(b.hasAttribute('data-show')){ const box = b.closest('.qa, .trainbox, .story').querySelector('.ans'); box.hidden = !box.hidden; b.textContent = box.hidden ? t('showA') : t('hideA'); return; }
  if(b.hasAttribute('data-sr')){ srToggle(b, b.closest('.qa, .trainbox, .story').querySelector('.srout'), b.dataset.model, b.dataset.q, b.dataset.kind); return; }
  if(b.dataset.done){ const k = b.dataset.done; if(DONE[k]) delete DONE[k]; else DONE[k] = 1; saveDone(); route(); return; }
  if(b.hasAttribute('data-next')){ TR.n++; $('#app').innerHTML = trainView(); const s = $('.trainbox [data-say]'); if(s) speak(s.dataset.say); return; }
  if(b.dataset.vid){ const ph = b.closest('.ph'); ph.outerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(b.dataset.vid)}?autoplay=1&rel=0" title="YouTube" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`; track('learn_video', {id: b.dataset.vid}); return; }
});
document.addEventListener('click', e => { const a = e.target.closest('[data-retrain]'); if(a && location.hash === a.getAttribute('href')){ e.preventDefault(); route(); } });
route();
})();
</script>
</body>
</html>
